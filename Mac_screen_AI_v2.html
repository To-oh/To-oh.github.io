<!--
    Prompt-Jangseung — 발표용 단일 페이지 프레젠테이션 (v2 리팩토링: 앱 레지스트리 방식)
    컨셉: macOS 데스크탑 UI — 메뉴바 + 홈(인트로) + 하단 Dock + 앱 창(Genie 열기/닫기)
    PC    : 1920x1080 고정 캔버스를 창 크기에 맞춰 균일 스케일 → 해상도가 달라도 배치가 동일
    모바일: (폭 880px 이하) 캔버스 스케일 해제, 모든 창을 세로로 펼친 스크롤형

    ★ 앱(페이지) 추가/삭제: 맨 아래 <script> 맨 위 "★ 수정 영역"의 APPS 배열에 객체 하나를 더하거나 지우면 끝.
       Dock 아이콘 · 창 · 숫자키 단축키(1~9, 배열 순서) · 메뉴바 앱 이름 · 모바일 섹션이 전부 자동으로 따라옵니다.
       앱 종류: chat / pipeline / impact / budget / summary / custom(자유 HTML)

    조작(PC): Dock 아이콘 클릭 = 앱 열기 · 창 좌상단 빨간 점 = 닫기 · 숫자 1~9 = N번째 앱 · 0/Esc = 홈
              chat 앱은 창을 클릭할 때마다 다음 대화, pipeline 앱은 빈 공간 클릭 = 숨은 박스 등장

    [코드 구조] 1) <style> CSS: "0. 토큰"~"12. PC 전용 1.3배 오버라이드" 번호 구역 (앱 개수와 무관, 거의 수정 불필요)
               2) <body> HTML: 메뉴바/홈/창/Dock 뼈대만 있고 내용은 JS 가 생성
               3) <script>: ★수정 영역(데이터) → 자동 생성/동작 로직(앱 종류별 TYPES, genie, Dock, 모바일)
    ⚠ 외부 폰트/이미지가 있다면 발표 장소의 네트워크에서 로드되는지 리허설로 확인하세요.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prompt-Jangseung — Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===================== 0. 토큰 ===================== */
:root{
  --bg:#050506;
  --surface:#131318;
  --surface-2:#1b1b22;
  --line:rgba(255,255,255,.10);
  --text:#ffffff;
  --muted:rgba(255,255,255,.56);
  --muted-2:rgba(255,255,255,.36);
  --accent:#5352ed;
  --accent-2:#8b8aff;
  --accent-soft:rgba(83,82,237,.16);
  --gold:#e8b34d;
  --gold-soft:rgba(232,179,77,.14);
  --green:#2ed573;
  /* 프롬프트정승 상징색 — 말차 라떼 그린 팔레트 (연한 크림 → 진한 말차) */
  --matcha-1:#f6faf1;
  --matcha-2:#bfe8a8;
  --matcha-3:#7ed99a;
  --matcha-4:#2f9e63;
  --matcha-soft:rgba(126,217,154,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--bg);}
body{color:var(--text);font-family:'Poppins','Noto Sans KR',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
body.mode-mobile{overflow-y:auto;overflow-x:hidden;height:auto;min-height:100%;}
button{font-family:inherit;}
::selection{background:var(--accent);color:#fff;}

/* ===================== 1. 스테이지 (PC 고정 스케일 캔버스) ===================== */
.stage-wrapper{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  /* [수정] 16:9보다 넓거나 좁은 화면에서 .stage가 균일 스케일되면서 남는 좌우(또는 상하)
     여백을 .stage 안쪽과 동일한 그라데이션으로 채운다. 색이 이어져 보여서 "빈 여백"이
     아니라 배경이 화면 전체로 자연스럽게 확장된 것처럼 보인다. 콘텐츠 자체는 그대로
     1920x1080 비율로 균일 스케일되므로 늘어짐/찌그러짐은 발생하지 않는다. */
  background:
    radial-gradient(circle at 14% 10%, rgba(83,82,237,.22), transparent 42%),
    radial-gradient(circle at 86% 90%, rgba(232,179,77,.16), transparent 42%),
    linear-gradient(160deg,#0b0b10,#050506);
}
.stage{
  position:relative;width:1920px;height:1080px;flex-shrink:0;
  transform-origin:center center;
  background:
    radial-gradient(circle at 14% 10%, rgba(83,82,237,.22), transparent 42%),
    radial-gradient(circle at 86% 90%, rgba(232,179,77,.16), transparent 42%),
    linear-gradient(160deg,#0b0b10,#050506);
  border-radius:26px;overflow:hidden;
  box-shadow:0 60px 140px rgba(0,0,0,.6), 0 0 0 10px #15151a, 0 0 0 12px rgba(255,255,255,.05);
}
.stage::before{ /* 카메라 노치 하우징 */
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:132px;height:28px;background:#0000003a;
  border-radius:0 0 14px 14px;
  z-index:50;
}
.stage::after{ /* 카메라 렌즈 */
  content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:9px;height:9px;border-radius:50%;background:#232328b8;
  box-shadow:0 0 0 1px rgba(255,255,255,.16);
  z-index:51;
}

/* ===================== 2. 메뉴바 ===================== */
.menubar{
  position:absolute;top:0;left:0;right:0;height:34px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:rgba(30,30,36,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);font-size:12.5px;color:rgba(255,255,255,.9);
}
.menubar .mb-left{display:flex;align-items:center;gap:20px;}
.menubar .mb-logo{width:13px;height:13px;opacity:.9;}
.menubar .mb-app{font-weight:700;}
.menubar .mb-item{color:rgba(255,255,255,.55);}
.menubar .mb-right{display:flex;align-items:center;gap:16px;color:rgba(255,255,255,.75);}
.menubar .mb-right svg{width:14px;height:14px;display:block;}
.menubar .mb-clock{color:rgba(255,255,255,.9);}

/* ===================== 3. 데스크탑(홈) 레이어 ===================== */
.desktop-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 150px;z-index:1;}
.desktop-layer .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:2px;color:var(--accent-2);background:var(--accent-soft);border:1px solid rgba(83,82,237,.35);padding:6px 14px;border-radius:30px;margin-bottom:24px;}
.desktop-layer h1{font-size:56px;font-weight:900;line-height:1.32;letter-spacing:-1px;margin-bottom:20px;}
.desktop-layer h1 .accent{color:var(--accent);}
.desktop-layer p{font-size:18px;color:var(--muted);line-height:1.75;max-width:600px;}
.desktop-layer p b{color:var(--text);font-weight:700;}
.desktop-hint{position:absolute;left:150px;bottom:150px;font-size:13px;color:var(--muted-2);display:flex;align-items:center;gap:8px;}
.desktop-hint svg{width:14px;height:14px;animation:hint-bounce 1.4s infinite;}
@keyframes hint-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}


/* ===================== 4. Dock (자석 확대 Dock) ===================== */
.dock-wrap{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;z-index:45;pointer-events:none;}
.dock{pointer-events:auto;padding:8px 10px;border-radius:18px;background:rgba(60,60,68,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);display:flex;align-items:flex-end;}
.dock li{list-style:none;position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;cursor:pointer;transform-origin:50% 100%;}
/*.dock li.is-home::after{content:'';position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.55);}*/
.dock li .ico{width:72%;height:72%;border-radius:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(0,0,0,.4);transition:transform .1s ease-out;}
.dock li .ico svg{width:52%;height:52%;color:#fff;}
.dock li[data-app="home"] .ico{background:linear-gradient(155deg,#6a69ff,#3b3ad6);}
.dock li[data-app="demo"] .ico{background:linear-gradient(155deg,#ff7a7a,#d43f5a);}
.dock li[data-app="pipeline"] .ico{background:linear-gradient(155deg,#f0bd5c,#c98f24);}
.dock li[data-app="resolved"] .ico{background:linear-gradient(155deg,#eaf7ec,#7ed99a 55%,#2f9e63);}
.dock li[data-app="impact"] .ico{background:linear-gradient(155deg,#c9a6ff,#7a5cd6);}
.dock li[data-app="plan"] .ico{background:linear-gradient(155deg,#f472b6,#b74575);}
.dock li[data-app="summary"] .ico{background:linear-gradient(155deg,#5ec8ff,#2f8fd6);}
.dock li .name{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,.9);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.9);font-size:11.5px;padding:6px 11px;border-radius:7px;white-space:nowrap;visibility:hidden;opacity:0;transition:opacity .15s ease;}
.dock li:hover .name{visibility:visible;opacity:1;}
.dock li.li-sep{width:1px;height:36px;margin:0 10px;background:rgba(255,255,255,.16);cursor:default;align-self:center;}
.dock li.li-sep:hover{transform:none;}
.dock li.is-open::after{content:'';position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.75);}

/* ===================== 5. 앱 창(App Window) 공통 + Genie 전환 ===================== */
.windows-layer{position:absolute;inset:0;z-index:30;pointer-events:none;}
.app-window{
  position:absolute;left:50%;top:47.5%;
  width:1910px;height:945px;
  display:none;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 50px 100px rgba(0,0,0,.55);
  pointer-events:auto;
  opacity:0;
}
.app-window.open{display:flex;}
.win-titlebar{height:42px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface-2);border-bottom:1px solid var(--line);}
.traffic-lights{display:flex;gap:8px;}
.tl{width:12px;height:12px;border-radius:50%;border:none;padding:0;cursor:pointer;opacity:.92;position:relative;}
.tl.red{background:#ff5f57;}
.tl.yellow{background:#febc2e;}
.tl.green{background:#28c840;}
.tl.red:hover::after{content:'×';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#4b0a08;line-height:1;}
.win-title{flex:1;text-align:center;font-size:12.5px;color:var(--muted);margin-right:56px;}
.win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:44px 56px;position:relative;}

/* ===================== 6. 창 내부 공통 헤더 ===================== */
.win-tag{font-weight:800;letter-spacing:3px;font-size:12.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.win-tag b{color:var(--accent);font-weight:900;}
h2.title-sm{font-weight:800;font-size:30px;line-height:1.3;margin-bottom:10px;letter-spacing:-.5px;}
.dot-accent{color:var(--accent);}
p.sub{font-size:16.5px;color:var(--muted);line-height:1.6;max-width:820px;font-weight:400;}
.gold{color:var(--gold);}

/* ===================== 7. AI 데모 (Claude 스타일 채팅) ===================== */
.chat-app{flex:1;display:flex;min-height:0;margin:-44px -56px -44px -56px;}
.chat-sidebar{width:220px;flex-shrink:0;background:var(--surface-2);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:8px;}
.chat-sidebar .new-chat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:18px;}
.chat-sidebar .new-chat svg{width:14px;height:14px;}
.chat-hist{font-size:12px;color:var(--muted-2);padding:8px 10px;border-radius:7px;}
.chat-hist.active{background:rgba(255,255,255,.06);color:var(--muted);}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-scroll{flex:1;overflow-y:auto;padding:40px 60px 20px;display:flex;flex-direction:column;gap:26px;}
.chat-row{display:flex;gap:14px;align-items:flex-start;opacity:0;transform:translateY(10px);transition:opacity .4s ease, transform .4s ease;}
.chat-row.reset-instant{transition:none !important;}
.chat-row.shown{opacity:1;transform:translateY(0);}
.chat-row.user{justify-content:flex-end;}
.chat-row.user .chat-bubble{background:var(--surface-2);border-radius:16px 16px 4px 16px;max-width:60%;}
.chat-row.ai{align-items:flex-start;}
.chat-avatar{width:26px;height:26px;border-radius:7px;background:linear-gradient(155deg,#ff7a7a,#d43f5a);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.chat-avatar svg{width:14px;height:14px;color:#fff;}
.chat-bubble{padding:13px 18px;font-size:15.5px;line-height:1.7;color:var(--text);}
.chat-bubble.thinking{display:flex;align-items:center;gap:9px;color:var(--muted);font-style:italic;font-size:14px;padding:0;}
.think-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:think-pulse 1s infinite ease-in-out;}
.think-dot:nth-child(2){animation-delay:.15s;}
.think-dot:nth-child(3){animation-delay:.3s;}
@keyframes think-pulse{0%,80%,100%{opacity:.25;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
.type-caret{display:inline-block;width:2px;height:1em;background:var(--text);margin-left:2px;vertical-align:-2px;animation:caret-blink .9s steps(1) infinite;}
@keyframes caret-blink{50%{opacity:0;}}
.chat-composer{flex-shrink:0;padding:16px 60px 26px;}
.composer-box{background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted);min-height:24px;}
.composer-box .send-dot{width:26px;height:26px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-left:auto;opacity:.4;transition:opacity .2s;}
.composer-box .send-dot.ready{opacity:1;}
.composer-box .send-dot svg{width:12px;height:12px;color:#fff;}

/* --- 다중 대화: 경고창 / 다음 대화 힌트 / 인디케이터 --- */
.chat-main{position:relative;cursor:pointer;}
.chat-bubble.answer-muted{color:var(--muted);font-style:italic;}
.chat-bubble.answer-bad{background:rgba(255,95,87,.08);border-left:3px solid #ff5f57;border-radius:0 16px 16px 0;padding-left:15px;}
.warn-box{display:flex;gap:12px;align-items:flex-start;background:rgba(255,95,87,.13);border:1px solid rgba(255,95,87,.5);border-radius:14px;padding:15px 20px;max-width:640px;}
.warn-box svg{width:20px;height:20px;color:#ff5f57;flex-shrink:0;margin-top:1px;}
.warn-box .warn-title{font-size:13px;font-weight:800;letter-spacing:.5px;color:#ff5f57;margin-bottom:4px;}
.warn-box .warn-text{font-size:14.5px;line-height:1.65;color:#ffb3af;font-weight:600;}
.demo-next-hint{position:absolute;right:30px;bottom:96px;font-size:12.5px;color:var(--muted);background:rgba(20,20,24,.9);border:1px solid var(--line);padding:8px 14px;border-radius:30px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:6;}
.demo-next-hint.show{opacity:1;}
.demo-next-hint svg{width:12px;height:12px;animation:hint-bounce-x 1.2s infinite;}
@keyframes hint-bounce-x{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}
.win-titlebar{position:relative;}
.demo-dots{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:6px;}
.demo-dots.show{display:flex;}
.demo-dots .ddot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .25s;}
.demo-dots .ddot.active{background:var(--accent-2);}
body.mode-mobile .demo-next-hint{display:none;}

/* --- 모든 대화 종료 후: macOS 스타일 시스템 경고창 --- */
.ux-alert-overlay{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s ease;pointer-events:none;}
.ux-alert-overlay.show{display:flex;opacity:1;pointer-events:auto;}
.ux-alert{width:440px;background:#2c2c31;border:1px solid rgba(255,255,255,.12);border-radius:11px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);transform:scale(.92);transition:transform .32s cubic-bezier(.2,.9,.25,1.15);}
.ux-alert-overlay.show .ux-alert{transform:scale(1);}
.ux-alert-titlebar{height:32px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 12px;background:rgba(255,255,255,.045);border-bottom:1px solid rgba(255,255,255,.08);position:relative;}
.ux-alert-title{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;}
.ux-alert-body{display:flex;gap:16px;align-items:flex-start;padding:28px 26px 22px;}
.ux-alert-body svg{width:36px;height:36px;flex-shrink:0;}
.ux-alert-msg{font-size:14.5px;line-height:1.65;color:#f2f2f2;font-weight:600;padding-top:5px;}
.ux-alert-actions{display:flex;justify-content:flex-end;padding:0 22px 22px;}
.ux-alert-actions button{background:#2c7cf0;color:#fff;border:none;font-size:13.5px;font-weight:600;padding:8px 24px;border-radius:6px;cursor:pointer;font-family:inherit;}
.ux-alert-actions button:hover{background:#1f6fe0;}
body.mode-mobile .ux-alert-overlay{display:none !important;}

/* --- 성공(해결) 알림창: ux-alert와 동일 구조, 색만 그린 계열 --- */
.ux-alert-actions button.ok-green{background:#1f8f5f;}
.ux-alert-actions button.ok-green:hover{background:#187a4f;}

/* ===================== 7b. 프로세스 카드 (해결 데모: 입력분석→필터링→재구성 단계 시각화) =====================
   Claude 자신이 도구를 쓰거나 단계를 밟는 것처럼, 답변 전에 내부 처리 과정을 하나씩 순서대로
   보여준다. JS(playResolved)가 각 .proc-step에 active → done 클래스를 순서대로 붙였다 떼며
   스피너를 체크마크로 바꾸고, .proc-detail에 shown 클래스를 붙여 설명을 페이드인시킨다. */
.process-card{display:flex;flex-direction:column;gap:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px;}
.proc-step{display:flex;gap:11px;align-items:flex-start;opacity:.32;transition:opacity .35s ease;}
.proc-step.active,.proc-step.done{opacity:1;}
.proc-icon{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.proc-spinner{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:var(--accent-2);animation:proc-spin .8s linear infinite;}
@keyframes proc-spin{to{transform:rotate(360deg);}}
.proc-check{display:none;width:12px;height:12px;color:var(--green);}
.proc-step.done .proc-spinner{display:none;}
.proc-step.done .proc-check{display:block;}
.proc-body{flex:1;min-width:0;}
.proc-label{font-size:13px;font-weight:700;color:var(--text);}
.proc-step:not(.active):not(.done) .proc-label{color:var(--muted);}
.proc-detail{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:4px;opacity:0;transform:translateY(4px);transition:opacity .35s ease, transform .35s ease;}
.proc-detail.shown{opacity:1;transform:translateY(0);}
.proc-template{margin-top:7px;display:flex;flex-direction:column;gap:6px;}
.pt-row{display:flex;gap:9px;align-items:baseline;}
.pt-tag{flex-shrink:0;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:#4fbf72;background:rgba(47,158,99,.15);border:1px solid rgba(47,158,99,.38);border-radius:5px;padding:2.5px 7px;text-transform:uppercase;font-family:'Poppins',sans-serif;}
.pt-text{color:var(--muted);line-height:1.55;font-size:12.5px;}
.chat-row.proc-row{transition:opacity .3s ease, transform .3s ease;}
.chat-row.proc-row.fade-out{opacity:0;transform:translateY(-6px);}
body.mode-mobile .process-card{max-width:100%;}

/* --- 해결 데모 전용 아바타: 배경 없이 클로드 로고처럼 방패 아이콘만, 말차 그라데이션 + '생각 중' 펄스 --- */
.chat-avatar.safe{
  width:30px;height:30px;
  background:none;
  box-shadow:none;
  position:relative;
  transition:filter .4s ease;
}
.chat-avatar.safe svg{width:23px;height:23px;filter:drop-shadow(0 2px 5px rgba(47,158,99,.45));}
.chat-avatar.safe.thinking{animation:avatar-breathe 1.5s ease-in-out infinite;}
.chat-avatar.safe.thinking::before,
.chat-avatar.safe.thinking::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1.4px solid rgba(143,211,154,.6);
  animation:avatar-ping 1.8s cubic-bezier(0,0,.2,1) infinite;
}
.chat-avatar.safe.thinking::after{animation-delay:.6s;border-color:rgba(207,238,184,.65);}
@keyframes avatar-breathe{
  0%,100%{filter:drop-shadow(0 2px 5px rgba(47,158,99,.45));}
  50%{filter:drop-shadow(0 2px 9px rgba(207,238,184,.85));}
}
@keyframes avatar-ping{
  0%{transform:scale(.9);opacity:.85;}
  70%,100%{transform:scale(1.7);opacity:0;}
}

/* ===================== 8. 파이프라인 창 (슬라이드 3: 해결책) =====================
   [전체 동작 원리]
   .pipe-row 안에 아래 순서로 7개 요소가 "한 줄"로 나란히 놓여 있다:
     [프롬프트 박스] - [화살표A] - [레이어 박스] - [화살표B] - [모델 박스] - [화살표C] - [응답 박스]
   평소(레이어 미공개 상태)에는 "화살표A"와 "레이어 박스"의 폭(width)이 0이라
   마치 존재하지 않는 것처럼 자리를 차지하지 않는다.
   → 화면에는 [프롬프트]—[화살표B, 56px]—[모델]—[화살표C, 56px]—[응답], 즉 박스 3개가 보인다.
   클릭하면 화살표A와 레이어 박스의 width를 CSS transition으로 0 → 정상 크기로 늘린다.
   .pipe-row가 justify-content:center로 "가운데 정렬"되어 있기 때문에,
   가운데 요소들이 넓어지면 브라우저가 알아서 왼쪽 요소는 왼쪽으로, 오른쪽 요소들은
   오른쪽으로 밀어낸다 — 좌표를 직접 계산해서 옮기는 JS 코드가 필요 없다.
   최종적으로 박스 4개(폭 206px로 전부 동일) + 화살표 3개(폭 56px로 전부 동일)가
   나란히 놓이므로 간격이 자동으로 균등해진다. */

.pipe-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:44px;} /* 박스 행 + 안내문구 + 하단 기능카드 2개를 세로로 쌓고 화면 중앙에 배치 */
.pipe-row{display:flex;align-items:center;justify-content:center;position:relative;cursor:default;} /* 박스/화살표를 한 줄로 배치하는 컨테이너. justify-content:center가 핵심 — 이 값 때문에 폭이 늘어나는 요소를 기준으로 좌우가 자동으로 밀림 */

/* ---- 박스 공통 스타일 (프롬프트 / 모델 / 응답 / 레이어 4개 모두 이 클래스를 기반으로 함) ---- */
.pipe-box{width:206px;padding:22px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;text-align:center;flex-shrink:0;transition:transform .2s ease;} /* flex-shrink:0 = 행이 좁아져도 박스 폭은 줄어들지 않게 고정 */
.pipe-box .pipe-icon{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.pipe-box .pipe-icon svg{width:17px;height:17px;color:var(--accent-2);}
.pipe-box h4{font-size:14.5px;font-weight:700;margin-bottom:5px;}
.pipe-box p{font-size:11.5px;color:var(--muted-2);line-height:1.5;}
/* 레이어가 등장하는 순간, 옆에 있던 "AI 모델" 박스가 오른쪽으로 살짝 튕기듯 흔들리며 시선을 끄는 연출용 애니메이션. JS에서 클릭 시 이 클래스를 잠깐(0.65초) 붙였다 뗀다 */
.pipe-box.model.nudge{animation:model-nudge .6s ease;}
@keyframes model-nudge{0%{transform:translateX(0);}30%{transform:translateX(10px);}60%{transform:translateX(-4px);}100%{transform:translateX(0);}}

/* ---- 화살표(점선 + 화살촉) ----
   기본 상태: width 56px로 고정폭. collapsed 클래스가 붙으면 width:0이 되어
   폭이 서서히 줄어들며 "접힌다"(= 자리를 차지하지 않게 된다).
   overflow:hidden이 있어야 폭이 줄어들 때 내부의 점선 배경이 잘려 보이지 않고
   자연스럽게 사라진다. */
.pipe-arrow{width:56px;height:2px;flex-shrink:0;position:relative;margin:0 -1px;overflow:hidden;
  background:repeating-linear-gradient(90deg, var(--muted-2) 0 7px, transparent 7px 13px); /* 점선(dashed) 느낌을 반복 그라디언트로 표현 */
  transition:width .7s cubic-bezier(.22,1.15,.32,1), opacity .22s ease;} /* width는 0.7초 동안 살짝 튕기듯(overshoot) 부드럽게, opacity는 0.22초로 빠르게 — 서로 다른 속도로 "화살표가 사라졌다 다시 자라나는" 느낌을 냄 */
.pipe-arrow::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);border-style:solid;border-width:5px 0 5px 7px;border-color:transparent transparent transparent var(--muted-2);} /* border 삼각형 트릭으로 만든 화살촉(▶). 항상 화살표 오른쪽 끝에 붙어 있음 */
.pipe-arrow.collapsed{width:0;} /* 화살표A의 "평소(닫힘)" 상태 — HTML에 기본으로 붙어 있음 */
.pipe-arrow.hide{opacity:0;} /* 클릭 순간 잠깐 투명하게 만들어 "연결이 끊어지는" 느낌을 주는 용도 (JS에서 0.22초만 붙였다 뗌) */

/* ---- 레이어 박스(숨겨져 있다가 클릭 시 나타나는 4번째 박스) ----
   평소: width 0 + padding 0 + opacity 0 → 완전히 접혀서 안 보이고 자리도 차지 않음.
   revealed 클래스가 붙으면 width 206px(다른 박스와 동일) + padding 정상 + opacity 1로 펼쳐짐.
   [NEW 뱃지 잘림 수정] 예전엔 overflow:hidden이 .pipe-box.layer(바깥 박스)에 직접 걸려 있어서,
   박스 밖으로 살짝 튀어나오게 배치한 "NEW" 뱃지(top:-11px, right:-8px)까지 함께 잘려나갔다.
   → overflow:hidden을 바깥 박스가 아니라 텍스트 reveal 전용의 안쪽 래퍼(.layer-clip)로 옮기고,
     뱃지는 그 바깥의 .pipe-box.layer 바로 아래(형제 요소)에 둬서 더 이상 잘리지 않게 했다.
   .layer-clip은 항상 부모(.pipe-box.layer)의 현재 폭에 맞춰(width:100%) 커지고, 그 안의
   .layer-inner는 폭이 174px로 "고정"되어 있어서, 바깥 박스가 0→206px로 넓어지는 동안
   .layer-clip에 가려져 있던 내용(아이콘/제목/설명)이 마치 커튼을 걷듯이 왼쪽부터 서서히 드러난다. */
.pipe-box.layer{width:0;padding:22px 0;border-width:1px;border-color:transparent;background:var(--gold-soft);opacity:0;position:relative;
  transition:width .7s cubic-bezier(.22,1.15,.32,1), padding .7s cubic-bezier(.22,1.15,.32,1), opacity .45s ease, border-color .5s ease;} /* width/padding은 화살표와 같은 0.7초 곡선으로 함께 자라 타이밍을 맞춤. overflow:hidden은 더 이상 여기 없음(뱃지가 잘리지 않도록) */
.pipe-box.layer .layer-clip{overflow:hidden;width:100%;} /* 텍스트 reveal 전용 클리핑 래퍼 — 부모 폭에 맞춰 자라며, 이 안에서만 내용이 잘려 보인다 */
.pipe-box.layer .layer-inner{width:174px;} /* 박스 안쪽 콘텐츠 폭을 고정값으로 못박아서, layer-clip이 좁을 때 글자가 찌그러지지 않고 "잘려서" 보이게 함 (드러나는 연출의 핵심) */
.pipe-box.layer .pipe-icon{background:rgba(232,179,77,.18);} /* 다른 박스와 구분되는 골드 톤 아이콘 배경 */
.pipe-box.layer .pipe-icon svg{color:var(--gold);}
.pipe-box.layer .badge-new{position:absolute;top:-11px;right:-8px;background:var(--gold);color:#171106;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;letter-spacing:.5px;box-shadow:0 6px 14px rgba(232,179,77,.4);opacity:0;transition:opacity .3s ease .45s;white-space:nowrap;z-index:2;} /* "NEW" 뱃지. transition-delay(.45s)를 줘서 박스가 어느 정도 펼쳐진 뒤에야 뱃지가 페이드인. .layer-clip의 형제로 옮겨졌으므로 더 이상 클리핑되지 않는다 */
.pipe-box.layer.revealed{width:206px;padding:22px 16px;opacity:1;border-color:rgba(232,179,77,.55);} /* JS가 클릭 시 부여하는 "펼쳐진" 상태 */
.pipe-box.layer.revealed .badge-new{opacity:1;}


.pipe-hint{text-align:center;font-size:12.5px;color:var(--muted-2);transition:opacity .4s ease;} /* "빈 공간을 클릭해보세요" 안내 문구 */
.pipe-hint.hidden{opacity:0;} /* 한 번 클릭해서 레이어가 열리면 더 이상 필요 없으므로 페이드아웃 */

.pipe-features{display:flex;gap:22px;justify-content:center;}
.pipe-feat{flex:1;max-width:410px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
.pipe-feat .f-tag{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gold);margin-bottom:8px;}
.pipe-feat h4{font-size:16.5px;font-weight:700;margin-bottom:6px;}
.pipe-feat p{font-size:13.5px;color:var(--muted);line-height:1.6;}

/* ===================== 8c. 차별점 & 기대효과 창 (Business Impact) =====================
   구조: impact-body 안에 두 레이어가 절대 위치로 겹쳐 있다.
     1) impact-triangle : 키워드 노드 3개가 삼각형으로 배치된 초기 화면
     2) impact-detail×3 : 노드를 클릭하면 해당 인덱스의 상세 설명 화면으로 전환됨
   전환은 opacity/transform 트랜지션만 사용(display:none을 쓰지 않아 부드럽게 겹쳐 보임),
   pointer-events로 숨겨진 레이어가 클릭을 가로채지 않게 막는다. */
/* ===================== 8c. 차별점 & 기대효과 창 (Business Impact) =====================
   구조: impact-body 안에 두 레이어가 절대 위치로 겹쳐 있다.
     1) impact-triangle : 원형 키워드 노드 3개가 삼각형으로 배치된 초기 화면.
        노드 위치는 JS(rAF 루프, 아래 "03b" 스크립트 참고)가 매 프레임 sin파 조합으로 계산해서
        left/top(px)에 직접 써준다 — 세 노드가 서로 다른 진폭/주기/방향으로 움직이기 때문에
        삼각형이 정삼각형↔둔각삼각형 등으로 계속 모습을 바꾼다. 연결선(SVG path)도 매 프레임
        같은 좌표로 다시 그려서 노드를 그대로 따라다닌다.
     2) impact-detail×3 : 노드를 클릭하면 해당 인덱스의 상세 설명 화면으로 전환됨
   전환은 opacity/transform 트랜지션만 사용(display:none을 쓰지 않아 부드럽게 겹쳐 보임),
   pointer-events로 숨겨진 레이어가 클릭을 가로채지 않게 막는다. */
.impact-body{flex:1;position:relative;min-height:0;}
.impact-triangle{position:absolute;inset:0;opacity:1;transition:opacity .3s ease;}
.impact-triangle.hide{opacity:0;pointer-events:none;}
/* 삼각형 전체에 은은한 말차그린 빛 웅덩이를 깔아 노드들이 허공의 한 지점에 떠있는 듯한 공간감을 만든다 */
.impact-triangle::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 62% 55% at 50% 45%, var(--matcha-soft), transparent 70%);pointer-events:none;}
.impact-tri-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 5px rgba(126,217,154,.3));}
/* 노드를 잇는 선(변) 3개 — 각 변의 stroke-width/opacity는 JS가 매 프레임 계산하는
   --edge-dep(0=멀리·1=가까이)에 연동되어, 가까운 변은 굵고 진하게 · 먼 변은 가늘고 흐리게 보인다 */
.impact-tri-edge{fill:none;stroke:url(#impactLineGrad);stroke-linejoin:round;stroke-linecap:round;
  stroke-width:calc(0.9px + var(--edge-dep,.5) * 1.7px);
  opacity:calc(.32 + var(--edge-dep,.5) * .48);
}
.impact-node{
  position:absolute;left:50%;top:50%;
  /* --dep(0=멀리·1=가까이)에 따라 살짝 커지거나 작아지도록 스케일을 얹는다 — 원근에 의한 크기 변화를 흉내 */
  transform:translate(-50%,-50%) scale(calc(.92 + var(--dep,.5) * .16));
  width:172px;height:172px;border-radius:50%;
  --dep:.5;
  /* 유리판에 말차 라떼가 살짝 비치는 느낌 — 하이라이트는 좁고 옅게, 나머지는 surface 톤 위에
     말차그린을 얇게 겹쳐 은은하게. (하이라이트를 크고 진하게 주면 플라스틱 구슬처럼 보여서 축소함) */
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.16), transparent 32%),
    linear-gradient(155deg, rgba(191,232,168,.10), rgba(47,158,99,.05) 55%, transparent 90%),
    var(--surface-2);
  border:1px solid rgba(126,217,154,.28);
  /* 그림자는 검정 대신 짙은 그린-블랙 톤으로, 외곽엔 말차그린 글로우를 얇게 둘러 배경과 자연스럽게 녹아들게 함 */
  box-shadow:
    0 calc(12px + var(--dep,.5) * 16px) calc(22px + var(--dep,.5) * 18px) calc(-10px - var(--dep,.5) * 4px) rgba(3,12,8,.6),
    0 0 calc(16px + var(--dep,.5) * 14px) rgba(126,217,154,calc(.08 + var(--dep,.5) * .14)),
    inset 0 1px 1px rgba(255,255,255,.09),
    inset 0 -1px 0 rgba(126,217,154,.18);
  filter:brightness(calc(.95 + var(--dep,.5) * .1));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:14px;text-align:center;cursor:pointer;
  transition:border-color .2s ease;
}
.impact-node:hover{border-color:var(--matcha-3);}
.impact-node .impact-node-num{font-size:19px;font-weight:900;color:var(--matcha-3);font-family:'Poppins',sans-serif;}
.impact-node .impact-node-label{font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.3;}
.impact-hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted-2);}
.impact-detail{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
}
.impact-detail.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.impact-detail-num{font-size:32px;font-weight:900;color:var(--accent);margin-bottom:10px;font-family:'Poppins',sans-serif;}
.impact-detail h3{font-size:23px;font-weight:800;margin-bottom:14px;letter-spacing:-.3px;max-width:640px;}
.impact-detail p{font-size:15px;color:var(--muted);line-height:1.75;max-width:640px;}
.impact-back{margin-top:24px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted-2);cursor:pointer;width:max-content;transition:color .2s ease;}
.impact-back:hover{color:var(--text);}
.impact-back svg{width:14px;height:14px;}

/* ===================== 9. 사업계획 창 (예산 도넛 그래프) =====================
   [도넛 그래프 원리] 이 도넛은 이미지가 아니라 <circle> 5개를 겹쳐 그린 SVG다.
   각 <circle>은 원래 꽉 찬 원이지만, stroke-dasharray(선 길이, 빈 공간 길이)를
   "차지할 비율만큼의 길이, 나머지는 투명"으로 설정하면 도넛의 한 "조각"처럼 보인다.
   여러 조각을 이어 붙이려면 stroke-dashoffset으로 시작점을 이전 조각들의 누적 길이만큼
   밀어주면 된다(실제 계산은 JS의 playDonut() 참고). donut-svg에 rotate(-90deg)를 걸어둔
   이유는 SVG 원의 그리기 시작점이 기본적으로 3시 방향이라, 12시 방향(시계 맨 위)부터
   시작하는 일반적인 도넛 차트처럼 보이게 하기 위함. 내부 숫자(donut-center-num)는
   부모가 이미 -90도 돌아가 있으므로 다시 +90도 돌려서 원래 방향(똑바로 선 숫자)으로 되돌린다. */
.plan-grid{flex:1;display:flex;align-items:center;gap:60px;}
.plan-left{flex:1;}
.plan-left .label{font-size:12px;letter-spacing:2px;color:var(--muted-2);font-weight:700;margin-bottom:12px;}
.plan-left .amount{font-size:60px;font-weight:900;letter-spacing:-2px;}
.plan-left .amount span{color:var(--accent);}
.plan-left .note{margin-top:8px;font-size:12.5px;color:var(--muted-2);}
.plan-left .desc{margin-top:22px;font-size:15px;color:var(--muted);line-height:1.7;max-width:400px;}
.plan-right{flex:1.15;display:flex;align-items:center;gap:36px;} /* 왼쪽 도넛 SVG + 오른쪽 범례(legend)를 가로로 배치 */
.donut-svg{flex-shrink:0;transform:rotate(-90deg);} /* 12시 방향부터 그려지도록 통째로 -90도 회전 */
.donut-seg{fill:none;stroke-width:24;stroke-linecap:round;opacity:0;stroke-dasharray:0 999;transition:stroke-dasharray 1.1s cubic-bezier(.25,1,.5,1), opacity .3s ease;} /* 조각 하나(원). 초기값은 길이 0(안 보임) — JS가 앱이 열릴 때마다 실제 길이로 애니메이션시킴 */
.donut-center-num{transform:rotate(90deg);} /* 부모(donut-svg)의 -90도 회전을 상쇄해 텍스트만 똑바로 보이게 함 */
.legend{display:flex;flex-direction:column;gap:13px;}
.legend-item{display:flex;align-items:center;gap:10px;font-size:13.5px;}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;} /* 도넛 조각과 같은 색의 작은 정사각형 — JS가 background를 인라인으로 채워줌 */
.legend-name{color:var(--text);font-weight:600;width:150px;}
.legend-pct{color:var(--muted);width:38px;}
.legend-amt{color:var(--muted-2);font-size:12px;}

/* ===================== 10. 요약 창 (마지막 슬라이드: 핵심 요약 카드 4개 + 마무리 문구) ===================== */
.summary-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.sum-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;gap:14px;align-items:flex-start;}

.summary-close{text-align:center;padding-top:8px;border-top:1px solid var(--line);}

/* ===================== 11. 모바일: 스크롤형 ===================== */
.mobile-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:900;display:none;width:0;}
body.mode-mobile .mobile-progress{display:block;}
body.mode-mobile .stage-wrapper{position:static;display:block;height:auto;overflow:visible;background:var(--bg);}
body.mode-mobile .stage{position:static;width:100%;height:auto;min-height:100vh;transform:none !important;border-radius:0;box-shadow:none;overflow:visible;} /* overflow:hidden(원본 .stage 규칙)을 visible로 풀어줌 — 이게 남아있으면 sticky/fixed 자식 요소의 위치 계산 기준이 꼬여서 독이 하단에 제대로 붙지 않는 원인이 됨 */
body.mode-mobile .stage::after{display:none;}
body.mode-mobile .menubar{position:sticky;top:0;}
body.mode-mobile .menubar .mb-item{display:none;}
/* [독 하단 고정 수정] 기존엔 position:sticky였는데, sticky는 조상 요소(.stage)의 overflow:hidden 때문에
   기준 스크롤 컨테이너 계산이 어긋나 "화면 하단에 계속 떠있기"가 안 되고 있었다.
   → position:fixed로 바꿔서 스크롤 위치와 무관하게 항상 뷰포트(화면) 맨 아래에 붙어있게 함.
   .stage-wrapper/.stage 모두 transform이 없는 상태(transform:none!important)라 fixed의 기준이
   진짜 브라우저 뷰포트가 되므로, 어떤 섹션을 보고 있든 독이 항상 그 자리에 떠 있다. */
body.mode-mobile .dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:14px 0 calc(12px + env(safe-area-inset-bottom)); /* 아이폰 하단 홈 인디케이터 영역(safe-area)만큼 여백을 더 줘서 독이 그 영역과 안 겹치게 함 */
  background:linear-gradient(0deg, var(--bg) 55%, transparent); /* 독 뒤로 콘텐츠가 스크롤돼 지나갈 때 자연스럽게 배경에 녹아들도록 하는 페이드 그라디언트 */
}
body.mode-mobile .desktop-layer{position:static;padding:60px 22px 44px;min-height:70vh;}
body.mode-mobile .desktop-layer h1{font-size:28px;}
body.mode-mobile .desktop-hint{display:none;}
body.mode-mobile .windows-layer{position:static;}
/* 독이 fixed로 바뀌면서 더 이상 문서 흐름(document flow) 안에서 자리를 차지하지 않으므로,
   페이지 맨 마지막 콘텐츠가 독 뒤에 가려지지 않도록 .stage 하단에 독 높이만큼 여백을 미리 확보해둔다.
   (독 실제 높이 약 72px + 위아래 padding 14px+12px + safe-area ≈ 넉넉히 110px로 계산) */
body.mode-mobile .stage{padding-bottom:110px;}
body.mode-mobile .app-window{
  display:flex !important;position:static;opacity:1 !important;transform:none !important;
  width:100%;height:auto;min-height:100vh;border-radius:0;border-top:1px solid var(--line);border-left:none;border-right:none;
}
body.mode-mobile .traffic-lights{pointer-events:none;}
body.mode-mobile .tl.red::after{content:none;}
body.mode-mobile .win-body{padding:32px 20px;overflow:visible;}
body.mode-mobile h2.title-sm{font-size:22px;}
body.mode-mobile p.sub{font-size:14px;}

body.mode-mobile .chat-app{margin:-32px -20px;flex-direction:column;}
body.mode-mobile .chat-sidebar{display:none;}
body.mode-mobile .chat-scroll{padding:24px 20px;}
body.mode-mobile .chat-row.user .chat-bubble{max-width:82%;}
body.mode-mobile .chat-composer{padding:12px 20px 20px;}

body.mode-mobile .pipe-row{flex-direction:column;gap:14px;}
body.mode-mobile .pipe-box{width:100%;max-width:280px;}
body.mode-mobile .pipe-box.layer{width:100%;max-width:280px;padding:22px 16px;opacity:1;border-color:rgba(232,179,77,.55);transition:none;}
body.mode-mobile .pipe-box.layer .layer-inner{width:auto;}
body.mode-mobile .pipe-box.layer .badge-new{opacity:1;}
body.mode-mobile .pipe-arrow{width:2px !important;height:26px;opacity:1 !important;background:repeating-linear-gradient(180deg, var(--muted-2) 0 7px, transparent 7px 13px);}

body.mode-mobile .pipe-hint{display:none;}
body.mode-mobile .pipe-features{flex-direction:column;}

body.mode-mobile .plan-grid{flex-direction:column;gap:32px;align-items:flex-start;}

body.mode-mobile .plan-right{flex-direction:column;width:100%;}
body.mode-mobile .donut-svg{width:190px;height:190px;}

/* ---- 차별점 & 기대효과 창(모바일): 삼각형 클릭 인터랙션 대신 3개 설명을 그냥 세로로 나열 ---- */
body.mode-mobile .impact-body{position:static;display:flex;flex-direction:column;gap:22px;}

/* =====================================================================
   12. PC 전용 1.3배 확대 오버라이드
   -----------------------------------------------------------------------
   목적: 발표(대형 화면) 시 Dock과 슬라이드(앱 창) 내부 요소들이 작아 보이는 문제.
   방식: body:not(.mode-mobile) 안에서만 적용 → 모바일(body.mode-mobile)은 절대 영향 없음.
         (특정성이 원본 규칙보다 항상 높아서 아래에서만 원본을 덮어씀. 순서 상관없이 안전.)
   범위: Dock, 데스크탑(홈) 인트로, 각 앱 창(win-body) 내부의 글자/아이콘/도형/그래프.
   의도적 제외: 메뉴바(34px 고정 높이라 잘릴 위험), macOS 경고 모달(높이 여유 없음).
   원리: 창(app-window) 자체 크기(1900x955)와 스테이지(1920x1080)는 그대로 유지하고,
         그 "안쪽" 콘텐츠만 1.3배로 키운다. 텍스트를 담는 박스의 max-width/width도
         함께 1.3배로 넓혀서 줄바꿈이 늘어나 세로로 넘치는 걸 최대한 방지했다.
         (파이프라인 박스 206px/화살표 56px/레이어 174px처럼 서로 비례가 맞아야 하는
         값들은 전부 정확히 1.3배로 함께 늘려서 기존 정렬/애니메이션 로직이 깨지지 않는다.)
   ===================================================================== */

/* ---- Dock ---- */
body:not(.mode-mobile) .dock{padding:10px 13px;border-radius:26px;}
body:not(.mode-mobile) .dock li{width:73px;height:73px;}
/* [중요] 위 .dock li 규칙이 body:not() 때문에 특이도가 높아져서,
   그냥 두면 구분선(.li-sep, 원래 width:1px)의 폭까지 73px로 덮어써버려
   독 중간에 큰 회색 사각형이 생기는 버그가 있었다. 폭을 다시 1px로 명시 고정. */
body:not(.mode-mobile) .dock li.li-sep{width:1px;height:47px;margin:0 13px;}
body:not(.mode-mobile) .dock li .ico{border-radius:17px;} /* 실제 macOS 스크린샷처럼 완만한 라운드 사각형으로 (아이콘 폭 43.8px 기준 약 39% 비율, 모바일 .ico 비율과 통일) */
body:not(.mode-mobile) .dock li .name{font-size:15px;padding:8px 14px;top:-52px;}

/* ---- AI 데모 (Claude 스타일 채팅) ---- */

/* ---- 프로세스 카드 (해결 데모) ---- */
body:not(.mode-mobile) .process-card{gap:18px;padding:23.5px 26px;max-width:832px;}

/* ---- 파이프라인 창 (박스/화살표/레이어 — 비례 유지) ---- */
body:not(.mode-mobile) .pipe-wrap{gap:57px;}

body:not(.mode-mobile) .pipe-box p{font-size:15px;}
body:not(.mode-mobile) .pipe-arrow{width:73px;}
body:not(.mode-mobile) .pipe-arrow::after{border-width:6.5px 0 6.5px 9px;}
/* [중요] 위의 일반 .pipe-box/.pipe-arrow 확대 규칙은 body:not()이 붙어 특이도가 높아져서,
   그대로 두면 "접힌 상태"(.collapsed, .pipe-box.layer 기본값)의 width:0 까지 덮어써버려
   레이어/화살표가 클릭 전부터 펼쳐진 채로 보이는 버그가 생긴다.
   그래서 접힌 상태 전용으로 특이도가 더 높은 규칙을 명시적으로 다시 선언해 원래 동작을 지킨다. */
body:not(.mode-mobile) .pipe-arrow.collapsed{width:0;}

body:not(.mode-mobile) .summary-body{gap:44px;}
body:not(.mode-mobile) .summary-grid{gap:23px;}
body:not(.mode-mobile) .sum-card{padding:26px 29px;gap:18px;}
body:not(.mode-mobile) .sum-card .num{font-size:29px;}
body:not(.mode-mobile) .sum-card h4{font-size:19.5px;margin-bottom:7px;}

/* ---- 차별점 & 기대효과 창 (Business Impact) ---- */

 *  ★ 수정 영역 끝 — 아래는 자동 생성/동작 로직 ★
 * ====================================================================== */

/* ---------- 공통 유틸 ---------- */
// HTML 이스케이프 (글에 특수문자가 있어도 안전)
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 이스케이프 + 간단 서식: \n 줄바꿈, [[보라 강조]], {{금색 강조}}, **굵게**
const rich = s => esc(s).replace(/\n/g, '<br>')
  .replace(/\[\[(.+?)\]\]/g, '<span class="accent">$1</span>')
  .replace(/\{\{(.+?)\}\}/g, '<span class="gold" style="font-weight:700;">$1</span>')
  .replace(/\*\*(.+?)\*\*/g, '<b style="color:var(--text);">$1</b>');
const pad2 = n => String(n).padStart(2, '0');
// 아이콘: 이름 → 24x24 선 아이콘 SVG. '<svg' 로 시작하면 그대로 사용
function iconSvg(name) {
  if (name && String(name).indexOf('<svg') === 0) return name;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || ICONS.star) + '</svg>';
}
// Dock 아이콘 배경색: 2색 또는 3색(중간색은 55% 지점) 그라데이션
const gradient = c => c.length >= 3 ? `linear-gradient(155deg,${c[0]},${c[1]} 55%,${c[2]})` : `linear-gradient(155deg,${c[0]},${c[1] || c[0]})`;
// 창 상단 공통 헤더(태그 / 제목 / 부제)
function header(app) {
  let h = '';
  if (app.tagBold || app.tagText) h += `<div class="win-tag"><b>${esc(app.tagBold || '')}</b>${app.tagText ? ' · ' + esc(app.tagText) : ''}</div>`;
  if (app.title) h += `<h2 class="title-sm">${rich(app.title)}<span class="dot-accent">.</span></h2>`;
  if (app.sub) h += `<p class="sub" style="margin-bottom:6px;">${rich(app.sub)}</p>`;
  return h;
}

/* ---------- 전역 상태 ---------- */
let isMobile = false;
let currentScale = 1;          // 스테이지(1920x1080) 축소/확대 배율
let currentOpenApp = null;     // 지금 열려 있는 앱 { name(id), windowEl, iconEl }
const controllers = {};        // 앱 id → 그 앱의 동작 객체 { open, close, mobile, mobileInit }
const windowsLayer = document.getElementById('windowsLayer');
const CENTER = 'translate(-50%,-50%)';
const appMenuName = {};        // 앱 id → 메뉴바에 표시할 이름
appMenuName.home = HOME.menuName || 'Finder';

/* ======================================================================
 *  앱 종류별 렌더러(render: 창 안쪽 HTML 생성) + 셋업(setup: 동작 연결)
 *  새 종류를 만들고 싶다면 TYPES 에 { render(app), setup(app, win) } 를 하나 더 추가하면 됩니다.
 *  setup 이 돌려주는 객체: open()/close() = PC에서 창을 열고 닫을 때, mobile() = 모바일에서 화면에 40% 보일 때
 * ====================================================================== */
const TYPES = {};

/* ───────────── chat : Claude 풍 대화 데모 ───────────── */
let gradUid = 0;   // 방패 아이콘의 그라데이션 id 가 겹치지 않도록 번호를 붙임
function avatarHtml(kind) {
  if (kind === 'safe') {
    const id = 'matchaGrad' + (++gradUid);
    return `<div class="chat-avatar safe"><svg viewBox="0 0 24 24"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f6faf1"/><stop offset="35%" stop-color="#bfe8a8"/><stop offset="70%" stop-color="#74c67e"/><stop offset="100%" stop-color="#2f9e63"/></linearGradient></defs><path fill="url(#${id})" d="M8.9 6.6h6.2v2.8H8.9z"/><path fill="url(#${id})" d="M2.2 7.5h19.6v1.9H2.2z"/><rect fill="url(#${id})" x="7.7" y="8.6" width="8.6" height="7.4" rx="3.6"/><rect fill="url(#${id})" x="9.5" y="15.6" width="5" height="7.8" rx="1"/><circle cx="10.2" cy="11.6" r=".65" fill="#fff"/><circle cx="13.8" cy="11.6" r=".65" fill="#fff"/><path fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" d="M12 12.4v1.3"/><path fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" d="M10 15c1.1.7 1.9.7 4 0"/></svg></div>`;
  }
  return '<div class="chat-avatar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></div>';
}
const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
// macOS 스타일 알림창 안의 아이콘
const ALERT_ICONS = {
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path fill="#f5c344" stroke="none" d="M12 2.7 22.4 20.8a1.3 1.3 0 0 1-1.1 2H2.7a1.3 1.3 0 0 1-1.1-2L12 2.7Z"/><path d="M12 9.4v5.1" stroke="#1c1c1f"/><circle cx="12" cy="17.4" r="0.15" stroke="#1c1c1f" stroke-width="2.1"/></svg>',
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9.3" fill="#1f8f5f" stroke="none"/><path d="M8 12.3l2.6 2.6L16.2 9" stroke="#fff" stroke-width="2"/></svg>'
};

TYPES.chat = {
  titlebarExtra: '<div class="demo-dots show"></div>',   // 제목줄 오른쪽 점 인디케이터 자리
  render: app => `
    <div class="chat-app">
      <div class="chat-sidebar">
        <div class="new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</div>
        ${(app.sidebar || []).map((t, i) => `<div class="chat-hist${i === 0 ? ' active' : ''}">${esc(t)}</div>`).join('')}
      </div>
      <div class="chat-main">
        <div class="chat-scroll"></div>
        <div class="chat-composer"><div class="composer-box"><span class="c-text">Type a message…</span><span class="send-dot">${ARROW_SVG}</span></div></div>
        <div class="demo-next-hint">${esc(app.nextHint || 'Click the window to see the next conversation')}${ARROW_SVG}</div>
      </div>
    </div>`,

  setup(app, win) {
    const scroll = win.querySelector('.chat-scroll'), composerText = win.querySelector('.c-text'),
          sendDot = win.querySelector('.send-dot'), nextHint = win.querySelector('.demo-next-hint'),
          dotsWrap = win.querySelector('.demo-dots');
    const convos = app.conversations || [];
    let idx = 0, timers = [], busy = false;   // idx: 지금 대화 번호 / timers: 예약된 setTimeout 모음 / busy: 타이핑 중이면 클릭 무시

    const clear = () => { timers.forEach(clearTimeout); timers = []; };
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));

    // 글자를 한 글자씩 채워 넣어 "타이핑되는" 효과 (끝에 깜빡이는 커서)
    function typeInto(el, text, speed, cb) {
      el.innerHTML = '<span class="type-caret"></span>';
      let i = 0;
      (function step() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i);
          const caret = document.createElement('span'); caret.className = 'type-caret'; el.appendChild(caret);
          i++; later(step, speed);
        } else { el.textContent = text; if (cb) cb(); }
      })();
    }
    // 제목줄 오른쪽 ●●● : 대화가 몇 개이고 지금 몇 번째인지
    function renderDots() {
      dotsWrap.innerHTML = convos.map((_, k) => `<span class="ddot${k === idx ? ' active' : ''}"></span>`).join('');
    }
    function addRow(cls, html) {
      const r = document.createElement('div'); r.className = 'chat-row ' + cls; r.innerHTML = html; scroll.appendChild(r); return r;
    }
    // 단계 카드: 스피너(진행 중) → 설명 페이드인 → 체크(완료) → 다음 단계
    function runSteps(stepEls, i, cb) {
      if (i >= stepEls.length) { cb(); return; }
      const el = stepEls[i]; el.classList.add('active');
      later(() => { el.querySelector('.proc-detail').classList.add('shown');
        later(() => { el.classList.add('done'); later(() => runSteps(stepEls, i + 1, cb), 260); }, 520); }, 380);
    }
    const stepsHtml = steps => steps.map((st, i) => {
      const body = st.template
        ? '<div class="proc-template">' + st.template.map(r => `<div class="pt-row"><span class="pt-tag">${esc(r.tag)}</span><span class="pt-text">${esc(r.text)}</span></div>`).join('') + '</div>'
        : esc(st.detail);
      return `<div class="proc-step" data-idx="${i}"><div class="proc-icon"><span class="proc-spinner"></span><svg class="proc-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="proc-body"><div class="proc-label">${esc(st.label)}</div><div class="proc-detail">${body}</div></div></div>`;
    }).join('');

    /* 대화 하나를 처음부터 끝까지 재생 (각 단계 사이의 ms 는 대화 리듬용 지연 시간)
       ① 입력창에 타이핑 → ② 전송 → ③ 사용자 말풍선 → ④ "생각 중…" 또는 단계 카드 → ⑤ 답변 타이핑 → ⑥ (있으면) 경고 박스 */
    function play() {
      clear(); busy = true; renderDots();
      nextHint.classList.remove('show');
      scroll.innerHTML = '';
      composerText.textContent = ''; sendDot.classList.remove('ready');
      const c = convos[idx]; if (!c) { busy = false; return; }
      const hasSteps = !!(c.steps && c.steps.length);

      // 이 대화에서 쓸 행(row)을 전부 미리 만들어 두고(투명), 순서대로 'shown' 을 붙여 나타나게 함
      const rUser = addRow('user', '<div class="chat-bubble">&nbsp;</div>');
      const userBubble = rUser.firstChild;
      const rMid = hasSteps
        ? addRow('ai proc-row', avatarHtml('safe') + `<div class="process-card">${stepsHtml(c.steps)}</div>`)
        : addRow('ai', avatarHtml(app.avatar) + `<div class="chat-bubble thinking"><span class="think-dot"></span><span class="think-dot"></span><span class="think-dot"></span>&nbsp;${esc(app.thinkingText || 'Thinking…')}</div>`);
      const rAns = addRow('ai', avatarHtml(app.avatar) + `<div class="chat-bubble${c.answerStyle ? ' answer-' + esc(c.answerStyle) : ''}">&nbsp;</div>`);
      const ansBubble = rAns.querySelector('.chat-bubble');
      const rWarn = c.warning ? addRow('ai', `<div class="warn-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div><div class="warn-title">${esc(c.warningTitle || 'Response failed')}</div><div class="warn-text">${esc(c.warning)}</div></div></div>`) : null;
      void scroll.offsetWidth;   // 강제 리플로우: 숨겨진 상태를 먼저 반영해야 이후 'shown' 이 트랜지션으로 재생됨

      const finish = () => { busy = false; nextHint.classList.add('show'); };
      const answer = () => {
        rAns.classList.add('shown');
        typeInto(ansBubble, c.answer || '', 10, () => {
          if (rWarn) later(() => { rWarn.classList.add('shown'); finish(); }, 550); else finish();
        });
      };

      later(() => {
        typeInto(composerText, c.prompt || '', 25, () => {
          sendDot.classList.add('ready');
          later(() => {
            composerText.textContent = ''; sendDot.classList.remove('ready');
            rUser.classList.add('shown'); userBubble.textContent = c.prompt || '';
            later(() => {
              rMid.classList.add('shown');
              if (hasSteps) {
                const av = rMid.querySelector('.chat-avatar'); av.classList.add('thinking');
                runSteps(Array.from(rMid.querySelectorAll('.proc-step')), 0, () => { av.classList.remove('thinking'); later(answer, 350); });
              } else {
                later(() => { rMid.classList.remove('shown'); answer(); }, 1000);
              }
            }, 200);
          }, 100);
        });
      }, 50);
    }

    // 마지막 대화 뒤 알림창 (endAlert 가 있을 때만)
    let overlay = null;
    const hideAlert = () => { if (overlay) overlay.classList.remove('show'); };
    if (app.endAlert) {
      const al = app.endAlert, kind = al.kind === 'success' ? 'success' : 'warn';
      overlay = document.createElement('div'); overlay.className = 'ux-alert-overlay';
      overlay.innerHTML = `<div class="ux-alert">
          <div class="ux-alert-titlebar"><div class="traffic-lights"><button class="tl red" type="button"></button><button class="tl yellow" type="button"></button><button class="tl green" type="button"></button></div><div class="ux-alert-title">${esc(al.title || app.windowTitle || app.name)}</div></div>
          <div class="ux-alert-body">${ALERT_ICONS[kind]}<div class="ux-alert-msg">${esc(al.message)}</div></div>
          <div class="ux-alert-actions"><button type="button" class="${kind === 'success' ? 'ok-green' : ''}">${esc(al.okLabel || 'OK')}</button></div>
        </div>`;
      windowsLayer.appendChild(overlay);
      // '확인' = 닫고 처음부터 다시 재생 / 빨간 점·어두운 배경 = 그냥 닫기
      overlay.querySelector('.ux-alert-actions button').addEventListener('click', e => { e.stopPropagation(); hideAlert(); idx = 0; play(); });
      overlay.querySelector('.tl.red').addEventListener('click', e => { e.stopPropagation(); hideAlert(); });
      overlay.addEventListener('click', e => { if (e.target === overlay) hideAlert(); });
    }

    // 창 안(닫기 버튼 제외)을 클릭하면 다음 대화. 마지막이면 알림창(PC) 또는 처음으로(모바일/알림창 없음)
    function next() {
      if (busy) return;
      if (idx === convos.length - 1) {
        if (isMobile || !overlay) { idx = 0; play(); return; }
        overlay.classList.add('show'); return;
      }
      idx++; play();
    }
    win.addEventListener('click', e => { if (!e.target.closest('.traffic-lights')) next(); });

    const start = () => { idx = 0; hideAlert(); play(); };
    return { open: start, mobile: start, close() { clear(); hideAlert(); } };
  }
};

/* ───────────── pipeline : 박스+화살표 흐름도 ───────────── */
TYPES.pipeline = {
  render: app => {
    const nodes = app.nodes || [];
    // 박스와 박스 사이에 화살표를 자동 삽입. hidden 박스 "앞"의 화살표는 함께 접힘(collapsed) 상태로 시작
    const row = nodes.map((n, i) => {
      const afterHidden = i > 1 && nodes[i - 1].hidden;   // hidden 박스 바로 다음 박스 = 등장 시 튕기는 대상(CSS .model)
      const arrow = i > 0 ? `<div class="pipe-arrow${n.hidden ? ' collapsed' : ''}"></div>` : '';
      const box = n.hidden
        ? `<div class="pipe-box layer"><span class="badge-new">${esc(n.badge || 'NEW')}</span><div class="layer-clip"><div class="layer-inner"><div class="pipe-icon">${iconSvg(n.icon)}</div><h4>${esc(n.title)}</h4><p>${esc(n.text)}</p></div></div></div>`
        : `<div class="pipe-box${afterHidden ? ' model' : ''}"><div class="pipe-icon">${iconSvg(n.icon)}</div><h4>${esc(n.title)}</h4><p>${esc(n.text)}</p></div>`;
      return arrow + box;
    }).join('');
    return header(app) + `<div class="pipe-wrap">
      <div class="pipe-row">${row}</div>
      <div class="pipe-hint">${esc(app.hint || '')}</div>
      <div class="pipe-features">${(app.features || []).map(f => `<div class="pipe-feat"><div class="f-tag">${esc(f.tag)}</div><h4>${esc(f.title)}</h4><p>${rich(f.text)}</p></div>`).join('')}</div>
    </div>`;
  },
  setup(app, win) {
    /* [원리] 박스/화살표는 한 줄(.pipe-row, 가운데 정렬)에 모두 놓여 있고, hidden 박스와 그 앞 화살표는 폭 0 으로 접혀 있다.
       클릭하면 폭을 0 → 정상 크기로 CSS transition 으로 늘리는데, 가운데 정렬이라 브라우저가 알아서 좌우 박스를 밀어낸다.
       JS 는 클래스를 붙였다 떼는 "상태 전환"만 담당하고, 움직임은 CSS 가 담당한다. */
    const row = win.querySelector('.pipe-row'), hint = win.querySelector('.pipe-hint');
    const layers = Array.from(win.querySelectorAll('.pipe-box.layer'));
    const before = layers.map(l => l.previousElementSibling);                                              // hidden 박스 앞 화살표
    const after  = layers.map(l => (l.nextElementSibling && l.nextElementSibling.classList.contains('pipe-arrow')) ? l.nextElementSibling : null);  // 뒤 화살표
    const nudge  = after.map(a => a ? a.nextElementSibling : null);                                        // 뒤 화살표 다음 박스(튕김 대상)

    function reset() {   // 창을 열 때마다 항상 "접힌" 초기 상태로
      layers.forEach(l => l.classList.remove('revealed'));
      before.forEach(a => a && a.classList.add('collapsed'));
      after.forEach(a => a && a.classList.remove('hide'));
      nudge.forEach(n => n && n.classList.remove('nudge'));
      hint.classList.remove('hidden');
    }
    row.addEventListener('click', e => {
      if (e.target.closest('.pipe-box')) return;                        // 박스 위 클릭은 무시 ("빈 공간"을 눌렀을 때만 동작)
      if (!layers.length || layers[0].classList.contains('revealed')) return;   // 이미 펼쳐졌으면 무시
      hint.classList.add('hidden');
      after.forEach(a => a && a.classList.add('hide'));                  // 0ms: 기존 연결선이 투명해지며 "끊어지는" 연출
      setTimeout(() => {                                                 // 220ms: 화살표 opacity 트랜지션(.22s)이 끝난 뒤
        after.forEach(a => a && a.classList.remove('hide'));             //   연결선 재연결
        before.forEach(a => a && a.classList.remove('collapsed'));       //   접혀 있던 화살표 성장
        layers.forEach(l => l.classList.add('revealed'));                //   hidden 박스 성장
        nudge.forEach(n => { if (n) { n.classList.add('nudge'); setTimeout(() => n.classList.remove('nudge'), 650); } });  // 다음 박스 살짝 튕김
      }, 220);
    });
    // 모바일은 클릭 연출 없이 항상 펼친 모습 (CSS 도 이를 강제)
    return { open: reset, mobileInit() { layers.forEach(l => l.classList.add('revealed')); } };
  }
};

/* ───────────── impact : 떠다니는 키워드 노드 → 상세 설명 ───────────── */
TYPES.impact = {
  render: app => {
    const items = app.items || [];
    const back = `<div class="impact-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>${esc(app.backLabel || 'Back')}</div>`;
    return header(app) + `<div class="impact-body">
      <div class="impact-triangle">
        <svg class="impact-tri-lines"><defs><linearGradient id="impactLineGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#bfe8a8"/><stop offset="100%" stop-color="#2f9e63"/></linearGradient></defs></svg>
        ${items.map((it, i) => `<div class="impact-node" data-idx="${i}"><div class="impact-node-num">${pad2(i + 1)}</div><div class="impact-node-label">${esc(it.label)}</div></div>`).join('')}
        <div class="impact-hint">${esc(app.hint || '')}</div>
      </div>
      ${items.map((it, i) => `<div class="impact-detail" data-idx="${i}"><div class="impact-detail-num">${pad2(i + 1)}</div><h3>${esc(it.title)}</h3><p>${esc(it.text)}</p>${back}</div>`).join('')}
    </div>`;
  },
  setup(app, win) {
    const tri = win.querySelector('.impact-triangle'), svg = win.querySelector('.impact-tri-lines');
    const nodes = Array.from(win.querySelectorAll('.impact-node')), details = Array.from(win.querySelectorAll('.impact-detail'));
    const N = nodes.length;

    /* [움직임 원리] 노드마다 base(컨테이너 대비 비율 좌표) + sin파 오프셋으로 매 프레임 위치를 계산한다.
       진폭/주기/위상이 노드마다 달라서 도형 모양(삼각형 등)이 계속 바뀌어 보이고, z(가상 깊이)로 크기/밝기/겹침 순서를 조절한다.
       3개일 때는 원본의 손으로 튜닝한 값을 그대로 쓰고, 그 외 개수는 타원 위에 균등 배치 + 규칙적으로 만든 값을 쓴다. */
    const PRESET3 = [
      { base: [0.50, 0.22], ampX: 22, ampY: 15, freqX: 0.50, freqY: 0.33, phaseX: 0.0, phaseY: 1.4, freqZ: 0.24, phaseZ: 0.6 },
      { base: [0.20, 0.74], ampX: 16, ampY: 24, freqX: 0.38, freqY: 0.61, phaseX: 2.6, phaseY: 0.2, freqZ: 0.31, phaseZ: 2.1 },
      { base: [0.80, 0.74], ampX: 25, ampY: 16, freqX: 0.27, freqY: 0.47, phaseX: 4.3, phaseY: 3.3, freqZ: 0.19, phaseZ: 4.0 }
    ];
    const params = nodes.map((_, i) => {
      if (N === 3) return PRESET3[i];
      const ang = -Math.PI / 2 + i * 2 * Math.PI / Math.max(N, 1);
      return { base: N === 1 ? [0.5, 0.5] : [0.5 + 0.31 * Math.cos(ang), 0.52 + 0.30 * Math.sin(ang)],
               ampX: 14 + (i * 7) % 12, ampY: 14 + (i * 11) % 12,
               freqX: 0.25 + ((i * 13) % 7) * 0.06, freqY: 0.30 + ((i * 5) % 7) * 0.05, phaseX: i * 2.1, phaseY: i * 1.3 + 0.5,
               freqZ: 0.18 + ((i * 3) % 5) * 0.04, phaseZ: i * 1.7 };
    });
    // 연결선: 노드를 순서대로 이어 다각형으로 (2개면 선 1개, 1개면 없음)
    const pairs = N < 2 ? [] : N === 2 ? [[0, 1]] : nodes.map((_, i) => [i, (i + 1) % N]);
    const edges = pairs.map(() => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('class', 'impact-tri-edge'); svg.appendChild(p); return p; });

    let raf = null, t0 = null;
    function step(ts) {
      if (isMobile || !tri.clientWidth) { raf = null; return; }
      if (t0 === null) t0 = ts;
      const t = (ts - t0) / 1000, w = tri.clientWidth, h = tri.clientHeight, pts = [], deps = [];
      nodes.forEach((el, i) => {
        const n = params[i];
        const cx = n.base[0] * w + n.ampX * Math.sin(t * n.freqX + n.phaseX);
        const cy = n.base[1] * h + n.ampY * Math.sin(t * n.freqY + n.phaseY);
        const dep = (Math.sin(t * n.freqZ + n.phaseZ) + 1) / 2;   // 0(멀리)~1(가까이)
        el.style.left = cx + 'px'; el.style.top = cy + 'px';
        el.style.setProperty('--dep', dep.toFixed(3));
        el.style.zIndex = 1 + Math.round(dep * 10);                // 가까운 노드가 위로
        pts.push([cx, cy]); deps.push(dep);
      });
      pairs.forEach((pr, k) => {
        const a = pts[pr[0]], b = pts[pr[1]];
        edges[k].setAttribute('d', `M${a[0]},${a[1]} L${b[0]},${b[1]}`);
        edges[k].style.setProperty('--edge-dep', ((deps[pr[0]] + deps[pr[1]]) / 2).toFixed(3));
      });
      raf = requestAnimationFrame(step);
    }
    const startFloat = () => { if (raf || isMobile) return; t0 = null; raf = requestAnimationFrame(step); };
    const stopFloat  = () => { if (raf) { cancelAnimationFrame(raf); raf = null; } };
    function reset() { tri.classList.remove('hide'); details.forEach(d => d.classList.remove('show')); startFloat(); }

    nodes.forEach((node, i) => node.addEventListener('click', () => { tri.classList.add('hide'); if (details[i]) details[i].classList.add('show'); }));
    win.querySelectorAll('.impact-back').forEach(b => b.addEventListener('click', reset));
    return { open: reset, close: stopFloat };
  }
};

/* ───────────── budget : 도넛 그래프 + 범례 ───────────── */
TYPES.budget = {
  render: app => {
    const t = app.total || {}, c = app.center || {};
    return header(app) + `<div class="plan-grid">
      <div class="plan-left">
        <div class="label">${esc(t.label || '')}</div>
        <div class="amount">${esc(t.prefix || '')}<span>${esc(t.value || '')}</span></div>
        <div class="desc">${esc(app.desc || '')}</div>
      </div>
      <div class="plan-right">
        <svg class="donut-svg" width="210" height="210" viewBox="0 0 230 230">
          <circle cx="115" cy="115" r="90" fill="none" stroke="var(--surface-2)" stroke-width="24"/>
          ${(app.items || []).map(it => `<circle class="donut-seg" cx="115" cy="115" r="90" stroke="${esc(it.color)}"/>`).join('')}
          <g class="donut-center-num">
            <text x="115" y="112" text-anchor="middle" fill="#fff" font-size="24" font-weight="900" font-family="Poppins">${esc(c.big || '')}</text>
            <text x="115" y="133" text-anchor="middle" fill="rgba(255,255,255,.4)" font-size="10" font-family="Poppins">${esc(c.small || '')}</text>
          </g>
        </svg>
        <div class="legend">${(app.items || []).map(it => `<div class="legend-item"><span class="legend-swatch" style="background:${esc(it.color)}"></span><span class="legend-name">${esc(it.label)}</span><span class="legend-pct">${esc(it.pct)}%</span><span class="legend-amt">${esc(it.amt)}</span></div>`).join('')}</div>
      </div>
    </div>`;
  },
  setup(app, win) {
    /* [도넛 원리] 도넛은 <circle> 여러 개를 겹친 SVG. 각 원의 stroke-dasharray 를 "자기 비율만큼의 길이, 나머지는 투명"으로 두면 한 조각이 되고,
       stroke-dashoffset 으로 시작 위치를 앞 조각들의 누적 길이만큼 밀어 이어 붙인다. 0 → 실제 길이로 바꾸면 CSS transition 이 "그려지는" 애니메이션을 만든다. */
    const segs = Array.from(win.querySelectorAll('.donut-seg')), items = app.items || [];
    function play() {
      const circ = 2 * Math.PI * 90; let acc = 0;
      items.forEach((it, i) => {
        const seg = segs[i], len = (it.pct / 100) * circ;
        seg.style.opacity = '0'; seg.style.strokeDasharray = '0 ' + circ; seg.style.strokeDashoffset = -acc;
        void seg.getBoundingClientRect();   // 강제 리플로우: "0" 상태를 먼저 반영해야 아래 변경이 애니메이션됨
        setTimeout(() => { seg.style.opacity = '1'; seg.style.strokeDasharray = len + ' ' + (circ - len); }, 60 + i * 90);   // 조각마다 90ms 씩 늦게 시작
        acc += len;
      });
    }
    return { open: play, mobile: play };
  }
};

/* ───────────── summary : 요약 카드 + 마무리 ───────────── */
TYPES.summary = {
  render: app => header(app) + `<div class="summary-body">
      <div class="summary-grid">${(app.cards || []).map((c, i) => `<div class="sum-card"><div class="num">${pad2(i + 1)}</div><div><h4>${esc(c.title)}</h4><p>${esc(c.text)}</p></div></div>`).join('')}</div>
      ${app.close ? `<div class="summary-close"><h2>${esc(app.close.title)}<span class="dot-accent">.</span></h2><p>${esc(app.close.text)}</p></div>` : ''}
    </div>`,
  setup() { return {}; }
};

/* ───────────── custom : 자유 HTML 페이지 ───────────── */
TYPES.custom = {
  render: app => header(app) + (app.html || ''),     // html 은 이스케이프하지 않고 그대로 넣음(직접 쓴 코드이므로)
  setup(app, win) {
    return { open() { if (app.onOpen) app.onOpen(win); }, close() { if (app.onClose) app.onClose(win); } };
  }
};

/* ======================================================================
 *  1) 데이터 → 화면 생성 (홈 / Dock / 앱 창)
 * ====================================================================== */
document.title = DECK.title;

document.getElementById('desktopLayer').innerHTML =
  `<span class="kicker">${esc(HOME.kicker)}</span><h1>${rich(HOME.title)}</h1><p>${rich(HOME.text)}</p>`;
document.getElementById('desktopHint').innerHTML =
  esc(HOME.hint) + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v14M6 13l6 6 6-6"/></svg>';

// Dock: 앱들 + 구분선 + 홈
const dockLi = (id, name, icon, color, extraCls) =>
  `<li${extraCls ? ` class="${extraCls}"` : ''} data-app="${esc(id)}"><div class="ico" style="background:${gradient(color)}">${iconSvg(icon)}</div><div class="name">${esc(name)}</div></li>`;
document.getElementById('dock').innerHTML =
  APPS.map(a => dockLi(a.id, a.name, a.icon, a.color || ['#888', '#555'])).join('') +
  '<li class="li-sep"></li>' + dockLi('home', HOME.name, HOME.icon, HOME.color, 'is-home');

// 앱 창
APPS.forEach(app => {
  const type = TYPES[app.type];
  if (!type) { console.warn('알 수 없는 앱 type:', app.type, '(앱 id: ' + app.id + ')'); return; }
  appMenuName[app.id] = app.menuName || app.name;

  const win = document.createElement('div');
  win.className = 'app-window'; win.id = 'win-' + app.id; win.dataset.app = app.id;
  win.style.transform = CENTER;   // 처음부터 중앙 기준 transform 을 심어야 열림 애니메이션 시작 좌표가 정확해짐
  const body = type.render(app);
  win.innerHTML = `
    <div class="win-titlebar">
      <div class="traffic-lights"><button class="tl red" data-close></button><button class="tl yellow"></button><button class="tl green"></button></div>
      <div class="win-title">${esc(app.windowTitle || app.name)}</div>
      ${type.titlebarExtra || ''}
    </div>
    <div class="win-body">${body}</div>`;
  windowsLayer.appendChild(win);
  controllers[app.id] = type.setup(app, win) || {};
});

/* ======================================================================
 *  2) PC / 모바일 모드, 스테이지 배율
 * ====================================================================== */
function computeIsMobile() { return window.innerWidth <= 880; }

function applyMode() {
  const next = computeIsMobile();
  if (next === isMobile) { if (!isMobile) fitStage(); return; }
  isMobile = next;
  document.body.classList.toggle('mode-mobile', isMobile);
  if (!isMobile) { fitStage(); } else { setupMobileObserver(); }
  // 데스크탑으로 로드된 뒤 리사이즈/회전으로 모바일에 "나중에" 진입해도 스크롤 감시가 만들어지도록 여기서도 호출
}

// 1920x1080 고정 캔버스(.stage)를 창 크기에 맞춰 균일 스케일 → 해상도가 달라도 배치가 항상 동일
function fitStage() {
  if (isMobile) return;
  currentScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'scale(' + currentScale + ')';
}

/* ======================================================================
 *  3) Dock 자석(확대) 효과 — 커서 x좌표와 각 아이콘 거리에 따라 연속적으로 스케일(가우시안)
 *     SIGMA 를 키우면 더 많은 아이콘이 함께 반응하고, 줄이면 커서 바로 아래 아이콘만 반응합니다.
 * ====================================================================== */
function setupDockMagnify() {
  const dockEl = document.getElementById('dock');
  const items = Array.from(dockEl.children).filter(li => !li.classList.contains('li-sep'));
  const MAX_SCALE = 1.35, MAX_LIFT = 9, SIGMA = 40;
  let rafId = null, lastX = null;
  function apply(mouseX) {
    items.forEach(li => {
      const r = li.getBoundingClientRect(), d = mouseX - (r.left + r.width / 2);
      const t = Math.exp(-(d * d) / (2 * SIGMA * SIGMA));
      li.querySelector('.ico').style.transform = 'scale(' + (1 + (MAX_SCALE - 1) * t).toFixed(3) + ') translateY(' + (-MAX_LIFT * t).toFixed(2) + 'px)';
    });
  }
  dockEl.addEventListener('mousemove', e => {
    if (isMobile) return;
    lastX = e.clientX;
    if (rafId) return;
    rafId = requestAnimationFrame(() => { apply(lastX); rafId = null; });
  });
  dockEl.addEventListener('mouseleave', () => {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    items.forEach(li => { li.querySelector('.ico').style.transform = 'scale(1) translateY(0px)'; });
  });
}

/* ======================================================================
 *  4) 앱 열기/닫기 (Genie 트랜지션: 아이콘 위치에서 커지며 열리고, 닫히면 아이콘으로 줄어듦)
 * ====================================================================== */
// 창이 아이콘 중심으로 갈 때의 이동량/축소 비율 (화면 배율 currentScale 로 보정)
function genieDelta(iconEl, winEl) {
  const ir = iconEl.getBoundingClientRect(), wr = winEl.getBoundingClientRect();
  return { dx: (ir.left + ir.width / 2 - (wr.left + wr.width / 2)) / currentScale,
           dy: (ir.top + ir.height / 2 - (wr.top + wr.height / 2)) / currentScale,
           s: Math.max(ir.width / wr.width, 0.02) };
}

function openApp(appId, iconEl) {
  if (isMobile) return;
  if (appId === 'home') { closeCurrentApp(); return; }
  if (currentOpenApp && currentOpenApp.name === appId) return;
  if (currentOpenApp) {
    // 다른 앱이 열려 있으면: 닫힘 애니메이션이 완전히 끝난 뒤에 새 앱 열림을 시작 (두 애니메이션이 겹치지 않게)
    closeCurrentApp(() => openApp(appId, iconEl));
    return;
  }
  const winEl = document.getElementById('win-' + appId);
  if (!winEl) return;
  winEl.classList.add('open');
  winEl.style.opacity = '0';

  const g = genieDelta(iconEl, winEl);
  winEl.style.transition = 'none';
  winEl.style.transformOrigin = 'center center';
  winEl.style.transform = CENTER + ' translate(' + g.dx + 'px,' + g.dy + 'px) scale(' + g.s + ')';
  void winEl.offsetWidth;
  requestAnimationFrame(() => {
    winEl.style.transition = 'transform .55s cubic-bezier(.2,.9,.25,1), opacity .3s ease';
    winEl.style.transform = CENTER + ' translate(0,0) scale(1)';
    winEl.style.opacity = '1';
  });

  currentOpenApp = { name: appId, windowEl: winEl, iconEl: iconEl };
  iconEl.closest('li').classList.add('is-open');
  document.getElementById('mbAppName').textContent = appMenuName[appId] || appId;

  const c = controllers[appId];
  if (c && c.open) c.open();                 // 앱 종류별 "열릴 때" 동작 (대화 재생, 도넛 그리기, 흐름도 초기화 …)
  const app = APPS.find(a => a.id === appId);
  if (app && app.type !== 'custom' && app.onOpen) app.onOpen(winEl);   // 공통 onOpen 훅 (custom 은 자체 처리)
}

function closeCurrentApp(onDone) {
  if (isMobile || !currentOpenApp) { if (onDone) onDone(); return; }
  const cur = currentOpenApp, winEl = cur.windowEl, iconEl = cur.iconEl;
  const c = controllers[cur.name];
  if (c && c.close) c.close();               // 앱 종류별 "닫힐 때" 정리 (알림창 닫기, 애니메이션 중지 …)
  const app = APPS.find(a => a.id === cur.name);
  if (app && app.type !== 'custom' && app.onClose) app.onClose(winEl);
  iconEl.closest('li').classList.remove('is-open');

  const g = genieDelta(iconEl, winEl);
  winEl.style.transition = 'transform .45s cubic-bezier(.4,0,.2,1), opacity .35s ease';
  winEl.style.transform = CENTER + ' translate(' + g.dx + 'px,' + g.dy + 'px) scale(' + g.s + ')';
  winEl.style.opacity = '0';

  currentOpenApp = null;
  document.getElementById('mbAppName').textContent = appMenuName.home;
  setTimeout(() => {
    winEl.classList.remove('open');
    winEl.style.transform = CENTER;
    if (onDone) onDone();
  }, 460);
}

/* ======================================================================
 *  5) 입력 처리: Dock 클릭 / 빨간 점(닫기) / 키보드
 * ====================================================================== */
document.getElementById('dock').addEventListener('click', e => {
  const li = e.target.closest('li[data-app]');
  if (!li) return;
  const app = li.getAttribute('data-app');
  if (isMobile) {   // 모바일: 해당 섹션으로 부드럽게 스크롤
    const target = app === 'home' ? document.getElementById('desktopLayer') : document.getElementById('win-' + app);
    if (target) target.scrollIntoView({ behavior: 'smooth' });
    return;
  }
  openApp(app, li.querySelector('.ico') || li);
});

windowsLayer.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeCurrentApp(); });

// 키보드: 0 / Esc = 홈, 1~9 = APPS 의 N번째 앱 (배열 순서 그대로)
window.addEventListener('keydown', e => {
  if (isMobile) return;
  if (e.key === 'Escape' || e.key === '0') { closeCurrentApp(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && APPS[n - 1]) {
    const li = document.querySelector('.dock li[data-app="' + APPS[n - 1].id + '"]');
    if (li) openApp(APPS[n - 1].id, li.querySelector('.ico'));
  }
});

/* ======================================================================
 *  6) 모바일: 스크롤 진행률 + 섹션 진입 애니메이션
 *     PC 는 "Dock 클릭 → 창 열기"로 앱 진입 시점을 알 수 있지만, 모바일은 세로로 이어진 스크롤 페이지라
 *     IntersectionObserver 로 각 창이 40% 이상 보이는 순간 그 앱의 mobile() 을 실행한다.
 * ====================================================================== */
let mobileObserver = null, scrollBound = false;
function setupMobileObserver() {
  Object.keys(controllers).forEach(id => { if (controllers[id].mobileInit) controllers[id].mobileInit(); });
  if (mobileObserver) mobileObserver.disconnect();   // 모드 전환 등으로 재호출될 수 있어 이전 감시를 먼저 정리
  mobileObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio > 0.4) {
        const c = controllers[entry.target.getAttribute('data-app')];
        if (c && c.mobile) c.mobile();
      }
    });
  }, { threshold: [0.4] });
  document.querySelectorAll('.app-window').forEach(w => mobileObserver.observe(w));

  if (!scrollBound) {   // 상단 진행률 바: 문서 길이 대비 현재 스크롤 위치(%)
    scrollBound = true;
    window.addEventListener('scroll', () => {
      const d = document.documentElement, pct = d.scrollTop / (d.scrollHeight - d.clientHeight) * 100;
      document.getElementById('mobileProgress').style.width = (isNaN(pct) ? 0 : pct) + '%';   // 스크롤 불가면 분모 0 → NaN 방어
    }, { passive: true });
  }
}

/* ======================================================================
 *  7) 시계 + 초기화
 * ====================================================================== */
function updateClock() {
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  document.getElementById('mbClock').textContent = pad2(h) + ':' + pad2(m);
}

setupDockMagnify();
updateClock();
setInterval(updateClock, 30000);   // 초 단위는 안 보이므로 30초마다 갱신으로 충분

isMobile = computeIsMobile();
document.body.classList.toggle('mode-mobile', isMobile);
if (isMobile) { setupMobileObserver(); } else { fitStage(); }

// 리사이즈는 연속 발생하므로 마지막 이벤트 후 120ms 조용할 때 한 번만 처리 (디바운스)
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyMode, 120); });
})();
</script>
