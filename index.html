// 슬라이드 전체 조립 (헤더/푸터는 공통)
// 번호 체계: 첫 슬라이드가 표지면 표지=0 이고 "0 / N" 으로 표시(원본과 동일). 표지가 없는 덱은 1부터 "1 / N".
SLIDES.forEach(s => { if (s.type === 'scale' && !(s.steps && s.steps.length)) s.steps = [{}]; });   // scale 은 steps 생략 시 1단계 기본
const hasCover = SLIDES[0] && SLIDES[0].type === 'cover';
const numOf = i => hasCover ? i : i + 1;
const total = hasCover ? SLIDES.length - 1 : SLIDES.length;
if (DECK.maxSlides && SLIDES.length > DECK.maxSlides) console.warn(`슬라이드 ${SLIDES.length}장 > 상한 ${DECK.maxSlides}장`);
SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = `slide ${s.type}${s.chapterOf ? ' chapter-part' : ''}${i === 0 ? ' active' : ''}${s.build ? ' bx-' + (s.buildAnim || 'rise') : ''}`;
    el.id = 'slide-' + (s.key || (s.type === 'toc' ? 'toc' : i));
    el.dataset.type = s.type;
    // TOC 슬라이드는 헤더가 없는 디자인 (원본과 동일)
    const header = s.type === 'toc' ? '' : `
        <div class="slide-header">
            <div class="slide-tag">${esc(s.tag)} <span>${esc(DECK.tagSeparator)}</span> ${esc(s.num || pad2(numOf(i)))}</div>
            <div class="slide-header-right">${s.presenter ? `<span class="slide-presenter">${esc(s.presenter)}</span>` : ''}<span>${esc(s.icon || '')}</span></div>
        </div>`;
    el.innerHTML = header + BUILDERS[s.type](s, i) +
        `<div class="slide-footer"><div>${esc(s.footer || '')}</div><div><span class="step-dots"></span>${numOf(i)} / ${total}</div></div>`;
    presentationEl.appendChild(el);
    if (s.type === 'charts') chartDefs[i] = s.charts;
    // findings 슬라이드의 results 를 차트 정의 형태로 변환 (renderCharts 가 그대로 그림)
    if (s.type === 'findings') chartDefs[i] = s.results.map(r => ({
        title: r.q, type: r.type || 'bar', labels: r.labels, legend: r.legend, horizontal: r.horizontal, max: r.max, min: r.min,
        datasets: r.datasets || [{ label: r.label || 'Responses', data: r.data, colors: r.colors, color: r.color }]
    }));
});

/* ======================================================================
 *  3) 슬라이드 전환 로직
 *     (이동 규칙은 모두 SLIDES 데이터에서 자동 계산)
 * ====================================================================== */
const slides = document.querySelectorAll('.slide');
const TOC_INDEX = SLIDES.findIndex(s => s.type === 'toc');
let currentSlide = 0;
let flipBusy = false;   // 목차 ↔ 본문 전환 애니메이션 중에는 true → 그동안 클릭/키 입력을 무시해 애니메이션이 꼬이지 않게 함

// fade:true 인 두 슬라이드가 서로 이웃(번호 차이 1)일 때만 느린 페이드를 쓴다.
function checkAndApplyFadeEffect(from, to) {
    slides.forEach(el => el.classList.remove('fade-transition'));
    if (Math.abs(from - to) === 1 && SLIDES[from].fade && SLIDES[to].fade) {
        slides[from].classList.add('fade-transition');
        slides[to].classList.add('fade-transition');
    }
}

// index 번째 슬라이드로 이동 (범위를 벗어나면 순환). 차트 슬라이드로 들어가면 차트를 다시 그림.
function showSlide(index) {
    const next = (index + slides.length) % slides.length;
    checkAndApplyFadeEffect(currentSlide, next);
    slides[currentSlide].classList.remove('active');
    const prevIdx = currentSlide;
    currentSlide = next;
    // 새 슬라이드의 단계 상태를 (보이지 않는 동안) 정리: 앞으로 오면 0단계부터, 뒤로 돌아오면 완성된 상태로
    {
        const sl = slides[next], back = next < prevIdx && !(prevIdx === slides.length - 1 && next === 0);
        sl.classList.add('no-tr');
        applyStep(next, back ? stepMax[next] : 0, true);
        void sl.offsetWidth;
        sl.classList.remove('no-tr');
    }
    slides[currentSlide].classList.add('active');
    onSlideChanged();   // 발표자 노트/타이머 갱신 (아래 발표 도구)
    updateTocFab();
    markVisited();
    // 전환 애니메이션이 남겨 둔 인라인 투명도(opacity:0)를 정리한다.
    // (예: 목차 → 본문 → ← 키로 목차 복귀 시 목차 내용이 투명한 채 남는 문제 방지)
    // 애니메이션 도중(flipBusy)에는 애니메이션이 직접 관리하므로 건드리지 않는다.
    if (!flipBusy) resetFlipStyles();
    if (chartDefs[currentSlide]) setTimeout(() => renderCharts(currentSlide), 50);
}

function resetFlipStyles() {
    tocParts().forEach(el => { if (el) { el.style.transition = ''; el.style.opacity = ''; } });
    slides.forEach(sl => {
        if (sl.dataset.type !== 'chapter' && !sl.classList.contains('chapter-part')) return;
        const ti = sl.querySelector('.main-title'), gr = sl.querySelector('.unified-grid, .ch-fade');
        if (ti) ti.style.opacity = '';
        if (gr) { gr.style.transition = ''; gr.style.opacity = ''; }
    });
}

// 이 슬라이드에서 화면 클릭으로 다음 장으로 넘어가도 되는가?
const canClickNext = i => SLIDES[i].clickNext !== false;

// 목차로 돌아가기: 버튼(☰ CONTENTS) / M 키. 챕터에서는 FLIP 애니메이션으로, 그 외 슬라이드에서는 바로 이동.
// chapterOf:'<챕터 key>' 를 가진 슬라이드는 그 챕터의 제목(01. …)을 그대로 달고, 목차로 돌아갈 때 챕터와 같은 화살표 애니메이션을 씀
function chapterIndexOf(i) {
    const x = SLIDES[i];
    if (x.type === 'chapter') return i;
    return x.chapterOf ? SLIDES.findIndex(c => c.type === 'chapter' && c.key === x.chapterOf) : -1;
}
function goToTOC() {
    if (flipBusy || TOC_INDEX < 0 || currentSlide === TOC_INDEX) return;
    if (chapterIndexOf(currentSlide) >= 0) animateSlideToTOC(slides[currentSlide]);
    else showSlide(TOC_INDEX);
}
function updateTocFab() {
    const fab = document.getElementById('toc-fab'), t = SLIDES[currentSlide].type;
    if (fab) fab.classList.toggle('show', TOC_INDEX >= 0 && t !== 'cover' && t !== 'toc');
}
document.getElementById('toc-fab').addEventListener('click', e => { e.stopPropagation(); goToTOC(); });

/* ----------------------------------------------------------------------
 *  단계(step) 엔진: 한 슬라이드 안에서 클릭할 때마다 한 단계씩 진행
 *   - data-step="k" 요소(build:true 슬라이드): step >= k 가 되면 나타남(.on)
 *   - emphasis 슬라이드: steps[] 개수만큼 단계가 있고, 단계마다 강조 대상이 바뀜
 *   - 슬라이드의 총 단계 수(stepMax) = 위 둘 중 큰 값
 * ---------------------------------------------------------------------- */
const stepState = SLIDES.map(() => 0);
const stepMax = SLIDES.map((s, i) => Math.max(0, (s.steps || []).length,
    ...[...slides[i].querySelectorAll('[data-step]')].map(e => +e.dataset.step)));

function applyStep(i, n, entering) {
    n = clamp(n, 0, stepMax[i]);
    stepState[i] = n;
    const sl = slides[i];
    sl.querySelectorAll('[data-step]').forEach(e => e.classList.toggle('on', +e.dataset.step <= n));
    if (SLIDES[i].type === 'emphasis') renderEmphasis(i, n, entering);
    else if (SLIDES[i].type === 'scale') renderScale(i, n, entering);
    const dots = sl.querySelector('.step-dots');
    if (dots) dots.innerHTML = (DECK.stepDots !== false && stepMax[i]) ? Array.from({ length: stepMax[i] + 1 }, (_, k) => `<i class="${k <= n ? 'on' : ''}"></i>`).join('') : '';
}
// 슬라이드에 nextTo:'toc' 를 주면, 그 슬라이드가 끝났을 때 다음 장 대신 목차로 돌아감(← 로 되돌아갈 때도 대칭).
// 목차에서 → / 클릭 = 아직 안 본 첫 챕터로 이동. 본 챕터는 목차에서 ✓ 표시.
const visitedChapters = new Set();
function markVisited() {
    if (chapterIndexOf(currentSlide) >= 0) visitedChapters.add(chapterIndexOf(currentSlide));
    document.querySelectorAll('.toc-card').forEach(c => c.classList.toggle('done', visitedChapters.has(parseInt(c.dataset.target))));
}
function nextStep() {
    if (stepState[currentSlide] < stepMax[currentSlide]) { applyStep(currentSlide, stepState[currentSlide] + 1); return; }
    const cur = SLIDES[currentSlide];
    if (cur.nextTo === 'toc' && TOC_INDEX >= 0 && currentSlide !== TOC_INDEX) { goToTOC(); return; }
    if (cur.type === 'toc') {
        const nextCh = SLIDES.findIndex((x, j) => x.type === 'chapter' && !visitedChapters.has(j));
        const card = document.querySelector(`.toc-card[data-target="${nextCh}"]`);
        if (nextCh >= 0 && card) { animateTOCToSlide(card, nextCh); return; }
    }
    showSlide(currentSlide + 1);
}
function prevStep() {
    if (stepState[currentSlide] > 0) { applyStep(currentSlide, stepState[currentSlide] - 1); return; }
    const prev = SLIDES[currentSlide - 1];
    if (prev && prev.nextTo === 'toc' && TOC_INDEX >= 0 && currentSlide - 1 !== TOC_INDEX) { showSlide(TOC_INDEX); return; }
    showSlide(currentSlide - 1);
}

// 글자 교체(옅게 사라졌다가 새 글자로). instant 면 애니메이션 없이 바로 교체
function swapText(el, html, instant) {
    if (!el || el.dataset.cur === html) return;
    el.dataset.cur = html;
    clearTimeout(el._t);
    if (instant) { el.innerHTML = html; el.style.opacity = 1; return; }
    el.style.opacity = 0;
    el._t = setTimeout(() => { el.innerHTML = html; el.style.opacity = 1; }, 220);
}

/* 강조 비교 그리기: step 0 = 정확한 비율 / step k = steps[k-1].focus 만 키우고 나머지는 shrink 배율로 축소 */
function renderEmphasis(i, step, instant) {
    const s = SLIDES[i], root = slides[i], stage = root.querySelector('.em-stage');
    if (!stage) return;
    const steps = s.steps || [];
    const st = step > 0 ? steps[Math.min(step, steps.length) - 1] : null;
    const focus = (st && st.focus != null) ? st.focus : -1, emph = focus >= 0;
    const shrink = s.shrink != null ? s.shrink : .3;                         // 강조 상태에서 나머지 항목의 크기 배율
    const vals = s.items.map(it => +it.value || 0), max = Math.max(...vals) || 1, tot = vals.reduce((a, b) => a + b, 0) || 1;
    const cols = emPalette(s);
    root.classList.toggle('em-scaled', emph);
    if (instant) {                                                           // 슬라이드 진입: 0 크기에서 자라나는 효과
        stage.classList.add('enter'); clearTimeout(stage._t);
        stage._t = setTimeout(() => stage.classList.remove('enter'), 500);
    }
    if (s.kind === 'donut') {
        const R = 70, C = 2 * Math.PI * R, lgs = stage.querySelectorAll('.em-lg');
        let acc = 0;
        stage.querySelectorAll('.em-seg').forEach((c, k) => {
            const frac = vals[k] / tot, start = acc * C, len = Math.max(frac * C - 3, .5);
            acc += frac;
            const mid = (start + frac * C / 2) / C * 2 * Math.PI, f = emph && k === focus, d = f ? 16 : 0;
            c.style.strokeDasharray = `${len} ${C - len}`;
            c.style.strokeDashoffset = -(start + 1.5);
            c.style.strokeWidth = (emph ? (f ? 54 : 12) : 26) + 'px';
            c.style.opacity = emph && !f ? .35 : 1;
            c.style.transform = `translate(${Math.cos(mid) * d}px, ${Math.sin(mid) * d}px)`;   // 강조 조각은 바깥으로 튀어나옴
            if (lgs[k]) lgs[k].classList.toggle('dim', emph && !f);
        });
        const ctr = stage.querySelector('.em-center'), it = emph ? s.items[focus] : null, cen = s.center || {};
        const disp = it ? (it.display != null ? it.display : it.value) : (cen.display || '');
        ctr.querySelector('b').style.color = emph ? cols[focus] : '#fff';
        swapText(ctr.querySelector('b'), esc(disp), instant);
        swapText(ctr.querySelector('span'), esc(it ? it.label : (cen.label || '')), instant);
    } else if (s.kind === 'bubble') {
        const Dmax = s.maxSize || 18, Dfocus = s.focusSize || 26;            // rem 단위. 면적이 값에 비례 → 지름 = Dmax * sqrt(비율)
        stage.querySelectorAll('.em-bubble').forEach((c, k) => {
            const base = Dmax * Math.sqrt(vals[k] / max), f = emph && k === focus;
            const d = emph ? (f ? Dfocus : base * shrink) : base;
            c.style.width = c.style.height = d + 'rem';
            c.style.opacity = emph && !f ? .4 : 1;
            c.style.boxShadow = f ? `0 0 4rem ${withAlpha(cols[k], .5)}` : 'none';
            c.querySelector('b').style.fontSize = Math.max(.8, d * (f ? .16 : .15)) + 'rem';
            c.querySelector('span').style.opacity = d < 5 ? 0 : 1;           // 너무 작으면 라벨 숨김
        });
    } else {
        stage.querySelectorAll('.em-col').forEach((c, k) => {
            const base = vals[k] / max * 100, f = emph && k === focus, bar = c.querySelector('.em-bar');
            c.style.flexGrow = emph ? (f ? 2.4 : .55) : 1;                   // 강조 막대는 넓어지고 나머지는 좁아짐
            bar.style.height = (emph ? (f ? 100 : base * shrink) : base) + '%';
            bar.style.opacity = emph && !f ? .4 : 1;
            bar.style.boxShadow = f ? `0 0 3rem ${withAlpha(cols[k], .45)}` : 'none';
            c.querySelector('.em-val').style.fontSize = (f ? 3.4 : 1.4) + 'rem';
        });
    }
    swapText(root.querySelector('.em-big'), txt(st ? st.big : s.big), instant);
    swapText(root.querySelector('.em-text'), txt(st ? st.caption : s.caption), instant);
}
/* 저울 그리기: step 0 = 왼쪽 접시에만 동전 / step k = scalePlan 의 상태. 보는 기울고(오른쪽이 무거우면 시계방향), 접시는 반대로 돌아 수평 유지 */
function renderScale(i, step, instant) {
    const s = SLIDES[i], root = slides[i], stage = root.querySelector('.em-stage');
    if (!stage) return;
    const plan = scalePlan(s), tiltMax = s.tiltMax || 16;
    const stateOf = n => plan.states[Math.min(n, plan.states.length - 1)];
    const paint = (state, prev) => {
        const th = state.tilt != null ? state.tilt : clamp((state.R - state.L) / Math.max(1, (state.L > 0 && state.R > 0) ? Math.min(state.L, state.R) : Math.max(state.L, state.R)), -1, 1) * tiltMax;   // 한쪽이 훨씬 무거우면 최대로 기울어짐
        const added = Math.max(state.L - prev.L, state.R - prev.R, 0);
        const delay = Math.min(.9, added * .04) + 's';                      // 동전이 어느 정도 쌓인 뒤 기울기 시작
        const beam = stage.querySelector('.sc-beam');
        beam.style.transitionDelay = delay;
        beam.style.transform = `rotate(${th}deg)`;
        stage.querySelectorAll('.sc-wrap').forEach(w => { w.style.transitionDelay = delay; w.style.transform = `rotate(${-th}deg)`; });
        [['L', state.L, prev.L], ['R', state.R, prev.R]].forEach(([side, n, p]) => {
            stage.querySelectorAll(`.sc-coin[data-side="${side}"]`).forEach(c => {
                const k = +c.dataset.k, on = k < n;
                c.style.opacity = on ? 1 : 0;
                c.style.transform = `translate(${c.dataset.x}px, ${on ? c.dataset.y : (+c.dataset.y - 260)}px)`;
                c.style.transitionDelay = (on && k >= p) ? ((k - p) * .06) + 's' : '0s';   // 새 동전은 하나씩 순서대로 툭툭 떨어짐
            });
        });
        stage.querySelectorAll('.sc-gate').forEach(g => { g.style.opacity = state.R > 0 ? 1 : 0; });  // 오른쪽 라벨은 동전이 쌓이면 나타남
    };
    clearTimeout(stage._t);
    if (instant) {
        paint({ L: 0, R: 0 }, { L: 0, R: 0 });                               // 슬라이드 진입: 빈 저울에서 시작
        stage._prev = { L: 0, R: 0 };
        stage._t = setTimeout(() => { const cur = stateOf(stepState[i]); paint(cur, stage._prev); stage._prev = cur; }, 550);
    } else {
        const cur = stateOf(step);
        paint(cur, stage._prev || { L: 0, R: 0 });
        stage._prev = cur;
    }
    root.classList.toggle('em-scaled', step > 0);
    const st = step > 0 ? (s.steps || [{}])[Math.min(step, (s.steps || [{}]).length) - 1] : null;
    swapText(root.querySelector('.em-big'), txt(st ? st.big : s.big), instant);
    swapText(root.querySelector('.em-text'), txt(st ? st.caption : s.caption), instant);
}
applyStep(0, 0, true);   // 첫 슬라이드의 초기 단계 상태
updateTocFab();

// 좌클릭 = 다음 슬라이드 (링크/버튼/카드/차트 등을 누른 경우는 제외)
document.addEventListener('click', e => {
    const interactive = e.target.closest('a, button, .toc-card, .card-image-wrapper, canvas, #image-modal');
    if (!flipBusy && !interactive && (canClickNext(currentSlide) || stepState[currentSlide] < stepMax[currentSlide])) nextStep();
});

// 우클릭 = 이전. 단 본문(chapter)에서는 목차로 돌아가는 애니메이션
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (flipBusy) return;
    if (document.getElementById('image-modal').classList.contains('active')) return;   // 확대 중엔 무시
    if (stepState[currentSlide] > 0) prevStep();
    else if (chapterIndexOf(currentSlide) >= 0 && TOC_INDEX >= 0) animateSlideToTOC(slides[currentSlide]);
    else if (currentSlide > 0) showSlide(currentSlide - 1);
});

// 키보드: → / Space / Enter 다음, ← 이전
window.addEventListener('keydown', e => {
    if (flipBusy) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') nextStep();
    else if (e.key === 'ArrowLeft') prevStep();
    else if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey) goToTOC();   // M = 목차로
    else if (/^[1-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {                         // 1~9 = 해당 챕터로 바로 이동
        const idx = SLIDES.map((x, j) => x.type === 'chapter' ? j : -1).filter(j => j >= 0)[+e.key - 1];
        if (idx != null && !flipBusy) showSlide(idx);
    }
});

/* ======================================================================
 *  4) 차트 (Chart.js) — 슬라이드에 들어올 때마다 새로 그려 애니메이션 재생
 * ====================================================================== */
let chartInstances = [];

function renderCharts(slideIdx) {
    if (typeof Chart === 'undefined') return;                 // 라이브러리 로딩 실패 시 조용히 건너뜀
    chartInstances.forEach(c => c.destroy());                 // 재방문 시 겹침 방지
    chartInstances = [];
    Chart.defaults.color = 'rgba(255, 255, 255, 0.6)';
    Chart.defaults.font.family = 'Poppins, sans-serif';
    Chart.defaults.font.size = Math.max(11, 18 * uiScale);     // 화면 배율에 맞춰 차트 글자도 비례

    (chartDefs[slideIdx] || []).forEach((def, k) => {
        const canvas = document.getElementById(`chart-${slideIdx}-${k}`);
        if (!canvas) return;
        const palette = ['sideA', 'sideB', '#ffffff', '#8a8a99', '#4a4a55'];   // doughnut 기본 색 순환
        const isDonut = def.type === 'doughnut';
        const datasets = def.datasets.map(d => {
            if (isDonut) {
                const src = d.colors || palette;
                const cols = d.data.map((_, j) => colorOf(src[j % src.length]));
                return { label: d.label, data: d.data, borderWidth: 2,
                         backgroundColor: cols.map(c => withAlpha(c, .65)), borderColor: cols };
            }
            if (def.type === 'bar') {
                const cols = (d.colors || [d.color]).map(colorOf);
                return { label: d.label, data: d.data, borderWidth: 2, borderRadius: 8,
                         backgroundColor: cols.map(c => withAlpha(c, .65)), borderColor: cols };
            }
            const c = colorOf(d.color);
            return { label: d.label, data: d.data, borderColor: c, backgroundColor: withAlpha(c, .1),
                     borderWidth: 3 * uiScale, tension: .3, fill: true };
        });
        const options = {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: (def.legend || isDonut) ? { position: isDonut ? 'right' : 'top', labels: { boxWidth: 12 } } : { display: false } }
        };
        if (isDonut) {
            options.cutout = '62%';
        } else {
            const grid = { color: 'rgba(255,255,255,0.05)' };
            options.animations = { y: { easing: 'easeOutQuart', duration: 1000, delay: 500 } };
            options.indexAxis = def.horizontal ? 'y' : 'x';   // horizontal:true 면 가로 막대
            // def.max / def.min : 값 축 고정 (예: 1~5점 척도는 max:5, min:0)
            const vAx = { grid, beginAtZero: true };
            if (def.max != null) vAx.max = def.max;
            if (def.min != null) vAx.min = def.min;
            options.scales = def.horizontal ? { x: vAx, y: { grid: { display: false } } }
                                            : { y: vAx };
        }
        chartInstances.push(new Chart(canvas.getContext('2d'), {
            type: def.type, data: { labels: def.labels, datasets }, options
        }));
    });
}

/* ======================================================================
 *  5) TOC ↔ 본문 FLIP 전환 애니메이션 (제목이 화면을 가로질러 날아가는 효과)
 *     위치/크기는 전부 실제 화면 좌표(getBoundingClientRect)로 계산하므로
 *     화면 배율(uiScale)이 달라져도 그대로 동작합니다.
 * ====================================================================== */

// 날아가는 임시 제목(flyer)을 서서히 지우고 제거
function removeFlyerWithFade(flyer) {
    flyer.classList.add('fade-out');
    flyer.addEventListener('transitionend', () => flyer.remove(), { once: true });
}

// 화살표 선을 곡선으로 그려나가는 애니메이션
function animateArrowTrace(startX, startY, endX, endY, isReverse = false, callback = null) {
    const path = document.querySelector('.trace-path');
    path.setAttribute('marker-end', isReverse ? 'url(#arrow-backward)' : 'url(#arrow-forward)');
    path.removeAttribute('marker-start');

    // 베지어 곡선의 제어점: 수평으로 휘어지며 이어짐 (정/역방향 모두 같은 수식)
    const c1x = startX + (endX - startX) * 0.4;
    const c2x = startX + (endX - startX) * 0.6;
    path.setAttribute('d', `M ${startX} ${startY} C ${c1x} ${startY}, ${c2x} ${endY}, ${endX} ${endY}`);

    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    requestAnimationFrame(() => {
        path.style.transition = 'stroke-dashoffset .6s cubic-bezier(0.25, 1, 0.5, 1)';
        path.style.strokeDashoffset = '0';
    });
    setTimeout(() => {
        if (callback) callback();
        path.style.transition = 'none';
        path.setAttribute('d', '');
        path.removeAttribute('marker-end');
    }, 600);
}

// 임시 제목(flyer) 하나를 만들어 body 에 붙임 (출발 위치/글자 스타일 복사)
function makeFlyer(html, rect, cs) {
    const f = document.createElement('div');
    f.className = 'flying-title';
    f.innerHTML = html;
    Object.assign(f.style, {
        position: 'fixed', left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', whiteSpace: 'normal',
        lineHeight: cs.lineHeight, fontSize: cs.fontSize, fontWeight: cs.fontWeight, letterSpacing: cs.letterSpacing, color: cs.color
    });
    document.body.appendChild(f);
    return f;
}
// flyer 를 도착 위치/글자 스타일로 이동시킴
function flyTo(f, rect, cs) {
    requestAnimationFrame(() => {
        f.style.transition = 'all .6s cubic-bezier(0.25, 1, 0.5, 1)';
        Object.assign(f.style, {
            left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px',
            lineHeight: cs.lineHeight, fontSize: cs.fontSize, fontWeight: cs.fontWeight, letterSpacing: cs.letterSpacing
        });
    });
}

// 목차 왼쪽/오른쪽 요소들 (전환 중 잠깐 숨겼다 보이게 함)
const tocParts = () => [document.getElementById('toc-main-title'), document.getElementById('toc-description'),
                        document.getElementById('toc-right-menu'), document.querySelector('#slide-toc .toc-footer-stats')];

// 목차 → 본문 (정방향)
function animateTOCToSlide(cardEl, targetIndex) {
    if (flipBusy) return;
    flipBusy = true;
    setTimeout(() => { flipBusy = false; }, 1500);          // 전체 애니메이션(약 1.4초)이 끝나면 해제
    const targetSlide = slides[targetIndex];
    const targetTitle = targetSlide.querySelector('.main-title');
    const targetGrid = targetSlide.querySelector('.unified-grid');
    const anchor = cardEl.querySelector('.target-anchor');
    const arrowRect = cardEl.querySelector('.toc-arrow').getBoundingClientRect();
    const originRect = anchor.getBoundingClientRect();
    const originCS = getComputedStyle(anchor);

    // 숨겨진 상태의 도착 슬라이드를 잠깐 레이아웃시켜 제목의 도착 위치/스타일을 측정
    targetSlide.style.visibility = 'hidden';
    targetSlide.style.display = 'flex';
    const targetRect = targetTitle.getBoundingClientRect();
    const targetCS = getComputedStyle(targetTitle);
    targetSlide.style.display = '';
    targetSlide.style.visibility = '';

    tocParts().forEach(el => { if (el) { el.style.transition = 'opacity .2s ease'; el.style.opacity = '0'; } });
    if (targetGrid) { targetGrid.style.transition = 'none'; targetGrid.style.opacity = '0'; }
    targetTitle.style.opacity = '0';

    setTimeout(() => {
        animateArrowTrace(arrowRect.left + arrowRect.width / 2, arrowRect.top + arrowRect.height / 2, targetRect.left, targetRect.bottom, false);
        const flyer = makeFlyer(targetTitle.innerHTML, originRect, originCS);
        flyTo(flyer, targetRect, targetCS);
        setTimeout(() => {
            showSlide(targetIndex);
            if (targetGrid) { targetGrid.style.transition = 'opacity .6s ease'; targetGrid.style.opacity = '1'; }
            setTimeout(() => { targetTitle.style.opacity = '1'; flyer.remove(); }, 600);
        }, 600);
    }, 200);
}

// 본문 → 목차 (역방향)
function animateSlideToTOC(slideEl) {
    if (flipBusy) return;
    flipBusy = true;
    setTimeout(() => { flipBusy = false; }, 1500);
    const title = slideEl.querySelector('.main-title');
    const grid = slideEl.querySelector('.unified-grid, .ch-fade');
    const tocCard = document.querySelector(`.toc-card[data-target="${chapterIndexOf(currentSlide)}"]`);
    if (!tocCard) { flipBusy = false; showSlide(TOC_INDEX); return; }
    const anchor = tocCard.querySelector('.target-anchor');
    const arrowRect = tocCard.querySelector('.toc-arrow').getBoundingClientRect();
    const originRect = title.getBoundingClientRect();
    const originCS = getComputedStyle(title);
    const targetRect = anchor.getBoundingClientRect();
    const targetCS = getComputedStyle(anchor);

    tocParts().forEach(el => { if (el) { el.style.transition = 'none'; el.style.opacity = '0'; } });
    title.style.opacity = '0';
    if (grid) grid.style.opacity = '0';

    animateArrowTrace(originRect.left, originRect.bottom, arrowRect.left + arrowRect.width / 2, arrowRect.top + arrowRect.height / 2, false);
    const flyer = makeFlyer(title.innerHTML, originRect, originCS);
    showSlide(TOC_INDEX);
    flyTo(flyer, targetRect, targetCS);

    setTimeout(() => {
        tocParts().forEach(el => { if (el) { el.style.transition = 'opacity .4s ease'; el.style.opacity = '1'; } });
        setTimeout(() => { title.style.opacity = '1'; if (grid) grid.style.opacity = '1'; removeFlyerWithFade(flyer); }, 400);
    }, 600);
}

/* ======================================================================
 *  5-b) 발표 도구: 발표자 노트(N) / 타이머(T, R) / 슬라이드 수 경고
 *     - N : 현재 슬라이드의 notes(+발표자 이름) 패널 켜기/끄기
 *     - T : 타이머 켜기/끄기 (켜는 순간 0부터 시작).  R : 타이머 0으로 리셋
 *     - 발표자(presenter)가 바뀌는 슬라이드로 넘어가면 타이머가 자동으로 0부터 다시 시작
 *     - 목표 시간대(DECK.timer): min 이상 = 초록, max 초과 = 깜빡임
 * ====================================================================== */
const notesEl = document.createElement('div'); notesEl.className = 'notes-panel';
const hudEl = document.createElement('div');   hudEl.className = 'timer-hud';
document.body.append(notesEl, hudEl);
let timerOn = false, timerStart = 0, timerTick = null, lastPresenter = SLIDES[0].presenter || '';
const fmtMS = ms => { const t = Math.floor(ms / 1000); return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60); };

function renderNotes() {
    const s = SLIDES[currentSlide];
    const over = DECK.maxSlides && SLIDES.length > DECK.maxSlides;
    notesEl.innerHTML = `<div class="notes-head"><span>${esc(s.presenter || 'NOTES')}</span><span>${numOf(currentSlide)} / ${total}</span></div>
        <div class="notes-body">${s.notes ? txt(s.notes) : '—'}</div>
        ${over ? `<div class="notes-warn">⚠ ${SLIDES.length} slides (max ${DECK.maxSlides})</div>` : ''}`;
}
function renderHud() {
    const T = DECK.timer || {}, el = timerOn ? Date.now() - timerStart : 0, min = el / 60000;
    hudEl.classList.toggle('over', T.maxMinutes != null && min >= T.maxMinutes);
    hudEl.classList.toggle('ok', T.minMinutes != null && min >= T.minMinutes && !(T.maxMinutes != null && min >= T.maxMinutes));
    hudEl.innerHTML = `${lastPresenter ? esc(lastPresenter) + ' · ' : ''}<span class="t">${fmtMS(el)}</span>${T.maxMinutes != null ? ' / ' + pad2(T.maxMinutes) + ':00' : ''}`;
}
function setTimer(on) {
    timerOn = on; clearInterval(timerTick); hudEl.classList.toggle('show', on);
    if (on) { timerStart = Date.now(); renderHud(); timerTick = setInterval(renderHud, 500); }
}
function onSlideChanged() {
    renderNotes();
    const p = SLIDES[currentSlide].presenter || '';
    if (p !== lastPresenter) { lastPresenter = p; if (timerOn) timerStart = Date.now(); }   // 발표자 교대 → 타이머 리셋
    if (timerOn) renderHud();
}
window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { renderNotes(); notesEl.classList.toggle('show'); }
    else if (k === 't') setTimer(!timerOn);
    else if (k === 'r' && timerOn) { timerStart = Date.now(); renderHud(); }
});
renderNotes();

/* ======================================================================
 *  6) 초기화: 커서, 라이트박스, 목차 클릭, 리사이즈
 * ====================================================================== */
(function init() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const cursor = document.querySelector('.custom-cursor');

    // Esc 핑 이펙트용 요소
    const ping = document.createElement('div');
    ping.className = 'cursor-ping';
    document.body.appendChild(ping);

    // 커서/핑이 마우스를 따라다님
    document.addEventListener('mousemove', e => {
        requestAnimationFrame(() => {
            cursor.style.left = ping.style.left = e.clientX + 'px';
            cursor.style.top  = ping.style.top  = e.clientY + 'px';
        });
    });
    document.addEventListener('mousedown', () => cursor.classList.add('click-active'));
    document.addEventListener('mouseup',   () => cursor.classList.remove('click-active'));

    // 클릭 가능한 요소 위에서는 커서를 키움
    const hoverTargets = '.toc-card, .unified-card, canvas, #image-modal, .card-image-wrapper, .hidden-jump-btn, #toc-fab';
    document.addEventListener('mouseover', e => { if (e.target.closest(hoverTargets)) cursor.classList.add('hover-active'); });
    document.addEventListener('mouseout',  e => { if (!e.target.closest(hoverTargets)) cursor.classList.remove('hover-active'); });

    // Esc: 마우스 위치에서 핑 애니메이션
    window.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        ping.classList.remove('animate');
        void ping.offsetWidth;            // 리플로우로 애니메이션 재시작
        ping.classList.add('animate');
    });

    // 목차 카드 클릭 → 해당 본문으로 FLIP 이동
    document.querySelectorAll('.toc-card').forEach(card => {
        card.addEventListener('click', () => animateTOCToSlide(card, parseInt(card.dataset.target)));
    });

    // 숨은 '결론으로 이동' 버튼
    const jump = document.getElementById('jump-to-end');
    if (jump) jump.addEventListener('click', e => { e.stopPropagation(); showSlide(parseInt(jump.dataset.target)); });

    // 카드 이미지 클릭 → 라이트박스 확대, 바깥 클릭 → 닫기
    document.querySelectorAll('.card-img').forEach(img => {
        img.addEventListener('click', e => {
            e.stopPropagation();
            modalImg.src = img.getAttribute('src');
            modal.classList.add('active');
        });
    });
    modal.addEventListener('click', () => {
        modal.classList.remove('active');
        setTimeout(() => { modalImg.src = ''; }, 400);
    });

    // 창 크기가 바뀌면(발표 화면 전환 등) 배율 재계산. 차트 슬라이드면 글자 크기 반영을 위해 다시 그림
    let t;
    window.addEventListener('resize', () => {
        clearTimeout(t);
        t = setTimeout(() => {
            applyScale();
            if (chartDefs[currentSlide]) renderCharts(currentSlide);
        }, 150);
    });
})();
</script>
</body>
</html>
