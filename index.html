<!--
================================================================================
  PRESENTATION TEMPLATE  (단일 HTML 프레젠테이션 템플릿)
  내용은 비우고 구조/디자인은 그대로 유지한 버전

  [변경 이력]
  v1.3 (2026-11-25)  저울 슬라이드 scale 추가 -- 왼쪽 접시에 작은 숫자만큼 동전, 오른쪽은 비어 있다가 클릭하면 동전이 과장되게 쏟아지며 저울이 기울어짐
  v1.2 (2026-11-25)  강조 비교 슬라이드 emphasis 추가 (kind: bar / donut / bubble -- 처음엔 정확한 비율, 클릭하면 강조 대상만 키우고 나머지 축소)
                     슬라이드 내 단계(build) 애니메이션: build:true 면 클릭할 때마다 항목이 하나씩 등장, buildAnim 으로 효과 선택,
                     ← / 우클릭으로 한 단계씩 되돌리기, 푸터에 단계 점 표시(DECK.stepDots)
  v1.1 (2026-11-25)  슬라이드 type 7종 추가: keyfacts / stakeholders / timeline / questionnaire /
                     respondents / findings / sources
                     공통 기능 추가: presenter(발표자 표시), notes(발표자 노트, N 키), 타이머(T/R 키),
                     DECK.maxSlides(슬라이드 수 경고), 표지 없는 덱의 번호 자동 보정
                     차트: doughnut(도넛) / horizontal(가로 막대) 지원
  v1.0               최초 버전(cover / charts / intro / toc / chapter / conclusion)
================================================================================

■ 사용법 (사람)
  1. <script> 안의 "★ 수정 영역"만 고치세요: DECK(전체 설정) / SIDES(비교 대상 색) / SLIDES(슬라이드 목록).
  2. 슬라이드 HTML, 목차(TOC), 페이지 번호(n / N), 챕터 번호(01. 02.), 이동 규칙은 전부 자동 생성됩니다.
  3. 챕터 추가 = chapter 블록 통째로 복사 → 붙여넣기 → 내용만 변경.
  4. 이미지 칸을 비워 두면(img: '') 회색 플레이스홀더가 자동으로 표시됩니다.
  5. 조작: 클릭 / → / Space / Enter = 다음,  우클릭 / ← = 이전 (챕터 본문에서 우클릭 = 목차로 복귀),  Esc = 커서 핑.
  6. 발표 도구: N = 발표자 노트 패널 켜기/끄기,  T = 타이머 켜기/끄기,  R = 타이머 리셋.
     (발표자(presenter)가 바뀌는 슬라이드로 넘어가면 타이머가 자동으로 0부터 다시 시작)
  7. 단계 애니메이션: build:true 슬라이드는 클릭 / → / Space 를 누를 때마다 한 단계씩 진행, 마지막 단계 다음 클릭에서 다음 슬라이드로.
     ← / 우클릭 = 한 단계 뒤로(첫 단계에서 한 번 더 = 이전 슬라이드). 이전 슬라이드로 돌아오면 완성된 상태로 보임.

■ 사용법 (AI에게 시킬 때) — 아래 프롬프트를 그대로 써도 됩니다
  "이 템플릿의 SLIDES 데이터만 [주제] 내용으로 채워줘. CSS/JS 로직은 건드리지 마.
   새 슬라이드가 필요하면 아래 DESIGN LANGUAGE 를 따라 기존 type 을 재사용하고,
   정말 새 형태가 필요할 때만 BUILDERS 에 새 type 을 추가해."

================================================================================
  🎨 DESIGN LANGUAGE (디자인 언어 요약) — AI가 이 스타일을 그대로 이어가기 위한 가이드
================================================================================

[A. 전체 분위기]
  - 다크 시네마틱 / 에디토리얼. 거의 검은 배경(#050505) 위에 흰 글자 + 은은한 투명 카드.
  - "빛(glow)"과 "숨쉬는 움직임"이 시그니처: 제목 끝 점이 깜빡이고, 빛 구체가 펄스하고, 큰 글자가 빛난다.
  - 장식은 최소화. 카드는 border 1px + 아주 옅은 배경(rgba(255,255,255,0.02))만 사용. 그림자/그라데이션 남발 금지.

[B. 색상 토큰]
  - 배경      : #050505 (본문) / #090909 (목차 우측) / linear-gradient(#050505 → #0c140f) (목차 좌측)
  - 글자      : #fff (제목) / rgba(255,255,255,.7) (본문) / .6 (카드 설명) / .4 (푸터) / .3 (힌트)
  - 포인트 1  : #2ed573 (초록) = 시스템 강조색: 체크 ✓, 목차 호버 막대, 카테고리 태그, 화살표 선, 인용 따옴표, 클릭 커서
  - 포인트 2  : #5352ed (보라) = 제목 끝 점(.), 태그의 구분 글자, 차트 카드 제목의 왼쪽 막대
  - 비교 대상 색: SIDES 의 color (카드 배지, 차트 색, 메트릭 강조). 대상이 2개면 보라/초록 계열 권장.
  - 선/테두리 : rgba(255,255,255, .04 ~ .1) 의 아주 옅은 흰색. 진한 선 금지.

[C. 타이포그래피]
  - 폰트: 'Poppins' + 'Noto Sans KR' (Google Fonts). 굵기는 300(설명) / 700(소제목) / 900(제목·숫자) 세 단계만 씀.
  - 제목(h1.main-title): 900, 4.8rem (챕터 슬라이드는 3rem), letter-spacing -1px, line-height 1.3
  - 모든 제목 끝에는 깜빡이는 점 <span class="dot">.</span> (보라색, 자동 삽입)
  - 작은 라벨(태그/카테고리): 대문자 + 넓은 letter-spacing (2~6px) + 700
  - 크기 단위는 전부 rem (1920x1080 기준 1rem=16px). JS가 html font-size 를 화면에 맞춰 바꿔 전체가 비례 확대/축소됨.
    → 새 CSS 를 쓸 때도 px 대신 rem 사용. (px ÷ 16 = rem)

[D. 레이아웃 규칙]
  - 모든 슬라이드: 위 공통 헤더(태그 + 번호 / 이모지, 아래 옅은 구분선) + 아래 공통 푸터(왼쪽 문구 / 오른쪽 "n / N").
  - 슬라이드 안쪽 여백 3.75rem 5rem. 카드 사이 간격 2.1875rem. 카드 모서리 둥글기 1.5rem (차트 카드 1.25rem).
  - 본문은 .content-container (column = 위 제목 + 아래 콘텐츠) 또는 좌/우 2열(.left-col / .right-col).
  - 카드 그리드는 장수에 맞춰 열 수(--cols)를 JS가 지정: 1~4장 한 줄, 5장 이상 두 줄.

[E. 시그니처 요소 — 이것들이 이 디자인의 "말투"입니다]
  1) 커스텀 커서: 기본 포인터 숨김, 반투명 흰 원이 마우스를 따라다님.
        호버 가능 요소 위 = 커짐 / 클릭 중 = 초록 원 / Esc = 핑(파동) 이펙트.
  2) 빛 구체(.glow-sphere): 블러된 radial-gradient 원이 4초 주기로 커졌다 작아졌다(pulse). 표지 뒤에 깔림.
  3) 거대 글자(.giant-text): 10rem. 'outline'(투명 + 얇은 흰 테두리) 두 줄 사이에 'fill'(빛나는 흰 글자, glow-pulse 3초) 한 줄을 끼움.
  4) ★ 카드 연결(TOC ↔ 챕터 FLIP 전환): 목차 카드를 클릭하면
        ① 목차가 페이드아웃 → ② 카드의 제목이 "날아가는 제목(.flying-title)"이 되어 본문 제목 위치/크기로 이동
        → ③ 동시에 목차의 화살표(→)에서 본문 제목까지 초록 곡선 화살표(.trace-path, SVG 베지어)가 그려짐
        → ④ 본문 카드 그리드가 페이드인. 우클릭하면 같은 동작이 역방향으로 재생됨.
        목차 카드는 호버 시: 왼쪽에 초록 세로 막대가 자라나고, 큰 번호가 초록으로 물들며, 화살표가 오른쪽으로 밀림.
        (구현: animateTOCToSlide / animateSlideToTOC / animateArrowTrace — 좌표는 getBoundingClientRect 로 실측)
  5) ★ 배경 이미지(.conclusion-bg): 결론 슬라이드는 이미지를 풀스크린 배경으로 깔되
        ① 좌우 반전(scaleX(-1)) ② 불투명도 .35 ③ 슬라이드가 활성화될 때 1.5초에 걸쳐 서서히 나타남 ④ 내용은 z-index 1 로 그 위에.
        배경 이미지는 "어둡고 분위기 있는 사진"을 쓰면 글자 가독성이 유지됨.
  6) 떠다니는 비눗방울(.floating-obj): 표지에 투명 SVG/PNG 를 절대 위치로 흩뿌리고 arc / float / breathe / spin 애니메이션 부여.
  7) 비교 카드(.unified-card): 16:9 이미지 + 좌상단 알약형 배지(SIDES 색) + 제목/설명. 호버 시 이미지 5% 확대, 클릭 시 라이트박스.
  8) 차트 카드(.chart-card): 아래에서 위로 올라오며 페이드인, 카드마다 0.1s 간격 지연(stagger). 차트는 진입할 때마다 새로 그려 애니메이션 재생.
  9) 결론 인용 카드(.final-quote-card): 좌상단 “ 와 우하단 ”(180° 회전) 초록 따옴표로 대칭 장식, 이탤릭 굵은 글씨.
 10) 슬라이드 전환: opacity 페이드 .6s. 이웃한 두 슬라이드가 모두 fade:true 면 더 느린 .8s 페이드.

[F. 슬라이드 type 카탈로그 (기존 type 을 최대한 재사용할 것)]
  cover      표지: 부제 / 큰 제목 / 설명 / 힌트 + 비눗방울(선택)
  charts     차트 대시보드: 차트 카드 1~3개 + 요약(metrics) 카드 1개(선택)
  intro      좌: 제목+설명 / 우: 거대 글자 3줄
  toc        목차: 좌(제목·통계·숨은 점프 버튼) / 우(챕터 카드 목록 — chapter 슬라이드에서 자동 수집)
  chapter    본문: 제목 + 비교 카드 1~N장 (목차와 FLIP 연결됨)
  conclusion 결론: 체크 리스트 + 설명 + 인용 카드 + 배경 이미지
  keyfacts      핵심 수치: 큰 숫자 카드 1~4개 (이전값 → 현재값 + 변화율 알약)
  stakeholders  이해관계자: 입장 카드 1~6개 (SIDES 배지 + 이름/직함 + 인용문)
  timeline      타임라인: 시간순 사건 2~6개 (hl:true 인 항목은 초록 강조)
  questionnaire 설문지: Q번호 + 질문 + 목적 + 응답 유형 (3~5문항 권장)
  respondents   응답자: 프로필 카드(최대 12) + 오른쪽 분포 막대(연령/성별 등 자동 비율)
  findings      조사 결과: 문항별 차트(bar / line / doughnut / 가로 막대) 1~3개 + 대표 답변 인용
  sources       출처: 번호 목록 + 각주(데이터 확인 필요 사항 등)
  emphasis      강조 비교: 숫자 비교를 "크기"로 보여줌. kind = 'bar' | 'donut' | 'bubble'.
                첫 화면은 수치에 맞는 정확한 그림 → 클릭할 때마다 steps[] 의 대상만 크게 키우고 나머지는 줄임(+ 큰 숫자 + 설명 문장)
  scale         저울: 돈 비교 전용 강조 슬라이드. 왼쪽 접시에 동전이 쌓여 있고 오른쪽은 빈 상태 → 클릭하면 오른쪽에 동전이 과장되게 쌓이며
                저울이 기울어짐(+ 큰 숫자 + 설명). 접시 위 동전 수는 실제 금액이 아니라 "느낌"을 위한 과장값
  ※ 모든 type 공통 필드: presenter(우상단 발표자 표시), notes(발표자 노트 — N 키), build / buildAnim(단계 애니메이션)
  ※ 새 type 이 필요하면: (1) BUILDERS 에 함수 추가 (2) 필요한 CSS 를 위 디자인 토큰대로 작성 (3) SLIDES 에서 type 으로 호출.

[G. 하지 말 것]
  - 흰 배경/밝은 카드, 진한 테두리, 강한 그림자, 원색 배경 면적 큰 블록 사용 금지.
  - 위 두 포인트색(초록/보라) 외의 새 강조색을 임의로 추가하지 말 것 (비교 대상 색은 SIDES 에서만 추가).
  - px 단위 하드코딩 금지 (rem 사용).

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fares Up 15% - Society of the Republic of Ireland</title>

    <!-- 차트 라이브러리 (charts 슬라이드를 안 쓰면 이 줄은 지워도 됨) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 폰트 (원본 @import 의 오타 'wght=' 를 바로잡아 <link> 로 교체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,700;0,900;1,300&family=Noto+Sans+KR:wght@300;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
         *  0. 크기 체계 (가장 중요!)
         *  - 모든 크기를 rem 으로 씁니다. (1rem = 기본 16px, 1920x1080 기준)
         *  - JS(applyScale)가 <html> 의 font-size 를 화면 크기에 맞춰 바꾸므로
         *    rem 으로 쓴 모든 요소가 한꺼번에 비례해서 커지고 작아집니다.
         *  - 새로 CSS 를 쓸 때도 px 대신 rem 을 쓰세요. (px ÷ 16 = rem)
         * ============================================================ */
        html { font-size: 16px; } /* JS가 덮어씀. JS 실행 전 기본값 */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 🎨 DESIGN: 거의 검은 배경(#050505) + 흰 글자. 폰트는 Poppins(영문) + Noto Sans KR(한글), 굵기 300/700/900 만 사용 */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* ============================================================
         *  1. 커스텀 마우스 커서 (기본 포인터는 숨김)
         * ============================================================ */
        body, .presentation, .slide, .toc-card, .unified-card, canvas, #image-modal, .card-image-wrapper, .hidden-jump-btn, #toc-fab {
            cursor: none !important;
        }
        /* 🎨 DESIGN [시그니처 1: 커스텀 커서] 기본 포인터를 숨기고 반투명 흰 원이 마우스를 따라다님.
         *   기본=작은 원 → 클릭 가능 요소 위(.hover-active)=커짐 → 클릭 중(.click-active)=초록 원 */
        .custom-cursor {
            position: fixed; top: 0; left: 0;
            width: .875rem; height: .875rem;
            background-color: rgba(255, 255, 255, 0.1);           /* 기본: 반투명 회색 */
            border-radius: 50%;
            pointer-events: none; z-index: 10001;
            transform: translate(-50%, -50%);
            transition: width .3s cubic-bezier(0.25, 1, 0.5, 1), height .3s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color .3s ease, border .3s ease;
        }
        /* 클릭 가능한 요소 위: 커지고 선명해짐 */
        .custom-cursor.hover-active {
            width: 3.125rem; height: 3.125rem;
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* 클릭 중: 맑은 초록색 원 */
        .custom-cursor.click-active {
            width: 4.0625rem; height: 4.0625rem;
            background-color: rgba(46, 213, 115, 0.15);
            border: 2px solid rgba(46, 213, 115, 0.35);
        }
        /* Esc 핑 효과 */
        .cursor-ping {
            position: fixed; top: 0; left: 0;
            width: 3.75rem; height: 3.75rem;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none; z-index: 10000;
            transform: translate(-50%, -50%) scale(0); opacity: 0;
        }
        .cursor-ping.animate { animation: ping-burst .5s ease-out forwards; }
        @keyframes ping-burst {
            0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            10%  { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; }
        }

        /* ============================================================
         *  2. 프레젠테이션 / 슬라이드 공통
         *  - 슬라이드는 전부 겹쳐 놓고 .active 인 것만 보이게 합니다.
         * ============================================================ */
        .presentation { position: relative; width: 100vw; height: 100vh; }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden;
            transition: opacity .6s ease, visibility .6s ease;
            padding: 3.75rem 5rem;
            display: flex; flex-direction: column;
        }
        .slide.active { opacity: 1; visibility: visible; }
        /* 지정된 슬라이드 사이(데이터의 fade:true)에서만 쓰는 느린 페이드 */
        .slide.fade-transition { transition: opacity .8s cubic-bezier(0.25, 1, 0.5, 1), visibility .8s; }

        /* 공통 헤더/푸터 */
        .slide-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: .9375rem; z-index: 10;
        }
        .slide-tag { font-size: 1.05rem; font-weight: 700; letter-spacing: 2px; color: rgba(255, 255, 255, 0.6); }
        .slide-tag span { color: #5352ed; }
        .slide-footer {
            position: absolute; bottom: 1.875rem; left: 5rem; right: 5rem;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.05rem; color: rgba(255, 255, 255, 0.4); z-index: 10;
        }

        /* ============================================================
         *  3. 타이포그래피 & 본문 레이아웃
         * ============================================================ */
        .content-container {
            flex: 1; display: flex; align-items: flex-start;
            gap: 3.125rem; padding: 3.75rem 0 5rem 0;
            position: relative; width: 100%; overflow: hidden;
        }
        .content-container.column { flex-direction: column; align-items: flex-start; justify-content: flex-start; }
        .left-col  { flex: 1; padding-left: 0; }
        .right-col { flex: 1.2; display: flex; justify-content: center; align-items: center; position: relative; align-self: center; }

        h1.main-title {
            font-size: 4.8rem; font-weight: 900; line-height: 1.3;
            margin-bottom: 1.5625rem; letter-spacing: -1px;
            position: relative; z-index: 100; opacity: 1;
        }
        /* 카드가 들어가는 본문(chapter) 슬라이드는 제목을 줄여 카드 공간을 확보 */
        .slide.chapter h1.main-title, .slide.chapter-part h1.main-title { font-size: 3rem; margin-bottom: 1.25rem; }
        .em-kicker { font-size: 1.15rem; font-weight: 700; letter-spacing: .25rem; text-transform: uppercase; color: rgba(255,255,255,0.55); }

        /* 제목 끝의 점: 숨쉬듯 깜빡임 (원본엔 keyframes 정의가 빠져 있어 새로 추가) */
        .dot { color: #5352ed; display: inline-block; animation: dot-pulse 1.5s infinite ease-in-out !important; }
        @keyframes dot-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.25); } }

        p.description { font-size: 1.6rem; color: rgba(255, 255, 255, 0.7); line-height: 1.7; }

        /* ============================================================
         *  4. 비주얼 오브젝트 (빛 구체, 거대 글자)
         * ============================================================ */
        /* 🎨 DESIGN [시그니처 2: 빛 구체] 블러된 radial-gradient 원이 4초 주기로 숨쉬듯 커졌다 작아짐.
         *   .cover 변형은 초록+보라 혼합 광원으로 표지 뒤에 깔림. 카드/텍스트 뒤 은은한 광원이 필요할 때 재사용. */
        .glow-sphere {
            position: absolute; width: 18.75rem; height: 18.75rem;
            background: radial-gradient(circle, rgba(83, 82, 237, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(1.25rem); animation: pulse 4s infinite alternate;
        }
        .glow-sphere.cover {
            width: 28.125rem; height: 28.125rem;
            background: radial-gradient(circle, rgba(46,213,115,0.25) 0%, rgba(83,82,237,0.15) 50%, rgba(0,0,0,0) 70%);
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.2); opacity: .9; } }

        .giant-text-wrapper { display: flex; flex-direction: column; gap: .625rem; text-align: center; }
        /* 🎨 DESIGN [시그니처 3: 거대 글자] outline(투명+얇은 테두리) 줄들 사이에 fill(빛나는 글자) 한 줄을 끼워 강조 */
        .giant-text { font-size: 10rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; line-height: .9; }
        .giant-text.outline { color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2); }
        .giant-text.fill {
            color: #f0f0f0;
            text-shadow: 0 0 15px rgba(255,255,255,0.3), 0 0 40px rgba(255,255,255,0.2), 0 0 80px rgba(255,255,255,0.1);
            animation: glow-pulse 3s infinite alternate ease-in-out;   /* 3초 주기로 숨쉬는 빛 */
        }
        @keyframes glow-pulse {
            from { text-shadow: 0 0 10px rgba(255,255,255,0.1), 0 0 20px rgba(255,255,255,0.05), 0 0 40px rgba(255,255,255,0.02); }
            to   { text-shadow: 0 0 30px rgba(255,255,255,0.6), 0 0 100px rgba(255,255,255,0.4), 0 0 300px rgba(255,255,255,0.3); }
        }

        /* ============================================================
         *  5. 비교 카드 그리드 (chapter 슬라이드)
         *  - 카드 장수(1~4+)에 맞춰 열 수(--cols)를 JS가 지정합니다.
         *  - 카드 색(배지)은 --side-color 로 국가별 색을 받습니다 (SIDES 설정).
         * ============================================================ */
        .unified-grid {
            display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
            gap: 2.1875rem; width: 100%; opacity: 1; transition: opacity .4s ease;
        }
        .unified-grid[data-n="1"] { max-width: 56rem; }      /* 카드 1장이면 너무 커지지 않게 */
        .card-image-wrapper {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            overflow: hidden; background-color: #111; flex-shrink: 0;
        }
        /* 🎨 DESIGN [시그니처 7: 비교 카드] 옅은 유리 느낌 카드(배경 .02 + 테두리 .05, 모서리 1.5rem).
         *   위: 16:9 이미지(+좌상단 알약 배지, 색=--side-color) / 아래: 제목(700) + 설명(300). 호버 시 이미지 확대. */
        .unified-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem; overflow: hidden;
            display: flex; flex-direction: column; height: 100%;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; opacity: .75; transition: transform .5s ease; }
        .unified-card:hover .card-img { transform: scale(1.05); }
        .card-badge {
            position: absolute; top: 1.25rem; left: 1.25rem;
            padding: .375rem .875rem; font-size: .95rem; font-weight: 900; letter-spacing: 1.5px;
            border-radius: 1.875rem; z-index: 2; color: #fff; background: var(--side-color, #5352ed);
        }
        .card-info { padding: 1.5625rem 1.875rem; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-info h3 { font-size: 1.9rem; font-weight: 700; margin-bottom: .625rem; color: #fff; }
        .card-info p  { font-size: 1.3rem; color: rgba(255, 255, 255, 0.6); line-height: 1.6; font-weight: 300; }

        /* ============================================================
         *  6. 결론 슬라이드
         * ============================================================ */
        .conclusion-list { list-style: none; display: flex; flex-direction: column; gap: .9375rem; }
        .conclusion-list li {
            font-size: 1.8rem; color: rgba(255, 255, 255, 0.8);
            padding-left: 1.5625rem; position: relative; font-weight: 300;
        }
        .conclusion-list li::before { content: "✓"; position: absolute; left: 0; color: #2ed573; font-weight: 900; }
        .conclusion-list li strong { color: #fff; font-weight: 700; margin-right: .625rem; }

        .slide.conclusion { overflow: hidden; }
        /* 🎨 DESIGN [시그니처 5: 배경에 이미지 두기]
         *   - 이미지를 슬라이드 전체(absolute, 100%x100%)에 background-size:cover 로 깔고
         *   - transform:scaleX(-1) 로 좌우 반전 (원본 구도와 다르게 보이게 + 오른쪽 인용 카드와 균형)
         *   - 평소 opacity:0 → 슬라이드 .active 가 되면 .35 로 1.5초 동안 서서히 나타남 (아래 .slide.conclusion.active .conclusion-bg)
         *   - z-index:0, 내용(.content-container)은 z-index:1 로 그 위에 올림, pointer-events:none 으로 클릭 방해 금지
         *   → 다른 슬라이드에 배경 이미지를 넣을 때도 이 4가지(반전/낮은 불투명도/페이드인/z-index 분리)를 그대로 따라 할 것 */
        .conclusion-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transform: scaleX(-1);                                  /* 좌우 반전 */
            opacity: 0; transition: opacity 1.5s ease-in-out;
            z-index: 0; pointer-events: none;
        }
        .slide.conclusion.active .conclusion-bg { opacity: .35; }   /* 활성화되면 서서히 나타남 */
        .slide.conclusion .content-container { z-index: 1; background: transparent; gap: 2.5rem; }
        .conclusion-body-wrapper { display: flex; align-items: stretch; gap: 3.75rem; width: 100%; }
        .conclusion-left-body  { flex: 1.2; display: flex; flex-direction: column; justify-content: space-between; }
        .conclusion-right-body { flex: 1; display: flex; align-items: stretch; }
        .conclusion-left-body .description { margin-top: 1.25rem; padding-top: 1.875rem; font-size: 1.5rem; line-height: 1.6; }
        /* 🎨 DESIGN [시그니처 9: 인용 카드] 좌상단 “ / 우하단 ”(180° 회전) 초록 따옴표(opacity .4)로 대칭 장식 */
        .final-quote-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.5rem; padding: 5.4rem 6rem; text-align: center; width: 100%;
            min-height: 12.5rem; max-height: 80%; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .final-quote-card::before, .final-quote-card::after {
            content: "“"; position: absolute; font-size: 5rem; font-family: 'Poppins', sans-serif;
            color: #2ed573; opacity: .4;
        }
        .final-quote-card::before { top: 1.875rem; left: 2.5rem; }
        .final-quote-card::after  { bottom: 1.875rem; right: 2.5rem; transform: rotate(180deg); }   /* 대칭 */
        .final-quote-card p { font-size: 1.9rem; font-weight: 700; line-height: 1.5; color: #fff; font-style: italic; }

        /* ============================================================
         *  7. 이미지 확대 라이트박스
         * ============================================================ */
        .img-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity .4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .img-modal.active { opacity: 1; pointer-events: auto; }
        .img-modal img {
            max-width: 85%; max-height: 85%; object-fit: contain; border-radius: 1rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(.9) translateY(1.25rem);
            transition: transform .4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .img-modal.active img { transform: scale(1) translateY(0); }

        /* ============================================================
         *  8. 목차(TOC) 슬라이드: 좌(제목) / 우(챕터 카드 목록)
         * ============================================================ */
        #slide-toc .content-container {
            position: absolute; top: 3.75rem; left: 0; width: 100%; height: calc(100% - 7.1875rem);
            padding: 0; gap: 0; display: flex;
        }
        .toc-left {
            flex: 1; height: 100%; padding: 3.75rem 3.75rem 2.8125rem 5rem;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
            background: linear-gradient(to bottom, rgba(5,5,5,1), rgba(12,20,15,1));
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .category-tag { color: #2ed573; font-size: .85rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; margin-bottom: .9375rem; }
        .toc-footer-stats { display: flex; gap: 3.75rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.5625rem; }
        .toc-footer-stats .num { font-size: 2.5rem; font-weight: 900; color: #2ed573; line-height: 1; }
        .toc-footer-stats .lbl { font-size: 1rem; color: rgba(255,255,255,0.4); margin-top: .5rem; letter-spacing: 1px; }

        .toc-right {
            /* 챕터 개수에 따라 JS가 --cols(열 수), --k(글자/여백 배율)를 지정 → 몇 개를 넣어도 칸이 균등하게 나뉨 */
            flex: 1.2; height: 100%; background: #090909; transition: opacity .4s ease;
            display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
        }
        /* 🎨 DESIGN [시그니처 4-a: 목차 카드] 카드 경계는 아주 옅은 하단선뿐. 호버하면
         *   (1) ::before 초록 세로 막대가 scaleY 0→1 로 자라남  (2) 큰 번호(.toc-num)가 초록으로 물들며 커짐  (3) 화살표(→)가 오른쪽으로 이동.
         *   이 화살표(.toc-arrow)가 챕터로 갈 때 "초록 곡선 화살표 선"의 출발점이 됨. */
        .toc-card {
            border-bottom: 1px solid rgba(255,255,255,0.04); padding: 0 calc(3.75rem * var(--k, 1)); min-height: 0;
            display: flex; align-items: center; gap: calc(2.5rem * var(--k, 1)); position: relative; transition: background-color .4s ease;
        }
        .toc-card::before {                                         /* 호버 시 왼쪽에 나타나는 초록 막대 */
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background-color: #2ed573; transform: scaleY(0); transition: transform .3s ease;
        }
                .toc-card:hover { background: rgba(46,213,115,0.02); }
        .toc-card:hover::before { transform: scaleY(1); }
        .toc-num { font-size: calc(3.5rem * var(--k, 1)); font-weight: 900; color: rgba(255,255,255,0.04); transition: color .3s ease, transform .3s ease; }
        .toc-card:hover .toc-num { color: rgba(46,213,115,0.2); transform: scale(1.05); }
        .toc-info { flex: 1; }
        .toc-step { font-size: calc(1rem * var(--k, 1)); color: #2ed573; font-weight: 700; letter-spacing: 2px; margin-bottom: .5rem; }
        .target-anchor { font-size: calc(1.5rem * var(--k, 1)); color: #fff; margin-bottom: calc(.625rem * var(--k, 1)); font-weight: 900; display: block; line-height: 1.3; }
        .toc-info p { font-size: calc(1.3rem * var(--k, 1)); color: rgba(255,255,255,0.5); line-height: 1.5; }
        .toc-arrow { font-size: calc(1.8rem * var(--k, 1)); color: rgba(255,255,255,0.1); transition: all .3s ease; }
        .toc-card:hover .toc-arrow { color: #2ed573; transform: translateX(.5rem); }

        /* 목차 좌측 하단의 숨겨진 '결론으로 이동' 버튼 (마우스를 올리면 보임) */
        .hidden-jump-btn {
            position: absolute; bottom: 2.8125rem; left: 38%; width: 12.5rem; height: 2.5rem; z-index: 100;
            opacity: 0; border: none; background: none; transition: opacity .3s ease;
            font-weight: bold; color: #8888883e; font-size: 1.2rem; padding: .625rem;
        }
        .hidden-jump-btn:hover { opacity: 1; }

        /* ============================================================
         *  9. 차트 대시보드 슬라이드 (카드 수에 맞춰 열 수 자동: --cols)
         * ============================================================ */
        /* 🎨 DESIGN [시그니처 8: 차트 카드] 카드는 처음에 opacity 0 + 아래 1.25rem → 슬라이드가 active 되면 위로 올라오며 페이드인,
         *   nth-child 별로 transition-delay 를 .1s 씩 늘려 순차 등장(stagger). 카드 제목 왼쪽에 보라색 3px 막대. */
        .chart-dashboard { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 1.5625rem; width: 100%; height: 75%; }
        .chart-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.25rem; padding: 1.5625rem; display: flex; flex-direction: column;
            opacity: 0; transform: translateY(1.25rem);
            transition: opacity .8s cubic-bezier(0.22,1,0.36,1), transform .8s cubic-bezier(0.22,1,0.36,1);
        }
        .slide.active .chart-card { opacity: 1; transform: translateY(0); }
        .slide.active .chart-card:nth-child(1) { transition-delay: .1s; }
        .slide.active .chart-card:nth-child(2) { transition-delay: .2s; }
        .slide.active .chart-card:nth-child(3) { transition-delay: .3s; }
        .slide.active .chart-card:nth-child(4) { transition-delay: .4s; }
        .chart-card h4 { font-size: 1.6rem; color: rgba(255,255,255,0.7); margin-bottom: 1.25rem; font-weight: 500; border-left: 3px solid #5352ed; padding-left: .625rem; }
        .canvas-container { position: relative; flex: 1; width: 100%; min-height: 13.75rem; }
        .info-summary-card { justify-content: space-between; }
        .metric-row { display: flex; flex-direction: column; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: .625rem; margin-bottom: .625rem; }
        .metric-row:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .m-title  { font-size: 1rem; color: rgba(255,255,255,0.4); margin-bottom: .25rem; }
        .m-values { font-size: 1.2rem; color: rgba(255,255,255,0.8); display: flex; gap: .5rem; }
        .m-values .bar { color: rgba(255,255,255,0.15); }
        .m-values .hl  { color: var(--side-color, #fff); font-weight: bold; }   /* 강조: 해당 국가 색 */

        /* ============================================================
         *  10. 표지 슬라이드 & 떠다니는 비눗방울
         * ============================================================ */
        .intro-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
        .intro-subtitle { font-size: 1.2rem; font-weight: 700; letter-spacing: .375rem; color: #2ed573; margin-bottom: 1.25rem; text-transform: uppercase; }
        .intro-title { font-size: 12rem; font-weight: 900; line-height: 1.15; letter-spacing: -2px; margin-bottom: 1.875rem; }
        .intro-desc  { font-size: 1.5rem; color: rgba(255,255,255,0.6); max-width: 37.5rem; line-height: 1.8; font-weight: 300; }
        .intro-hint  { position: absolute; bottom: 1.25rem; font-size: .85rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

        /* 🎨 DESIGN [시그니처 6: 떠다니는 오브젝트] 투명 배경 SVG/PNG 를 절대 위치로 배치(z-index 최상단, 클릭 통과)하고
         *   anim-arc(흔들림) / anim-float(위아래) / anim-breathe(커졌다작아짐) / anim-spin(3D 회전) 중 하나를 부여.
         *   크기/위치는 SLIDES 의 bubbles 데이터에서 지정 (1920x1080 기준 px). */
        .floating-obj { position: absolute; z-index: 9999; pointer-events: none; }   /* 크기/위치는 데이터에서 지정 */
        .anim-spin    { animation: rotate-3d 10s infinite linear; will-change: transform; }
        .anim-arc     { animation: arc-swing 6s infinite ease-in-out; transform-origin: center -6.25rem; }
        .anim-float   { animation: float-y 8s infinite ease-in-out; }
        .anim-breathe { animation: breathe 4s infinite ease-in-out; }
        @keyframes rotate-3d { 0% { transform: rotateY(0) rotateX(0); } 50% { transform: rotateY(180deg) rotateX(20deg); } 100% { transform: rotateY(360deg) rotateX(0); } }
        @keyframes arc-swing { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(2deg); } }
        @keyframes float-y   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.125rem); } }
        @keyframes breathe   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* ============================================================
         *  11. TOC ↔ 본문 전환용 (날아가는 제목 / 화살표 선)
         * ============================================================ */
        /* 🎨 DESIGN [시그니처 4-b: 카드 연결 전환] 목차 카드의 제목을 복제한 요소(.flying-title)가 fixed 로 떠서
         *   (출발 rect → 도착 rect, 글자 크기/굵기/줄간격까지 함께) .6s 동안 이동. 동시에 .trace-path(초록 곡선 화살표)가 그려짐.
         *   → "목차의 이 카드가 저 페이지로 이어진다"는 연결감을 주는 핵심 장치. 챕터가 늘어나도 자동 적용됨. */
        .flying-title {
            position: fixed; font-weight: 900; line-height: 1.3; letter-spacing: -1px; color: #fff;
            z-index: 9999; pointer-events: none; transform-origin: left top; white-space: nowrap;
        }
        .fade-out { opacity: 0; transition: opacity .5s ease; }
        .trace-svg-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }
        /* 🎨 DESIGN: 초록(#2ed573) 2.5px 둥근 선 + 은은한 초록 drop-shadow(glow). stroke-dashoffset 로 선이 그려지는 효과 */
        .trace-path { fill: none; stroke: #2ed573; stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(46,213,115,0.5)); }

        /* ============================================================
         *  13. 신규 슬라이드 type 공통 (v1.1)
         * ============================================================ */
        /* 본문이 카드/리스트인 슬라이드는 chapter 처럼 제목을 줄여 공간 확보 */
        .slide.keyfacts h1.main-title, .slide.stakeholders h1.main-title, .slide.timeline h1.main-title,
        .slide.questionnaire h1.main-title, .slide.respondents h1.main-title, .slide.findings h1.main-title,
        .slide.sources h1.main-title { font-size: 3rem; margin-bottom: 1.25rem; }

        /* 알약형 배지 (SIDES 색). card-badge 와 달리 위치 고정이 아니라 흐름 안에 놓임 */
        .pill {
            display: inline-block; padding: .375rem .875rem; font-size: .95rem; font-weight: 900; letter-spacing: 1.5px;
            border-radius: 1.875rem; color: #fff; background: var(--side-color, #5352ed);
        }
        .slide-header-right { display: flex; align-items: center; gap: 1.25rem; }
        .slide-presenter { font-size: 1rem; font-weight: 700; letter-spacing: 3px; color: #2ed573; text-transform: uppercase; }
        .slide-note { margin-top: 1.5625rem; font-size: 1.4rem; color: rgba(255,255,255,0.5); font-weight: 300; line-height: 1.6; }

        /* 🎨 DESIGN [keyfacts] 옅은 유리 카드 + 큰 숫자(900). 이전 값은 취소선+흐리게, 현재 값은 SIDES 색 */
        .kf-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 2.1875rem; width: 100%; margin-top: .625rem; }
        .kf-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem;
            padding: 2.2rem 2.2rem 2rem; display: flex; flex-direction: column; gap: .9rem;
        }
        .kf-label { font-size: 1.05rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
        .kf-flow { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
        .kf-from { font-size: 2rem; font-weight: 300; color: rgba(255,255,255,0.3); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.25); }
        .kf-arrow { font-size: 1.6rem; color: #2ed573; }
        .kf-to { font-size: 3.8rem; font-weight: 900; line-height: 1; letter-spacing: -1px; color: var(--side-color, #fff); }
        .kf-change { align-self: flex-start; padding: .375rem .875rem; border-radius: 1.875rem; font-size: 1rem; font-weight: 900; letter-spacing: 1.5px; color: #fff; background: var(--side-color, #5352ed); }
        .kf-desc { font-size: 1.3rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.6); }

        /* 🎨 DESIGN [stakeholders] 비교 카드와 같은 유리 카드. 상단 알약 배지 → 이름(900) → 직함 → 이탤릭 인용문(초록 따옴표) */
        .sh-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 1.5rem 2.1875rem; width: 100%; }
        .sh-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem;
            padding: 1.6rem 1.9rem; display: flex; flex-direction: column; gap: .55rem;
        }
        .sh-who  { font-size: 1.7rem; font-weight: 900; color: #fff; margin-top: .35rem; }
        .sh-role { font-size: 1.05rem; letter-spacing: 1px; color: rgba(255,255,255,0.4); }
        .sh-quote { margin-top: .5rem; font-size: 1.3rem; font-style: italic; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.75); }
        .sh-quote::before { content: "“"; color: #2ed573; opacity: .6; font-size: 2rem; line-height: 0; vertical-align: -.45rem; margin-right: .25rem; font-style: normal; }

        /* 🎨 DESIGN [timeline] 옅은 가로선 위에 점. hl 항목은 초록 점(깜빡임) + 초록 날짜 */
        .tl-wrap { position: relative; width: 100%; margin-top: 2.5rem; }
        .tl-line { position: absolute; top: .4375rem; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.12); }
        .tl-row { position: relative; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 1.875rem; }
        .tl-item { position: relative; padding-top: 2.2rem; }
        .tl-dot { position: absolute; top: 0; left: 0; width: .875rem; height: .875rem; border-radius: 50%; background: #050505; border: 2px solid rgba(255,255,255,0.4); }
        .tl-item.hl .tl-dot { background: #2ed573; border-color: #2ed573; box-shadow: 0 0 .9rem rgba(46,213,115,0.6); animation: dot-pulse 1.5s infinite ease-in-out; }
        .tl-date  { font-size: 2.2rem; font-weight: 900; line-height: 1.1; color: #fff; }
        .tl-item.hl .tl-date { color: #2ed573; }
        .tl-title { font-size: 1.5rem; font-weight: 700; margin: .6rem 0 .4rem; color: #fff; }
        .tl-desc  { font-size: 1.3rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.6); }

        /* 🎨 DESIGN [questionnaire] 목차 카드처럼 큰 번호(Q1) + 굵은 질문 + 초록 라벨의 목적 + 오른쪽 응답 유형 알약 */
        .qn-list { display: flex; flex-direction: column; width: 100%; border-top: 1px solid rgba(255,255,255,0.06); }
        .qn-row { display: flex; align-items: center; gap: 2.2rem; padding: 1.1rem .5rem; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .qn-num { min-width: 5.5rem; font-size: 3rem; font-weight: 900; color: rgba(255,255,255,0.12); }
        .qn-body { flex: 1; }
        .qn-q { font-size: 1.9rem; font-weight: 700; line-height: 1.35; color: #fff; }
        .qn-purpose { margin-top: .35rem; font-size: 1.25rem; font-weight: 300; color: rgba(255,255,255,0.55); }
        .qn-purpose b { margin-right: .6rem; font-size: .95rem; font-weight: 700; letter-spacing: 2px; color: #2ed573; }
        .qn-type { white-space: nowrap; padding: .375rem .875rem; font-size: .95rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 1.875rem; }

        /* 🎨 DESIGN [respondents] 왼쪽 프로필 카드 그리드 + 오른쪽 요약 카드(가로 막대, 슬라이드 활성화 시 채워짐) */
        .rs-body { display: flex; gap: 2.1875rem; width: 100%; align-items: flex-start; }
        .rs-grid { flex: 2.2; display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 1.1rem; align-content: start; }
        .rs-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.25rem; padding: 1.1rem 1.3rem; }
        .rs-id   { font-size: .95rem; font-weight: 900; letter-spacing: 2px; color: #2ed573; }
        .rs-main { margin: .3rem 0 .2rem; font-size: 1.5rem; font-weight: 700; color: #fff; }
        .rs-sub  { font-size: 1.1rem; font-weight: 300; line-height: 1.5; color: rgba(255,255,255,0.5); }
        .rs-by   { margin-top: .6rem; font-size: .9rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.3); }
        .rs-summary { flex: 1; }
        .bar-row   { margin: .55rem 0 .7rem; }
        .bar-label { display: flex; justify-content: space-between; font-size: 1.1rem; color: rgba(255,255,255,0.7); }
        .bar-track { height: .5rem; margin-top: .35rem; border-radius: 1rem; background: rgba(255,255,255,0.06); overflow: hidden; }
        .bar-fill  { width: 0; height: 100%; border-radius: 1rem; background: var(--side-color, #5352ed); transition: width 1s cubic-bezier(0.22,1,0.36,1) .3s; }
        .slide.active .bar-fill { width: var(--w); }

        /* 🎨 DESIGN [findings] 차트 카드(chart-card 재사용: 아래에서 올라오며 순차 등장) + 요약 한 줄 + 하단 인용 띠 */
        .fd-grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 1.5625rem; width: 100%; }
        .fd-card .canvas-container { min-height: 12rem; }
        .fd-take { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid rgba(255,255,255,0.06); font-size: 1.3rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.7); }
        .fd-take b { margin-right: .6rem; font-size: .95rem; font-weight: 700; letter-spacing: 2px; color: #2ed573; }
        .fd-quotes { display: flex; gap: 1.5625rem; width: 100%; margin-top: 1.5625rem; }
        .fd-quote { flex: 1; padding: .2rem 0 .2rem 1.2rem; border-left: 2px solid #2ed573; font-size: 1.35rem; font-style: italic; font-weight: 300; line-height: 1.55; color: rgba(255,255,255,0.75); }
        .fd-quote span { display: block; margin-top: .4rem; font-size: .95rem; font-style: normal; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.4); }

        /* 🎨 DESIGN [sources] 번호(초록) + 제목(700) + 출처 메타(300, 흐리게) */
        .src-list { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 0 3.125rem; width: 100%; }
        .src-item { display: flex; gap: 1.2rem; padding: .9rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .src-idx   { padding-top: .2rem; font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; color: #2ed573; }
        .src-title { font-size: 1.6rem; font-weight: 700; line-height: 1.4; color: #fff; }
        .src-meta  { margin-top: .2rem; font-size: 1.15rem; font-weight: 300; color: rgba(255,255,255,0.6); word-break: break-all; }

        /* ============================================================
         *  14. 발표 도구: 발표자 노트(N) / 타이머(T, R)
         * ============================================================ */
        .notes-panel {
            position: fixed; left: 15%; right: 15%; bottom: 1.5rem; z-index: 10002;
            background: rgba(9,9,9,0.94); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.25rem;
            padding: 1.5rem 2rem; backdrop-filter: blur(10px);
            opacity: 0; transform: translateY(1rem); pointer-events: none; transition: opacity .3s ease, transform .3s ease;
        }
        .notes-panel.show { opacity: 1; transform: none; }
        .notes-head { display: flex; justify-content: space-between; margin-bottom: .75rem; font-size: .75rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #2ed573; }
        .notes-body { font-size: 1.15rem; font-weight: 300; line-height: 1.7; color: rgba(255,255,255,0.8); }
        .notes-warn { margin-top: .75rem; font-size: .95rem; letter-spacing: 1px; color: rgba(255,255,255,0.5); }
        .timer-hud {
            position: fixed; top: .9rem; left: 50%; transform: translateX(-50%); z-index: 10002;
            padding: .4rem 1.1rem; font-size: .9rem; font-weight: 700; letter-spacing: 3px; font-variant-numeric: tabular-nums;
            color: rgba(255,255,255,0.55); background: rgba(9,9,9,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem;
            opacity: 0; pointer-events: none; transition: opacity .3s ease;
        }
        .timer-hud.show { opacity: 1; }
        .timer-hud .t { color: rgba(255,255,255,0.9); }
        .timer-hud.ok .t { color: #2ed573; }                              /* 목표 시간대(min~max) 안 = 초록 */
        .timer-hud.over .t { color: #fff; animation: blink 1s infinite; }  /* max 초과 = 깜빡임 */

        /* ============================================================
         *  15. 단계(build) 애니메이션 + 강조 비교(emphasis)  (v1.2)
         * ============================================================ */
        /* 🎨 DESIGN [build] data-step 이 붙은 요소는 처음엔 숨겨졌다가(.on 이 붙으면) 아래에서 올라오며 나타남.
         *   :not(.on) + !important 로 chart-card 등 기존 등장 규칙보다 우선. 효과는 슬라이드의 bx-* 클래스로 바뀜. */
        .slide [data-step] { transition: opacity .6s ease, transform .6s cubic-bezier(0.22,1,0.36,1); }
        .slide [data-step]:not(.on) { opacity: 0 !important; transform: translateY(1.25rem) !important; pointer-events: none; }
        .slide.bx-fade  [data-step]:not(.on) { transform: none !important; }
        .slide.bx-zoom  [data-step]:not(.on) { transform: scale(.85) !important; }
        .slide.bx-left  [data-step]:not(.on) { transform: translateX(-2.5rem) !important; }
        .slide.bx-right [data-step]:not(.on) { transform: translateX(2.5rem) !important; }
        .slide.no-tr, .slide.no-tr * { transition: none !important; }          /* 단계 상태를 보이지 않는 동안 즉시 되돌릴 때 사용 */
        .kf-card.on .kf-to, .slide.active .kf-card:not([data-step]) .kf-to { animation: kf-pop .7s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes kf-pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

        .step-dots { display: inline-flex; gap: .35rem; margin-right: 1rem; vertical-align: middle; }
        .step-dots i { width: .4rem; height: .4rem; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background .3s ease; }
        .step-dots i.on { background: #2ed573; }

        /* 🎨 DESIGN [emphasis] 왼쪽 무대(stage: 그래프) + 오른쪽 해설(큰 초록 숫자 + 설명 + 'NOT TO SCALE' 알약).
         *   클릭하면 강조 대상은 커지고 글로우, 나머지는 작아지고 어두워짐. 모든 변화는 .9s 이징 전환. */
        .em-body { display: flex; gap: 3.75rem; width: 100%; align-items: center; }
        .em-stage { flex: 1.7; position: relative; min-width: 0; }
        .em-side { flex: 1; display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
        .em-big  { font-size: 7rem; font-weight: 900; line-height: 1; letter-spacing: -2px; color: #2ed573; text-shadow: 0 0 30px rgba(46,213,115,0.35); transition: opacity .3s ease; }
        .em-text { font-size: 1.8rem; font-weight: 300; line-height: 1.6; color: rgba(255,255,255,0.75); transition: opacity .3s ease; }
        .em-tag  { align-self: flex-start; padding: .375rem .875rem; font-size: .95rem; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.5);
                   border: 1px solid rgba(255,255,255,0.15); border-radius: 1.875rem; opacity: 0; transition: opacity .6s ease; }
        .slide.em-scaled .em-tag { opacity: 1; }

        /* 막대: 높이는 가장 큰 값 = 100%. 첫 화면엔 25% 눈금선(통계 느낌)이 있고, 강조 상태에서는 사라짐 */
        .em-bars { display: flex; gap: 1.5rem; height: 27rem; padding-top: 4.5rem; align-items: stretch; }
        .em-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; transition: flex-grow .9s cubic-bezier(0.22,1,0.36,1); }
        .em-barwrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.15); }
        .em-barwrap::before { content: ''; position: absolute; inset: 0; transition: opacity .6s ease;
                              background: repeating-linear-gradient(to top, rgba(255,255,255,0.07) 0 1px, transparent 1px 25%); }
        .slide.em-scaled .em-barwrap::before { opacity: 0; }
        .em-bar { position: relative; width: 100%; height: 0; background: var(--ca); border: 2px solid var(--c); border-bottom: none; border-radius: .75rem .75rem 0 0;
                  transition: height .9s cubic-bezier(0.22,1,0.36,1), opacity .6s ease, box-shadow .6s ease; }
        .em-val { position: absolute; bottom: 100%; left: 0; right: 0; padding-bottom: .5rem; text-align: center; white-space: nowrap;
                  font-size: 1.4rem; font-weight: 900; color: #fff; transition: font-size .8s cubic-bezier(0.22,1,0.36,1); }
        .em-lbl { padding-top: .75rem; text-align: center; font-size: 1.35rem; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.7); }

        /* 도넛: SVG 원호. 강조 조각은 두꺼워지며 바깥으로 튀어나오고, 나머지는 얇아지고 흐려짐 */
        .em-donut-row { display: flex; align-items: center; gap: 2.5rem; }
        .em-donut-wrap { position: relative; flex: none; width: 24rem; aspect-ratio: 1 / 1; }
        .em-donut-wrap svg { width: 100%; height: 100%; overflow: visible; }
        .em-seg { fill: none; transition: stroke-width .9s cubic-bezier(0.22,1,0.36,1), opacity .6s ease, transform .9s cubic-bezier(0.22,1,0.36,1), stroke-dasharray 1s cubic-bezier(0.22,1,0.36,1); }
        .em-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
        .em-center b { font-size: 3.4rem; font-weight: 900; line-height: 1; color: #fff; transition: opacity .3s ease; }
        .em-center span { margin-top: .5rem; font-size: 1.05rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.5); transition: opacity .3s ease; }
        .em-legend { flex: 1; max-width: 18rem; display: flex; flex-direction: column; gap: .9rem; }
        .em-lg { display: flex; align-items: center; gap: .75rem; font-size: 1.4rem; color: rgba(255,255,255,0.8); transition: opacity .5s ease; }
        .em-lg i { width: .75rem; height: .75rem; border-radius: 50%; flex: none; }
        .em-lg span { flex: 1; font-weight: 300; }
        .em-lg b { font-weight: 900; }
        .em-lg.dim { opacity: .3; }

        /* 버블: 면적이 값에 비례. 강조 대상은 거대하게, 나머지는 작게 */
        .em-bubbles { display: flex; align-items: center; justify-content: center; gap: 2rem; height: 29rem; }
        .em-bubble { flex: none; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
                     background: var(--ca); border: 2px solid var(--c);
                     transition: width .9s cubic-bezier(0.22,1,0.36,1), height .9s cubic-bezier(0.22,1,0.36,1), opacity .6s ease, box-shadow .6s ease, transform .9s cubic-bezier(0.22,1,0.36,1); }
        .em-bubble b { font-weight: 900; line-height: 1; color: #fff; transition: font-size .9s cubic-bezier(0.22,1,0.36,1); }
        .em-bubble span { margin-top: .4rem; font-size: 1.05rem; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); transition: opacity .4s ease; }

    '<text x="640" y="520" fill="#ffffff" fill-opacity=".35" font-family="sans-serif" font-size="34" text-anchor="middle" letter-spacing="6">IMAGE 16:9</text></svg>');

// HTML 이스케이프 (제목/설명에 특수문자가 있어도 안전)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 이스케이프 + 줄바꿈(\n) → <br>
const txt = s => esc(s).replace(/\n/g, '<br>');
// 숫자를 두 자리 문자열로 (3 → '03')
const pad2 = n => String(n).padStart(2, '0');
// 'sideA' 같은 키 또는 '#hex' 를 실제 색으로
const colorOf = c => (SIDES[c] && SIDES[c].color) || c;
// '#rrggbb' + 투명도 → 'rgba(...)' (차트 채우기용)
function withAlpha(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h, 16);
    return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isMobile = () => window.matchMedia('(max-width: 800px)').matches;

/* ======================================================================
 *  1) 화면 크기 → 전체 배율 (모든 rem 크기가 이 값에 맞춰 커지고 작아짐)
 *     예) 1280x720 대형 스크린 → 0.667배 (1080p 와 똑같은 모양으로 축소)
 *         1024x768 (4:3)       → 너비 기준 0.533배 (세로는 여유 공간)
 * ====================================================================== */
let uiScale = 1;
function applyScale() {
    uiScale = isMobile() ? 1 :
        clamp(Math.min(window.innerWidth / DECK.designWidth, window.innerHeight / DECK.designHeight), DECK.minScale, DECK.maxScale);
    document.documentElement.style.fontSize = (16 * uiScale) + 'px';
}
applyScale();   // 첫 화면이 깜빡이지 않도록 가장 먼저 실행

// 🎨 새로운 슬라이드 type 을 만들 때: 아래 BUILDERS 에 함수를 추가하고, 파일 맨 위 "DESIGN LANGUAGE" 의 색/타이포/카드 규칙을 따를 것.
//    (공통 헤더/푸터는 아래 "슬라이드 전체 조립" 단계에서 자동으로 붙으므로 본문 영역만 만들면 됨)
// 슬라이드 종류별 "본문" HTML 만드는 함수들. 인자: (슬라이드 데이터, 슬라이드 번호)
// 저울(scale): 단계별 동전 수/기울기 계획. 상태 0 = 왼쪽만 쌓임, 이후 steps[k-1] 의 {left, right, tilt} (생략 시 자동)
function scalePlan(s) {
    const ratio = (+s.right.value || 1) / (+s.left.value || 1), ex = s.exaggerate != null ? s.exaggerate : 20;   // 클수록 오른쪽 동전이 더 많아짐
    const lc = s.left.coins != null ? s.left.coins : 4;
    const rc = s.right.coins != null ? s.right.coins
        : (ratio >= 1 ? clamp(Math.round(lc * (1 + (ratio - 1) * ex)), lc + 2, 30) : clamp(Math.round(lc * (1 + (ratio - 1) * ex)), 1, Math.max(1, lc - 1)));
    const steps = (s.steps && s.steps.length ? s.steps : [{}]);
    const states = [{ L: lc, R: 0 }, ...steps.map(st => ({ L: st.left != null ? st.left : lc, R: st.right != null ? st.right : rc, tilt: st.tilt }))];
    return { states, maxL: Math.max(...states.map(x => x.L)), maxR: Math.max(...states.map(x => x.R)) };
}

                        <g class="sc-beam" style="transform-origin:400px 110px">
                            <line x1="130" y1="110" x2="670" y2="110" stroke="rgba(255,255,255,0.75)" stroke-width="7" stroke-linecap="round"/>

                </div>
