<!--
    Korea & Ireland: The Same Moon — 발표용 단일 페이지 프레젠테이션 (리팩토링 버전)

    ★ 수정 방법 요약 ★
      - 내용(문구/이미지/차트 수치/슬라이드 추가·삭제)은 아래 <script> 맨 위의 "★ 수정 영역"만 고치세요.
        슬라이드 HTML, 목차(TOC), 페이지 번호(n / N), 슬라이드 이동 규칙은 전부 자동 생성됩니다.
      - 화면 크기: 1920x1080 을 기준으로 디자인하고, 실제 화면이 그보다 작거나 해상도가 낮으면
        (예: 1280x720 대형 스크린) 모든 글자/여백/이미지가 같은 비율로 자동 축소·확대됩니다.

    조작: 클릭/→/Space/Enter 다음 슬라이드, 우클릭/← 이전 슬라이드(본문에서 우클릭은 목차로 복귀), Esc 커서 핑 이펙트
-->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korea & Ireland: The Same Moon</title>

    <!-- 차트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- 폰트 (원본 @import 의 오타 'wght=' 를 바로잡아 <link> 로 교체) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,700;0,900;1,300&family=Noto+Sans+KR:wght@300;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
         *  0. 크기 체계 (가장 중요!)
         *  - 모든 크기를 rem 으로 씁니다. (1rem = 기본 16px, 1920x1080 기준)
         *  - JS(applyScale)가 <html> 의 font-size 를 화면 크기에 맞춰 바꾸므로
         *    rem 으로 쓴 모든 요소가 한꺼번에 비례해서 커지고 작아집니다.
         *  - 새로 CSS 를 쓸 때도 px 대신 rem 을 쓰세요. (px ÷ 16 = rem)
         * ============================================================ */
        html { font-size: 16px; } /* JS가 덮어씀. JS 실행 전 기본값 */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Poppins', 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        /* ============================================================
         *  1. 커스텀 마우스 커서 (기본 포인터는 숨김)
         * ============================================================ */
        body, .presentation, .slide, .toc-card, .unified-card, canvas, #image-modal, .card-image-wrapper, .hidden-jump-btn {
            cursor: none !important;
        }
        .custom-cursor {
            position: fixed; top: 0; left: 0;
            width: .875rem; height: .875rem;
            background-color: rgba(255, 255, 255, 0.1);           /* 기본: 반투명 회색 */
            border-radius: 50%;
            pointer-events: none; z-index: 10001;
            transform: translate(-50%, -50%);
            transition: width .3s cubic-bezier(0.25, 1, 0.5, 1), height .3s cubic-bezier(0.25, 1, 0.5, 1),
                        background-color .3s ease, border .3s ease;
        }
        /* 클릭 가능한 요소 위: 커지고 선명해짐 */
        .custom-cursor.hover-active {
            width: 3.125rem; height: 3.125rem;
            background-color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* 클릭 중: 맑은 초록색 원 */
        .custom-cursor.click-active {
            width: 4.0625rem; height: 4.0625rem;
            background-color: rgba(46, 213, 115, 0.15);
            border: 2px solid rgba(46, 213, 115, 0.35);
        }
        /* Esc 핑 효과 */
        .cursor-ping {
            position: fixed; top: 0; left: 0;
            width: 3.75rem; height: 3.75rem;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none; z-index: 10000;
            transform: translate(-50%, -50%) scale(0); opacity: 0;
        }
        .cursor-ping.animate { animation: ping-burst .5s ease-out forwards; }
        @keyframes ping-burst {
            0%   { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            10%  { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.0); opacity: 0; }
        }

        /* ============================================================
         *  2. 프레젠테이션 / 슬라이드 공통
         *  - 슬라이드는 전부 겹쳐 놓고 .active 인 것만 보이게 합니다.
         * ============================================================ */
        .presentation { position: relative; width: 100vw; height: 100vh; }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden;
            transition: opacity .6s ease, visibility .6s ease;
            padding: 3.75rem 5rem;
            display: flex; flex-direction: column;
        }
        .slide.active { opacity: 1; visibility: visible; }
        /* 지정된 슬라이드 사이(데이터의 fade:true)에서만 쓰는 느린 페이드 */
        .slide.fade-transition { transition: opacity .8s cubic-bezier(0.25, 1, 0.5, 1), visibility .8s; }

        /* 공통 헤더/푸터 */
        .slide-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: .9375rem; z-index: 10;
        }
        .slide-tag { font-size: .85rem; font-weight: 700; letter-spacing: 2px; color: rgba(255, 255, 255, 0.6); }
        .slide-tag span { color: #5352ed; }
        .slide-footer {
            position: absolute; bottom: 1.875rem; left: 5rem; right: 5rem;
            display: flex; justify-content: space-between; align-items: center;
            font-size: .85rem; color: rgba(255, 255, 255, 0.4); z-index: 10;
        }

        /* ============================================================
         *  3. 타이포그래피 & 본문 레이아웃
         * ============================================================ */
        .content-container {
            flex: 1; display: flex; align-items: flex-start;
            gap: 3.125rem; padding: 3.75rem 0 5rem 0;
            position: relative; width: 100%; overflow: hidden;
        }
        .content-container.column { flex-direction: column; align-items: flex-start; justify-content: flex-start; }
        .left-col  { flex: 1; padding-left: 0; }
        .right-col { flex: 1.2; display: flex; justify-content: center; align-items: center; position: relative; align-self: center; }

        h1.main-title {
            font-size: 4.8rem; font-weight: 900; line-height: 1.3;
            margin-bottom: 1.5625rem; letter-spacing: -1px;
            position: relative; z-index: 100; opacity: 1;
        }
        /* 카드가 들어가는 본문(chapter) 슬라이드는 제목을 줄여 카드 공간을 확보 */
        .slide.chapter h1.main-title { font-size: 3rem; margin-bottom: 1.25rem; }

        /* 제목 끝의 점: 숨쉬듯 깜빡임 (원본엔 keyframes 정의가 빠져 있어 새로 추가) */
        .dot { color: #5352ed; display: inline-block; animation: dot-pulse 1.5s infinite ease-in-out !important; }
        @keyframes dot-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.25); } }

        p.description { font-size: 1.6rem; color: rgba(255, 255, 255, 0.7); line-height: 1.7; }

        /* ============================================================
         *  4. 비주얼 오브젝트 (빛 구체, 거대 글자)
         * ============================================================ */
        .glow-sphere {
            position: absolute; width: 18.75rem; height: 18.75rem;
            background: radial-gradient(circle, rgba(83, 82, 237, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(1.25rem); animation: pulse 4s infinite alternate;
        }
        .glow-sphere.cover {
            width: 28.125rem; height: 28.125rem;
            background: radial-gradient(circle, rgba(46,213,115,0.25) 0%, rgba(83,82,237,0.15) 50%, rgba(0,0,0,0) 70%);
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.2); opacity: .9; } }

        .giant-text-wrapper { display: flex; flex-direction: column; gap: .625rem; text-align: center; }
        .giant-text { font-size: 10rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; line-height: .9; }
        .giant-text.outline { color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2); }
        .giant-text.fill {
            color: #f0f0f0;
            text-shadow: 0 0 15px rgba(255,255,255,0.3), 0 0 40px rgba(255,255,255,0.2), 0 0 80px rgba(255,255,255,0.1);
            animation: glow-pulse 3s infinite alternate ease-in-out;   /* 3초 주기로 숨쉬는 빛 */
        }
        @keyframes glow-pulse {
            from { text-shadow: 0 0 10px rgba(255,255,255,0.1), 0 0 20px rgba(255,255,255,0.05), 0 0 40px rgba(255,255,255,0.02); }
            to   { text-shadow: 0 0 30px rgba(255,255,255,0.6), 0 0 100px rgba(255,255,255,0.4), 0 0 300px rgba(255,255,255,0.3); }
        }

        /* ============================================================
         *  5. 비교 카드 그리드 (chapter 슬라이드)
         *  - 카드 장수(1~4+)에 맞춰 열 수(--cols)를 JS가 지정합니다.
         *  - 카드 색(배지)은 --side-color 로 국가별 색을 받습니다 (SIDES 설정).
         * ============================================================ */
        .unified-grid {
            display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
            gap: 2.1875rem; width: 100%; opacity: 1; transition: opacity .4s ease;
        }
        .unified-grid[data-n="1"] { max-width: 56rem; }      /* 카드 1장이면 너무 커지지 않게 */
        .card-image-wrapper {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            overflow: hidden; background-color: #111; flex-shrink: 0;
        }
        .unified-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem; overflow: hidden;
            display: flex; flex-direction: column; height: 100%;
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; opacity: .75; transition: transform .5s ease; }
        .unified-card:hover .card-img { transform: scale(1.05); }
        .card-badge {
            position: absolute; top: 1.25rem; left: 1.25rem;
            padding: .375rem .875rem; font-size: .75rem; font-weight: 900; letter-spacing: 1.5px;
            border-radius: 1.875rem; z-index: 2; color: #fff; background: var(--side-color, #5352ed);
        }
        .card-info { padding: 1.5625rem 1.875rem; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-info h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: .625rem; color: #fff; }
        .card-info p  { font-size: .95rem; color: rgba(255, 255, 255, 0.6); line-height: 1.6; font-weight: 300; }

        /* ============================================================
         *  6. 결론 슬라이드
         * ============================================================ */
        .conclusion-list { list-style: none; display: flex; flex-direction: column; gap: .9375rem; }
        .conclusion-list li {
            font-size: 1.5rem; color: rgba(255, 255, 255, 0.8);
            padding-left: 1.5625rem; position: relative; font-weight: 300;
        }
        .conclusion-list li::before { content: "✓"; position: absolute; left: 0; color: #2ed573; font-weight: 900; }
        .conclusion-list li strong { color: #fff; font-weight: 700; margin-right: .625rem; }

        .slide.conclusion { overflow: hidden; }
        .conclusion-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transform: scaleX(-1);                                  /* 좌우 반전 */
            opacity: 0; transition: opacity 1.5s ease-in-out;
            z-index: 0; pointer-events: none;
        }
        .slide.conclusion.active .conclusion-bg { opacity: .35; }   /* 활성화되면 서서히 나타남 */
        .slide.conclusion .content-container { z-index: 1; background: transparent; gap: 2.5rem; }
        .conclusion-body-wrapper { display: flex; align-items: stretch; gap: 3.75rem; width: 100%; }
        .conclusion-left-body  { flex: 1.2; display: flex; flex-direction: column; justify-content: space-between; }
        .conclusion-right-body { flex: 1; display: flex; align-items: stretch; }
        .conclusion-left-body .description { margin-top: 1.25rem; padding-top: 1.875rem; font-size: 1.2rem; line-height: 1.6; }
        .final-quote-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.5rem; padding: 5.4rem 6rem; text-align: center; width: 100%;
            min-height: 12.5rem; max-height: 80%; position: relative;
            display: flex; justify-content: center; align-items: center;
        }
        .final-quote-card::before, .final-quote-card::after {
            content: "“"; position: absolute; font-size: 5rem; font-family: 'Poppins', sans-serif;
            color: #2ed573; opacity: .4;
        }
        .final-quote-card::before { top: 1.875rem; left: 2.5rem; }
        .final-quote-card::after  { bottom: 1.875rem; right: 2.5rem; transform: rotate(180deg); }   /* 대칭 */
        .final-quote-card p { font-size: 1.9rem; font-weight: 700; line-height: 1.5; color: #fff; font-style: italic; }

        /* ============================================================
         *  7. 이미지 확대 라이트박스
         * ============================================================ */
        .img-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity .4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .img-modal.active { opacity: 1; pointer-events: auto; }
        .img-modal img {
            max-width: 85%; max-height: 85%; object-fit: contain; border-radius: 1rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); transform: scale(.9) translateY(1.25rem);
            transition: transform .4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .img-modal.active img { transform: scale(1) translateY(0); }

        /* ============================================================
         *  8. 목차(TOC) 슬라이드: 좌(제목) / 우(챕터 카드 목록)
         * ============================================================ */
        #slide-toc .content-container {
            position: absolute; top: 3.75rem; left: 0; width: 100%; height: calc(100% - 7.1875rem);
            padding: 0; gap: 0; display: flex;
        }
        .toc-left {
            flex: 1; height: 100%; padding: 3.75rem 3.75rem 2.8125rem 5rem;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
            background: linear-gradient(to bottom, rgba(5,5,5,1), rgba(12,20,15,1));
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .category-tag { color: #2ed573; font-size: .85rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; margin-bottom: .9375rem; }
        .toc-footer-stats { display: flex; gap: 3.75rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.5625rem; }
        .toc-footer-stats .num { font-size: 2.5rem; font-weight: 900; color: #2ed573; line-height: 1; }
        .toc-footer-stats .lbl { font-size: .8rem; color: rgba(255,255,255,0.4); margin-top: .5rem; letter-spacing: 1px; }

        .toc-right {
            /* 챕터 개수에 따라 JS가 --cols(열 수), --k(글자/여백 배율)를 지정 → 몇 개를 넣어도 칸이 균등하게 나뉨 */
            flex: 1.2; height: 100%; background: #090909; transition: opacity .4s ease;
            display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
        }
        .toc-card {
            border-bottom: 1px solid rgba(255,255,255,0.04); padding: 0 calc(3.75rem * var(--k, 1)); min-height: 0;
            display: flex; align-items: center; gap: calc(2.5rem * var(--k, 1)); position: relative; transition: background-color .4s ease;
        }
        .toc-card::before {                                         /* 호버 시 왼쪽에 나타나는 초록 막대 */
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background-color: #2ed573; transform: scaleY(0); transition: transform .3s ease;
        }
                .toc-card:hover { background: rgba(46,213,115,0.02); }
        .toc-card:hover::before { transform: scaleY(1); }
        .toc-num { font-size: calc(3.5rem * var(--k, 1)); font-weight: 900; color: rgba(255,255,255,0.04); transition: color .3s ease, transform .3s ease; }
        .toc-card:hover .toc-num { color: rgba(46,213,115,0.2); transform: scale(1.05); }
        .toc-info { flex: 1; }
        .toc-step { font-size: calc(.8rem * var(--k, 1)); color: #2ed573; font-weight: 700; letter-spacing: 2px; margin-bottom: .5rem; }
        .target-anchor { font-size: calc(1.5rem * var(--k, 1)); color: #fff; margin-bottom: calc(.625rem * var(--k, 1)); font-weight: 900; display: block; line-height: 1.3; }
        .toc-info p { font-size: calc(1.3rem * var(--k, 1)); color: rgba(255,255,255,0.5); line-height: 1.5; }
        .toc-arrow { font-size: calc(1.8rem * var(--k, 1)); color: rgba(255,255,255,0.1); transition: all .3s ease; }
        .toc-card:hover .toc-arrow { color: #2ed573; transform: translateX(.5rem); }

        /* 목차 좌측 하단의 숨겨진 '결론으로 이동' 버튼 (마우스를 올리면 보임) */
        .hidden-jump-btn {
            position: absolute; bottom: 2.8125rem; left: 38%; width: 12.5rem; height: 2.5rem; z-index: 100;
            opacity: 0; border: none; background: none; transition: opacity .3s ease;
            font-weight: bold; color: #8888883e; font-size: 1.2rem; padding: .625rem;
        }
        .hidden-jump-btn:hover { opacity: 1; }

        /* ============================================================
         *  9. 차트 대시보드 슬라이드 (카드 수에 맞춰 열 수 자동: --cols)
         * ============================================================ */
        .chart-dashboard { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 1.5625rem; width: 100%; height: 75%; }
        .chart-card {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.25rem; padding: 1.5625rem; display: flex; flex-direction: column;
            opacity: 0; transform: translateY(1.25rem);
            transition: opacity .8s cubic-bezier(0.22,1,0.36,1), transform .8s cubic-bezier(0.22,1,0.36,1);
        }
        .slide.active .chart-card { opacity: 1; transform: translateY(0); }
        .slide.active .chart-card:nth-child(1) { transition-delay: .1s; }
        .slide.active .chart-card:nth-child(2) { transition-delay: .2s; }
        .slide.active .chart-card:nth-child(3) { transition-delay: .3s; }
        .slide.active .chart-card:nth-child(4) { transition-delay: .4s; }
        .chart-card h4 { font-size: 1.3rem; color: rgba(255,255,255,0.7); margin-bottom: 1.25rem; font-weight: 500; border-left: 3px solid #5352ed; padding-left: .625rem; }
        .canvas-container { position: relative; flex: 1; width: 100%; min-height: 13.75rem; }
        .info-summary-card { justify-content: space-between; }
        .metric-row { display: flex; flex-direction: column; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: .625rem; margin-bottom: .625rem; }
        .metric-row:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .m-title  { font-size: .8rem; color: rgba(255,255,255,0.4); margin-bottom: .25rem; }
        .m-values { font-size: .95rem; color: rgba(255,255,255,0.8); display: flex; gap: .5rem; }
        .m-values .bar { color: rgba(255,255,255,0.15); }
        .m-values .hl  { color: var(--side-color, #fff); font-weight: bold; }   /* 강조: 해당 국가 색 */

        /* ============================================================
         *  10. 표지 슬라이드 & 떠다니는 비눗방울
         * ============================================================ */
        .intro-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
        .intro-subtitle { font-size: 1.2rem; font-weight: 700; letter-spacing: .375rem; color: #2ed573; margin-bottom: 1.25rem; text-transform: uppercase; }
        .intro-title { font-size: 12rem; font-weight: 900; line-height: 1.15; letter-spacing: -2px; margin-bottom: 1.875rem; }
        .intro-desc  { font-size: 1.2rem; color: rgba(255,255,255,0.6); max-width: 37.5rem; line-height: 1.8; font-weight: 300; }
        .intro-hint  { position: absolute; bottom: 1.25rem; font-size: .85rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 이스케이프 + 줄바꿈(\n) → <br>

function withAlpha(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.replace(/./g, '$&$&') : h, 16);
    return `rgba(${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}, ${a})`;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

}

        <div class="content-container">
            <div class="left-col">
                <h1 class="main-title">${txt(s.title)}<span class="dot">.</span></h1>
                <p class="description">${txt(s.desc)}</p>
            </div>
            <div class="right-col"><div class="giant-text-wrapper">
                ${s.giant.map((g, k) => `<div class="giant-text ${k === s.giantFill ? 'fill' : 'outline'}">${esc(g)}</div>`).join('')}
            </div></div>
        </div>`,

    toc: s => {
        // 목차 카드는 chapter 슬라이드들에서 자동 수집 (data-target = 그 슬라이드의 번호)
        const chapters = SLIDES.map((c, idx) => ({ c, idx })).filter(o => o.c.type === 'chapter');
        const jumpIdx = SLIDES.map(c => c.type).lastIndexOf('conclusion');
        const stats = s.stats || [pad2(chapters.length), pad2(Object.keys(SIDES).length)];
        const labels = s.statLabels || ['Key Chapters', 'Nations'];
        // 챕터 개수에 맞춘 목차 밀도: 6개까지는 1열, 7개부터는 2열. 칸 수(rows)가 많을수록 글자/여백을 줄임.
        const nCh = chapters.length;
        const tocCols = nCh <= 6 ? 1 : 2;
        const tocRows = Math.ceil(nCh / tocCols);
        const tocK = clamp(3.2 / Math.max(tocRows, 1), 0.45, 1) * (tocCols === 2 ? 0.8 : 1);
        return `
        <div class="content-container">
            <div class="toc-left">
                <div class="toc-left-content">
                    <div class="category-tag">${esc(s.category)}</div>
                    <h1 class="main-title" id="toc-main-title">${txt(s.title)}<span class="dot">.</span></h1>
                    <p class="description" id="toc-description" style="max-width:90%">${txt(s.desc)}</p>
                </div>
                <div class="toc-footer-stats">
                    ${stats.map((n, k) => `<div class="stat-item"><span class="num">${esc(n)}</span><span class="lbl"> ${esc(labels[k] || '')}</span></div>`).join('')}
                </div>
                ${jumpIdx >= 0 ? `<button id="jump-to-end" class="hidden-jump-btn" data-target="${jumpIdx}">${esc(s.jumpLabel || 'Go to Conclusion')}</button>` : ''}
            </div>
            <div class="toc-right" id="toc-right-menu" style="--cols:${tocCols}; --k:${tocK.toFixed(3)}">
                ${chapters.map(({ c, idx }, k) => `
                <div class="toc-card" data-target="${idx}">
                    <div class="toc-num">${pad2(k + 1)}</div>
                    <div class="toc-info">
                        <div class="toc-step">CHAPTER ${pad2(k + 1)} — ${esc(c.tag)}</div>
                        <span class="target-anchor">${pad2(k + 1)}. ${txt(c.title)}</span>
                        <p>${txt(c.tocDesc)}</p>
                    </div>
                    <div class="toc-arrow">→</div>
                </div>`).join('')}
            </div>
        </div>`;
    },

    chapter: (s, i) => {
        // 챕터 번호: 챕터 슬라이드 중 몇 번째인지 (제목 앞 "01." 자동)
        const k = SLIDES.slice(0, i).filter(c => c.type === 'chapter').length + 1;
        const n = s.cards.length;
        const cols = n <= 4 ? n : Math.ceil(n / 2);           // 1~4장: 한 줄 / 5장 이상: 두 줄
        return `<div class="content-container column">
            <h1 class="main-title">${pad2(k)}. ${txt(s.title)}<span class="dot">.</span></h1>
            <div class="unified-grid" data-n="${n}" style="--cols:${cols}">
                ${s.cards.map(c => {
                    const side = SIDES[c.side] || { label: c.side || '', color: '#888' };
                    return `<div class="unified-card" style="--side-color:${side.color}">
                        <div class="card-image-wrapper">
                            <img src="${esc(c.img)}" alt="${esc(c.alt || c.title)}" class="card-img">
                            <div class="card-badge">${esc(side.label)}</div>
                        </div>
                        <div class="card-info"><h3>${txt(c.title)}</h3><p>${txt(c.desc)}</p></div>
                    </div>`;
                }).join('')}
            </div></div>`;
    },

    conclusion: s => `
        <div class="conclusion-bg" style="background-image:url('${esc(s.bg)}')"></div>
        <div class="content-container column" style="align-items:stretch">
            <h1 class="main-title" style="margin-bottom:0">${txt(s.title)}<span class="dot">.</span></h1>
            <div class="conclusion-body-wrapper">
                <div class="conclusion-left-body">
                    <ul class="conclusion-list" style="margin-top:.3rem">
                        ${s.bullets.map(b => `<li><strong>${esc(b.head)}</strong>: ${esc(b.text)}</li>`).join('')}
                    </ul>
                    <p class="description">${txt(s.desc)}</p>
                </div>
                <div class="conclusion-right-body"><div class="final-quote-card"><p>${txt(s.quote)}</p></div></div>
            </div>
        </div>`
};

// 슬라이드 전체 조립 (헤더/푸터는 공통)
const total = SLIDES.length - 1;   // 표지는 0번이라 "0 / 7" 처럼 표시 (원본과 동일)
SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = `slide ${s.type}${i === 0 ? ' active' : ''}`;
    el.id = 'slide-' + (s.key || (s.type === 'toc' ? 'toc' : i));
    el.dataset.type = s.type;
    // TOC 슬라이드는 헤더가 없는 디자인 (원본과 동일)
    const header = s.type === 'toc' ? '' : `
        <div class="slide-header">
            <div class="slide-tag">${esc(s.tag)} <span>${esc(DECK.tagSeparator)}</span> ${esc(s.num || pad2(i))}</div>
            <div>${esc(s.icon || '')}</div>
        </div>`;
    el.innerHTML = header + BUILDERS[s.type](s, i) +
        `<div class="slide-footer"><div>${esc(s.footer || '')}</div><div>${i} / ${total}</div></div>`;
    presentationEl.appendChild(el);
    if (s.type === 'charts') chartDefs[i] = s.charts;
});

/* ======================================================================
 *  3) 슬라이드 전환 로직
 *     (이동 규칙은 모두 SLIDES 데이터에서 자동 계산)
 * ====================================================================== */
const slides = document.querySelectorAll('.slide');
const TOC_INDEX = SLIDES.findIndex(s => s.type === 'toc');
let currentSlide = 0;
let flipBusy = false;   // 목차 ↔ 본문 전환 애니메이션 중에는 true → 그동안 클릭/키 입력을 무시해 애니메이션이 꼬이지 않게 함

// fade:true 인 두 슬라이드가 서로 이웃(번호 차이 1)일 때만 느린 페이드를 쓴다.
function checkAndApplyFadeEffect(from, to) {
    slides.forEach(el => el.classList.remove('fade-transition'));
    if (Math.abs(from - to) === 1 && SLIDES[from].fade && SLIDES[to].fade) {
        slides[from].classList.add('fade-transition');
        slides[to].classList.add('fade-transition');
    }
}

// index 번째 슬라이드로 이동 (범위를 벗어나면 순환). 차트 슬라이드로 들어가면 차트를 다시 그림.
function showSlide(index) {
    const next = (index + slides.length) % slides.length;
    checkAndApplyFadeEffect(currentSlide, next);
    slides[currentSlide].classList.remove('active');
    currentSlide = next;
    slides[currentSlide].classList.add('active');
    // 전환 애니메이션이 남겨 둔 인라인 투명도(opacity:0)를 정리한다.
    // (예: 목차 → 본문 → ← 키로 목차 복귀 시 목차 내용이 투명한 채 남는 문제 방지)
    // 애니메이션 도중(flipBusy)에는 애니메이션이 직접 관리하므로 건드리지 않는다.
    if (!flipBusy) resetFlipStyles();
    if (chartDefs[currentSlide]) setTimeout(() => renderCharts(currentSlide), 50);
}

function resetFlipStyles() {
    tocParts().forEach(el => { if (el) { el.style.transition = ''; el.style.opacity = ''; } });
    slides.forEach(sl => {
        if (sl.dataset.type !== 'chapter') return;
        const ti = sl.querySelector('.main-title'), gr = sl.querySelector('.unified-grid');
        if (ti) ti.style.opacity = '';
        if (gr) { gr.style.transition = ''; gr.style.opacity = ''; }
    });
}

// 이 슬라이드에서 화면 클릭으로 다음 장으로 넘어가도 되는가?
const canClickNext = i => SLIDES[i].clickNext !== false;

// 좌클릭 = 다음 슬라이드 (링크/버튼/카드/차트 등을 누른 경우는 제외)
document.addEventListener('click', e => {
    const interactive = e.target.closest('a, button, .toc-card, .unified-card, canvas, #image-modal');
    if (!flipBusy && !interactive && canClickNext(currentSlide)) showSlide(currentSlide + 1);
});

// 우클릭 = 이전. 단 본문(chapter)에서는 목차로 돌아가는 애니메이션
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (flipBusy) return;
    if (document.getElementById('image-modal').classList.contains('active')) return;   // 확대 중엔 무시
    if (SLIDES[currentSlide].type === 'chapter' && TOC_INDEX >= 0) animateSlideToTOC(slides[currentSlide]);
    else if (currentSlide > 0) showSlide(currentSlide - 1);
});

// 키보드: → / Space / Enter 다음, ← 이전
window.addEventListener('keydown', e => {
    if (flipBusy) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') showSlide(currentSlide + 1);
    else if (e.key === 'ArrowLeft') showSlide(currentSlide - 1);
});

/* ======================================================================
 *  4) 차트 (Chart.js) — 슬라이드에 들어올 때마다 새로 그려 애니메이션 재생
 * ====================================================================== */
let chartInstances = [];

function renderCharts(slideIdx) {
    if (typeof Chart === 'undefined') return;                 // 라이브러리 로딩 실패 시 조용히 건너뜀
    chartInstances.forEach(c => c.destroy());                 // 재방문 시 겹침 방지
    chartInstances = [];
    Chart.defaults.color = 'rgba(255, 255, 255, 0.6)';
    Chart.defaults.font.family = 'Poppins, sans-serif';
    Chart.defaults.font.size = Math.max(9, 13 * uiScale);     // 화면 배율에 맞춰 차트 글자도 비례

    (chartDefs[slideIdx] || []).forEach((def, k) => {
        const canvas = document.getElementById(`chart-${slideIdx}-${k}`);
        if (!canvas) return;
        const datasets = def.datasets.map(d => {
            if (def.type === 'bar') {
                const cols = (d.colors || [d.color]).map(colorOf);
                return { label: d.label, data: d.data, borderWidth: 2, borderRadius: 8,
                         backgroundColor: cols.map(c => withAlpha(c, .65)), borderColor: cols };
            }
            const c = colorOf(d.color);
            return { label: d.label, data: d.data, borderColor: c, backgroundColor: withAlpha(c, .1),
                     borderWidth: 3 * uiScale, tension: .3, fill: true };
        });
        chartInstances.push(new Chart(canvas.getContext('2d'), {
            type: def.type,
            data: { labels: def.labels, datasets },
            options: {
                animations: { y: { easing: 'easeOutQuart', duration: 1000, delay: 500 } },
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: def.legend ? { position: 'top', labels: { boxWidth: 12 } } : { display: false } },
                scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true } }
            }
        }));
    });
}

/* ======================================================================
 *  5) TOC ↔ 본문 FLIP 전환 애니메이션 (제목이 화면을 가로질러 날아가는 효과)
 *     위치/크기는 전부 실제 화면 좌표(getBoundingClientRect)로 계산하므로
 *     화면 배율(uiScale)이 달라져도 그대로 동작합니다.
 * ====================================================================== */

// 날아가는 임시 제목(flyer)을 서서히 지우고 제거
function removeFlyerWithFade(flyer) {
    flyer.classList.add('fade-out');
    flyer.addEventListener('transitionend', () => flyer.remove(), { once: true });
}

// 화살표 선을 곡선으로 그려나가는 애니메이션
function animateArrowTrace(startX, startY, endX, endY, isReverse = false, callback = null) {
    const path = document.querySelector('.trace-path');
    path.setAttribute('marker-end', isReverse ? 'url(#arrow-backward)' : 'url(#arrow-forward)');
    path.removeAttribute('marker-start');

    // 베지어 곡선의 제어점: 수평으로 휘어지며 이어짐 (정/역방향 모두 같은 수식)
    const c1x = startX + (endX - startX) * 0.4;
    const c2x = startX + (endX - startX) * 0.6;
    path.setAttribute('d', `M ${startX} ${startY} C ${c1x} ${startY}, ${c2x} ${endY}, ${endX} ${endY}`);

    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    requestAnimationFrame(() => {
        path.style.transition = 'stroke-dashoffset .6s cubic-bezier(0.25, 1, 0.5, 1)';
        path.style.strokeDashoffset = '0';
    });
    setTimeout(() => {
        if (callback) callback();
        path.style.transition = 'none';
        path.setAttribute('d', '');
        path.removeAttribute('marker-end');
    }, 600);
}

// 임시 제목(flyer) 하나를 만들어 body 에 붙임 (출발 위치/글자 스타일 복사)
function makeFlyer(html, rect, cs) {
    const f = document.createElement('div');
    f.className = 'flying-title';
    f.innerHTML = html;
    Object.assign(f.style, {
        position: 'fixed', left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', whiteSpace: 'normal',
        lineHeight: cs.lineHeight, fontSize: cs.fontSize, fontWeight: cs.fontWeight, letterSpacing: cs.letterSpacing, color: cs.color
    });
    document.body.appendChild(f);
    return f;
}
// flyer 를 도착 위치/글자 스타일로 이동시킴
function flyTo(f, rect, cs) {
    requestAnimationFrame(() => {
        f.style.transition = 'all .6s cubic-bezier(0.25, 1, 0.5, 1)';
        Object.assign(f.style, {
            left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px',
            lineHeight: cs.lineHeight, fontSize: cs.fontSize, fontWeight: cs.fontWeight, letterSpacing: cs.letterSpacing
        });
    });
}

// 목차 왼쪽/오른쪽 요소들 (전환 중 잠깐 숨겼다 보이게 함)
const tocParts = () => [document.getElementById('toc-main-title'), document.getElementById('toc-description'),
                        document.getElementById('toc-right-menu'), document.querySelector('#slide-toc .toc-footer-stats')];

// 목차 → 본문 (정방향)
function animateTOCToSlide(cardEl, targetIndex) {
    if (flipBusy) return;
    flipBusy = true;
    setTimeout(() => { flipBusy = false; }, 1500);          // 전체 애니메이션(약 1.4초)이 끝나면 해제
    const targetSlide = slides[targetIndex];
    const targetTitle = targetSlide.querySelector('.main-title');
    const targetGrid = targetSlide.querySelector('.unified-grid');
    const anchor = cardEl.querySelector('.target-anchor');
    const arrowRect = cardEl.querySelector('.toc-arrow').getBoundingClientRect();
    const originRect = anchor.getBoundingClientRect();
    const originCS = getComputedStyle(anchor);

    // 숨겨진 상태의 도착 슬라이드를 잠깐 레이아웃시켜 제목의 도착 위치/스타일을 측정
    targetSlide.style.visibility = 'hidden';
    targetSlide.style.display = 'flex';
    const targetRect = targetTitle.getBoundingClientRect();
    const targetCS = getComputedStyle(targetTitle);
    targetSlide.style.display = '';
    targetSlide.style.visibility = '';

    tocParts().forEach(el => { if (el) { el.style.transition = 'opacity .2s ease'; el.style.opacity = '0'; } });
    if (targetGrid) { targetGrid.style.transition = 'none'; targetGrid.style.opacity = '0'; }
    targetTitle.style.opacity = '0';

    setTimeout(() => {
        animateArrowTrace(arrowRect.left + arrowRect.width / 2, arrowRect.top + arrowRect.height / 2, targetRect.left, targetRect.bottom, false);
        const flyer = makeFlyer(targetTitle.innerHTML, originRect, originCS);
        flyTo(flyer, targetRect, targetCS);
        setTimeout(() => {
            showSlide(targetIndex);
            if (targetGrid) { targetGrid.style.transition = 'opacity .6s ease'; targetGrid.style.opacity = '1'; }
            setTimeout(() => { targetTitle.style.opacity = '1'; flyer.remove(); }, 600);
        }, 600);
    }, 200);
}

// 본문 → 목차 (역방향)
function animateSlideToTOC(slideEl) {
    if (flipBusy) return;
    flipBusy = true;
    setTimeout(() => { flipBusy = false; }, 1500);
    const title = slideEl.querySelector('.main-title');
    const grid = slideEl.querySelector('.unified-grid');
    const tocCard = document.querySelector(`.toc-card[data-target="${currentSlide}"]`);
    if (!tocCard) { flipBusy = false; showSlide(TOC_INDEX); return; }
    const anchor = tocCard.querySelector('.target-anchor');
    const arrowRect = tocCard.querySelector('.toc-arrow').getBoundingClientRect();
    const originRect = title.getBoundingClientRect();
    const originCS = getComputedStyle(title);
    const targetRect = anchor.getBoundingClientRect();
    const targetCS = getComputedStyle(anchor);

    tocParts().forEach(el => { if (el) { el.style.transition = 'none'; el.style.opacity = '0'; } });
    title.style.opacity = '0';
    if (grid) grid.style.opacity = '0';

    animateArrowTrace(originRect.left, originRect.bottom, arrowRect.left + arrowRect.width / 2, arrowRect.top + arrowRect.height / 2, false);
    const flyer = makeFlyer(title.innerHTML, originRect, originCS);
    showSlide(TOC_INDEX);
    flyTo(flyer, targetRect, targetCS);

    setTimeout(() => {
        tocParts().forEach(el => { if (el) { el.style.transition = 'opacity .4s ease'; el.style.opacity = '1'; } });
        setTimeout(() => { title.style.opacity = '1'; if (grid) grid.style.opacity = '1'; removeFlyerWithFade(flyer); }, 400);
    }, 600);
}

/* ======================================================================
 *  6) 초기화: 커서, 라이트박스, 목차 클릭, 리사이즈
 * ====================================================================== */
(function init() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const cursor = document.querySelector('.custom-cursor');

    // Esc 핑 이펙트용 요소
    const ping = document.createElement('div');
    ping.className = 'cursor-ping';
    document.body.appendChild(ping);

    // 커서/핑이 마우스를 따라다님
    document.addEventListener('mousemove', e => {
        requestAnimationFrame(() => {
            cursor.style.left = ping.style.left = e.clientX + 'px';
            cursor.style.top  = ping.style.top  = e.clientY + 'px';
        });
    });
    document.addEventListener('mousedown', () => cursor.classList.add('click-active'));
    document.addEventListener('mouseup',   () => cursor.classList.remove('click-active'));

    // 클릭 가능한 요소 위에서는 커서를 키움
    const hoverTargets = '.toc-card, .unified-card, canvas, #image-modal, .card-image-wrapper, .hidden-jump-btn';
    document.addEventListener('mouseover', e => { if (e.target.closest(hoverTargets)) cursor.classList.add('hover-active'); });
    document.addEventListener('mouseout',  e => { if (!e.target.closest(hoverTargets)) cursor.classList.remove('hover-active'); });

    // Esc: 마우스 위치에서 핑 애니메이션
    window.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        e.preventDefault();
        ping.classList.remove('animate');
        void ping.offsetWidth;            // 리플로우로 애니메이션 재시작
        ping.classList.add('animate');
    });

    // 목차 카드 클릭 → 해당 본문으로 FLIP 이동
    document.querySelectorAll('.toc-card').forEach(card => {
        card.addEventListener('click', () => animateTOCToSlide(card, parseInt(card.dataset.target)));
    });

    // 숨은 '결론으로 이동' 버튼
    const jump = document.getElementById('jump-to-end');
    if (jump) jump.addEventListener('click', e => { e.stopPropagation(); showSlide(parseInt(jump.dataset.target)); });

    // 카드 이미지 클릭 → 라이트박스 확대, 바깥 클릭 → 닫기
    document.querySelectorAll('.card-img').forEach(img => {
        img.addEventListener('click', e => {
            e.stopPropagation();
            modalImg.src = img.getAttribute('src');
            modal.classList.add('active');
        });
    });
    modal.addEventListener('click', () => {
        modal.classList.remove('active');
        setTimeout(() => { modalImg.src = ''; }, 400);
    });

    // 창 크기가 바뀌면(발표 화면 전환 등) 배율 재계산. 차트 슬라이드면 글자 크기 반영을 위해 다시 그림
    let t;
    window.addEventListener('resize', () => {
        clearTimeout(t);
        t = setTimeout(() => {
            applyScale();
            if (chartDefs[currentSlide]) renderCharts(currentSlide);
        }, 150);
    });
})();
</script>
</body>
</html>
